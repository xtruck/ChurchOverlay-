<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChurchOverlay — Caméra téléphone</title>
<!--
  ============================================================================
  phone-camera.html — Page ouverte en scannant le QR code (côté téléphone)
  ----------------------------------------------------------------------------
  AJOUT (demande explicite — "scanner un QR code, le téléphone est prêt à
  filmer, sans DroidCam ni IP à taper à la main"). Aucune app à installer :
  cette page tourne dans le navigateur du téléphone (Chrome/Safari mobile),
  utilise getUserMedia() exactement comme camera-capture.js côté PC, et
  envoie des images JPEG régulières au serveur ChurchOverlay plutôt qu'un
  flux vidéo complet — plus simple et plus robuste à construire qu'un pont
  WebRTC complet, largement suffisant pour une caméra d'église (pas de
  sport rapide à filmer).

  Flux : ?pair=<code>&q=<qualité> dans l'URL (générés par le tableau de
  bord, affichés en QR) → POST /phone-camera-pair (échange usage unique,
  voir phone-camera-pairing.js) → getUserMedia() → boucle canvas→JPEG→POST
  /phone-camera-frame/:id. Le serveur ré-expose ces images comme un flux
  MJPEG classique (GET /phone-camera-stream/:id) — le MÊME mécanisme que
  ip-camera-store.js pour les caméras IP tierces, donc réutilisable tel
  quel par le panneau "Caméras IP" du tableau de bord et par OBS.

  Fiabilité (demande explicite — "faire vraiment le travail") :
    - Le flux s'arrête et le dit CLAIREMENT si le secret devient invalide
      (caméra retirée côté opérateur, voir 403 dans captureFrame()) au lieu
      de continuer à envoyer pour rien indéfiniment.
    - Les tentatives d'envoi s'ESPACENT après des échecs consécutifs
      (Wi-Fi instable) plutôt que de marteler le réseau au rythme normal.
    - Le serveur (voir isFrameFresh() dans server.js) refuse de resservir
      une image trop ancienne — c'est ce qui permet au badge "En ligne/Hors
      ligne" du tableau de bord de détecter un téléphone mort, pas
      seulement une première connexion échouée.
  ============================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0a0e1c;
    color: #f6f3ec;
    font-family: 'Segoe UI', -apple-system, sans-serif;
    overflow: hidden;
  }
  #video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #status-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.75), transparent);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 600;
    z-index: 2;
  }
  #status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #f4607a;
    flex-shrink: 0;
    box-shadow: 0 0 8px #f4607a;
  }
  #status-dot.live {
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  #switch-camera-btn {
    margin-left: auto;
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.16);
    color: #f6f3ec;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #message {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    font-size: 17px;
    line-height: 1.5;
    z-index: 3;
    background: #0a0e1c;
  }
  #message.hidden { display: none; }
  #message strong { display: block; margin-bottom: 8px; font-size: 20px; }
</style>
</head>
<body>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">Connexion…</span>
  <button id="switch-camera-btn" type="button" title="Changer de caméra (avant/arrière)" style="display:none;">🔄</button>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="message">
  <div>
    <strong>Connexion à ChurchOverlay…</strong>
    <div id="message-detail">Merci de patienter.</div>
  </div>
</div>

<script>
'use strict';

function getPairCode() {
  return new URLSearchParams(window.location.search).get('pair');
}

// AJOUT (demande explicite — "plus de paramètres") : la qualité est choisie
// par l'opérateur AU MOMENT de générer le QR (voir generateCameraPairing()
// côté serveur) et voyage dans l'URL elle-même — le téléphone ne peut pas
// la demander à l'opérateur après coup, une fois la page ouverte. "Basse"
// vise un Wi-Fi d'église faible/saturé (plusieurs téléphones à la fois) ;
// "Haute" vise un meilleur rendu quand le réseau le supporte.
const QUALITY_PRESETS = {
  low: { width: 640, height: 360, intervalMs: 400, jpegQuality: 0.6 },
  medium: { width: 1280, height: 720, intervalMs: 200, jpegQuality: 0.72 },
  high: { width: 1920, height: 1080, intervalMs: 150, jpegQuality: 0.82 },
};
function getQualityPreset() {
  const key = new URLSearchParams(window.location.search).get('q');
  return QUALITY_PRESETS[key] || QUALITY_PRESETS.medium;
}

const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const messageEl = document.getElementById('message');
const messageDetail = document.getElementById('message-detail');
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const switchCameraBtn = document.getElementById('switch-camera-btn');

function setStatus(text, live) {
  statusText.textContent = text;
  statusDot.classList.toggle('live', !!live);
}

function showMessage(title, detail) {
  messageEl.classList.remove('hidden');
  messageEl.querySelector('strong').textContent = title;
  messageDetail.textContent = detail || '';
}

function hideMessage() {
  messageEl.classList.add('hidden');
}

const QUALITY = getQualityPreset();

let cameraId = null;
let streamSecret = null;
let captureTimer = null;
let sending = false;
let wakeLock = null;
let currentFacingMode = 'environment';
let stopped = false; // true une fois retirée par l'opérateur : plus aucune tentative d'envoi
// AJOUT (fiabilité — "ne pas marteler le réseau en boucle") : après des
// échecs consécutifs (Wi-Fi instable, coupure temporaire), on ESPACE les
// tentatives au lieu de continuer à en faire une toutes les 200/400/... ms
// pour rien — voir captureFrame() ci-dessous.
let consecutiveFailures = 0;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (_e) {
    // Best-effort : sans l'API Wake Lock (navigateur trop ancien, ou refusé
    // par l'OS), l'écran peut s'éteindre — pas bloquant, juste moins pratique.
  }
}

async function pairWithServer(pairCode) {
  const res = await fetch('/phone-camera-pair', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pairCode }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `Erreur serveur (${res.status})`);
  }
  return res.json();
}

async function startCamera(facingMode) {
  // Coupe proprement la piste précédente avant d'en démarrer une nouvelle
  // (changement de caméra à chaud) — même discipline que camera-capture.js
  // côté PC (startCapture()) pour ne jamais laisser deux caméras actives.
  if (video.srcObject) {
    video.srcObject.getTracks().forEach((track) => track.stop());
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: facingMode },
      width: { ideal: QUALITY.width },
      height: { ideal: QUALITY.height },
    },
    audio: false,
  });
  video.srcObject = stream;
  currentFacingMode = facingMode;
  await video.play();
}

// AJOUT (demande explicite — "plus de paramètres") : basculer caméra avant/
// arrière sans recharger la page ni re-scanner le QR — utile si le
// téléphone est repositionné en cours de culte, ou pour ajuster l'angle.
async function switchCamera() {
  const next = currentFacingMode === 'environment' ? 'user' : 'environment';
  try {
    await startCamera(next);
  } catch (_err) {
    // Certains téléphones n'ont qu'une seule caméra — retenter avec le
    // réglage précédent plutôt que de rester sans image du tout.
    try {
      await startCamera(currentFacingMode);
    } catch (_err2) {
      showMessage('Caméra indisponible', 'Impossible de basculer de caméra sur cet appareil.');
    }
  }
}

function captureFrame() {
  if (stopped || sending || video.videoWidth === 0) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(
    (blob) => {
      if (!blob || stopped) return;
      sending = true;
      fetch(`/phone-camera-frame/${cameraId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg', 'X-Stream-Secret': streamSecret },
        body: blob,
      })
        .then((res) => {
          if (res.status === 403) {
            // AJOUT (fiabilité — "ne pas continuer d'envoyer pour rien") :
            // 403 = secret de flux invalide, donc caméra retirée côté
            // tableau de bord (voir deleteIpCamera dans server.js, qui
            // invalide le secret) — plus aucune tentative n'aboutira
            // jamais, autant arrêter proprement et le dire clairement.
            stopped = true;
            clearTimeout(captureTimer);
            captureTimer = null;
            showMessage(
              'Caméra retirée',
              "L'opérateur a retiré cette caméra du tableau de bord. Scannez un nouveau QR code pour la reconnecter."
            );
            return;
          }
          consecutiveFailures = res.ok ? 0 : consecutiveFailures + 1;
          setStatus(res.ok ? 'En direct' : 'Erreur d’envoi — nouvelle tentative…', res.ok);
        })
        .catch(() => {
          consecutiveFailures++;
          setStatus('Connexion perdue — nouvelle tentative…', false);
        })
        .finally(() => {
          sending = false;
        });
    },
    'image/jpeg',
    QUALITY.jpegQuality
  );
}

async function main() {
  const pairCode = getPairCode();
  if (!pairCode) {
    showMessage(
      'Lien invalide',
      'Ouvrez cette page en scannant le QR code affiché dans le tableau de bord ChurchOverlay.'
    );
    return;
  }

  try {
    setStatus('Jumelage…', false);
    const pairing = await pairWithServer(pairCode);
    cameraId = pairing.cameraId;
    streamSecret = pairing.streamSecret;
  } catch (err) {
    showMessage(
      'Jumelage impossible',
      (err && err.message) ||
        'Le QR code a peut-être expiré (valable 10 minutes) — générez-en un nouveau depuis le tableau de bord.'
    );
    return;
  }

  try {
    setStatus('Démarrage de la caméra…', false);
    await startCamera(currentFacingMode);
  } catch (err) {
    const name = err && err.name;
    let detail = "Vérifiez l'autorisation caméra dans les réglages du navigateur.";
    if (name === 'NotFoundError') detail = 'Aucune caméra détectée sur cet appareil.';
    if (name === 'NotAllowedError') detail = "Autorisez l'accès à la caméra pour ce site, puis rechargez la page.";
    showMessage('Caméra indisponible', detail);
    return;
  }

  hideMessage();
  setStatus('En direct', true);
  requestWakeLock();
  switchCameraBtn.style.display = 'flex';
  switchCameraBtn.addEventListener('click', switchCamera);

  // AJOUT (fiabilité — "ne pas marteler le réseau en boucle") : setTimeout
  // auto-planifié plutôt que setInterval fixe, pour pouvoir ESPACER les
  // tentatives après des échecs consécutifs (voir consecutiveFailures dans
  // captureFrame ci-dessus) au lieu de continuer à réessayer toutes les
  // 200/400/... ms pendant une coupure réseau prolongée.
  function scheduleNextCapture() {
    if (stopped) return;
    const backoffMultiplier = Math.min(1 + consecutiveFailures, 5);
    captureTimer = setTimeout(() => {
      captureFrame();
      scheduleNextCapture();
    }, QUALITY.intervalMs * backoffMultiplier);
  }
  scheduleNextCapture();

  document.addEventListener('visibilitychange', () => {
    if (stopped) return;
    if (document.hidden) {
      clearTimeout(captureTimer);
      captureTimer = null;
      setStatus('En pause (écran non visible)', false);
    } else if (!captureTimer) {
      requestWakeLock();
      scheduleNextCapture();
    }
  });
}

main();
</script>

</body>
</html>
