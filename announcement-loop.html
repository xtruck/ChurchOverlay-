<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- AJOUT (audit sécurité Electron, Phase 3) : même politique et mêmes
     raisons que setup.html/stage-display.html (script inline existant,
     connect-src large pour le port serveur dynamique et les images
     média locales). -->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' http:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Diaporama annonces</title>
<!--
  ============================================================================
  announcement-loop.html — Présentation secondaire indépendante
  ----------------------------------------------------------------------------
  AJOUT (recommandation "présentation secondaire indépendante", ex. écran de
  hall pendant le culte principal) : cycle en boucle, côté client uniquement,
  à travers les éléments de la médiathèque marqués "Diaporama" (voir
  includeInLoop dans media-library.js / la case à cocher dans dashboard.html).

  Volontairement DÉCOUPLÉ du pipeline en direct : n'écoute JAMAIS
  'showVerse'/'showMedia'/'stageMessage'. Une seule lecture de la liste au
  chargement (pas de mise à jour en direct — rouvrir cette fenêtre après un
  ajout dans la médiathèque si besoin, cohérent avec le principe "boucle
  d'annonces préparée à l'avance", pas un flux piloté en direct).
  ============================================================================
-->
<link rel="stylesheet" href="design-tokens.css">
<style>
  /* CORRECTIF (chantier redesign — élévation de l'identité visuelle) :
     --mc-bg/--mc-text-dim (copies figées en dur) remplacés par
     design-tokens.css (--bg-base/--text-dim), même valeurs — voir son
     en-tête pour le raisonnement de consolidation. Cette page continue de
     n'utiliser AUCUNE couleur d'accent, volontairement (voir commentaire
     d'origine encore valable : le seul contenu textuel est le message
     "aucun média", délibérément discret — pas de septième copie de couleur
     à maintenir pour un élément qui n'en a jamais eu besoin). Le fond reste
     PLAT (pas de dégradé) : visible seulement en bordure d'un média qui ne
     remplit pas tout l'écran (object-fit: contain, inchangé) — un fond
     sombre y est la convention habituelle du letterboxing. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-base);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage img, #stage video {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  /* AJOUT (redesign) : l'état vide était jusqu'ici deux lignes de texte brut
     centrées — remplacé par un petit repère visuel (icône neutre, jamais un
     emoji — voir la règle "No Emoji as Structural Icons") + une hiérarchie
     typographique à deux niveaux (message principal / instruction), pour
     que cet écran, vu par un technicien qui vérifie la sortie avant le
     culte, se lise comme un vrai état d'application plutôt qu'un
     placeholder oublié. */
  /* CORRECTIF (redesign — trouvé en vérifiant visuellement) : cet état
     n'était jamais recentré sur l'écran (ni position ni display:flex sur
     lui-même) — seul text-align:center alignait le TEXTE dans sa propre
     boîte, la boîte elle-même restant collée en haut-gauche de la page.
     Repositionné en superposition plein écran, comme #stage, pour occuper
     réellement la même zone. */
  #empty {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-4);
    text-align: center;
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  }
  #empty.visible { display: flex; }
  #empty .empty-hint { max-width: 60vw; }
  #empty svg {
    width: 8vh;
    height: 8vh;
    color: var(--text-dim);
    opacity: 0.7;
  }
  #empty .empty-title {
    color: var(--text-muted);
    font-size: clamp(1.1rem, 2.4vh, var(--text-xl));
    font-weight: 600;
  }
  #empty .empty-hint {
    color: var(--text-dim);
    font-size: clamp(0.85rem, 1.6vh, var(--text-md));
    line-height: var(--leading-relaxed);
  }
</style>
</head>
<body>

<div id="stage">
  <img id="stageImg" alt="" hidden>
  <video id="stageVideo" hidden muted></video>
</div>
<div id="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <rect x="3" y="5" width="18" height="13" rx="2"></rect>
    <path d="M3 15l4.5-4.5a1.5 1.5 0 0 1 2.1 0L13 14"></path>
    <circle cx="16" cy="9" r="1.5"></circle>
    <path d="M9 21h6"></path>
  </svg>
  <div class="empty-title">Aucun média inclus dans le diaporama</div>
  <div class="empty-hint">Cochez « Diaporama » sur un élément de la médiathèque pour l'ajouter ici.</div>
</div>

<script>
'use strict';

// Identique à overlay.html — voir son commentaire pour le raisonnement complet.
const getWsToken = () => new URLSearchParams(window.location.search).get('token');
const getWsPort = () => new URLSearchParams(window.location.search).get('port') || '8765';
const getWsUrl = () => {
  if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${window.location.host}`;
  }
  return `ws://localhost:${getWsPort()}`;
};
const getHttpBase = () => {
  if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
    return window.location.origin;
  }
  return `http://localhost:${getWsPort()}`;
};

const DEFAULT_LOOP_DURATION_MS = 8000; // repli si l'élément n'a pas de displayDurationMs propre
let loopItems = [];
let loopIndex = 0;
let loopTimer = null;

function showLoopItem() {
  const img = document.getElementById('stageImg');
  const video = document.getElementById('stageVideo');
  video.playsInline = true;
  clearTimeout(loopTimer);

  if (loopItems.length === 0) {
    img.hidden = true;
    video.hidden = true;
    document.getElementById('empty').classList.add('visible');
    return;
  }
  document.getElementById('empty').classList.remove('visible');

  const item = loopItems[loopIndex % loopItems.length];
  const url = `${getHttpBase()}/media/${item.filename}`;

  if (item.mediaType === 'video') {
    img.hidden = true;
    video.hidden = false;
    video.src = url;
    video.currentTime = 0;
    video.play().catch(() => {});
    video.onended = advanceLoop;
    loopTimer = setTimeout(advanceLoop, item.displayDurationMs || DEFAULT_LOOP_DURATION_MS);
  } else {
    video.hidden = true;
    video.pause();
    video.onended = null;
    img.hidden = false;
    img.src = url;
    loopTimer = setTimeout(advanceLoop, item.displayDurationMs || DEFAULT_LOOP_DURATION_MS);
  }
}

function advanceLoop() {
  loopIndex = (loopIndex + 1) % Math.max(1, loopItems.length);
  showLoopItem();
}

function connectAndLoad() {
  const token = getWsToken();
  const ws = token ? new WebSocket(getWsUrl(), [token]) : new WebSocket(getWsUrl());

  ws.onopen = () => {
    ws.send(JSON.stringify({ action: 'getMediaLibrary' }));
  };

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }
    if (msg && msg.action === 'mediaLibraryUpdated') {
      loopItems = (msg.items || []).filter((item) => item.includeInLoop);
      loopIndex = 0;
      // Chargement unique (voir commentaire d'en-tête) : la connexion peut
      // fermer ensuite, elle n'a servi qu'à récupérer la liste une fois.
      ws.close();
      showLoopItem();
    }
  };

  ws.onerror = (err) => {
    console.error('[announcement-loop] WebSocket error:', err);
  };
}

connectAndLoad();
</script>
</body>
</html>
