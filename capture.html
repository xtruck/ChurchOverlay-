<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ChurchOverlay — Capture audio (fenêtre cachée)</title>
</head>
<body>
<script>
/**
 * ============================================================================
 *  capture.html — Capture micro native (getUserMedia + Web Audio)
 * ----------------------------------------------------------------------------
 *  Chargé dans une BrowserWindow cachée (show:false, voir createCaptureWindow()
 *  dans main.js). Remplace FFmpeg/DirectShow : utilise la même couche audio
 *  que Windows/Chromium (celle où le micro apparaît déjà dans les Paramètres
 *  Windows), donc plus de problème de périphérique "invisible" pour un
 *  backend externe.
 *
 *  Pipeline : getUserMedia(deviceId) -> AudioContext(16000Hz) -> AudioWorklet
 *  -> Float32 -> conversion PCM16 -> ArrayBuffer envoyé au process main via
 *  captureBridge.sendAudioChunk(), qui le relaie au worker server.js (voir
 *  main.js: ipcMain.on('capture:audio-chunk', ...) -> worker.postMessage()).
 *
 *  server.js/audio-capture.js ne changent pas de logique de segmentation :
 *  ils reçoivent toujours des échantillons PCM16 mono 16kHz, peu importe
 *  qu'ils viennent de FFmpeg ou d'ici.
 * ============================================================================
 */

const TARGET_SAMPLE_RATE = 16000; // doit rester synchronisé avec audio-capture.js CONFIG.sampleRate

// AudioWorklet inline : convertit les blocs Float32 (128 échantillons par
// défaut, natif Web Audio) en PCM16, et les regroupe en blocs d'environ
// ~4096 échantillons (~256ms à 16kHz) avant de les remonter au thread
// principal du renderer, pour limiter le nombre de messages postMessage.
const WORKLET_SOURCE = `
class PCM16Processor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.chunks = [];
    this.bufferedSamples = 0;
    this.targetSamples = 4096;
  }
  process(inputs) {
    const input = inputs[0];
    if (input && input[0]) {
      const channelData = input[0]; // mono (1 canal demandé au getUserMedia)
      const pcm16 = new Int16Array(channelData.length);
      for (let i = 0; i < channelData.length; i++) {
        const s = Math.max(-1, Math.min(1, channelData[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      this.chunks.push(pcm16);
      this.bufferedSamples += pcm16.length;

      if (this.bufferedSamples >= this.targetSamples) {
        const merged = new Int16Array(this.bufferedSamples);
        let offset = 0;
        for (const c of this.chunks) { merged.set(c, offset); offset += c.length; }
        this.port.postMessage(merged.buffer, [merged.buffer]);
        this.chunks = [];
        this.bufferedSamples = 0;
      }
    }
    return true; // garder le processor vivant
  }
}
registerProcessor('pcm16-processor', PCM16Processor);
`;

let mediaStream = null;
let audioContext = null;
let workletNode = null;
let sourceNode = null;
let isCapturing = false;

function reportError(message) {
  console.error('[capture.html]', message);
  window.captureBridge.sendError(message);
}

async function startCapture({ deviceId } = {}) {
  if (isCapturing) {
    console.warn('[capture.html] Capture déjà en cours, ignoré.');
    return;
  }

  try {
    const constraints = {
      audio: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        channelCount: 1,
        sampleRate: TARGET_SAMPLE_RATE,
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false,
      },
      video: false,
    };

    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (err) {
    // Repli : si le deviceId exact n'est plus disponible (micro débranché,
    // rebranché avec un nouvel id...), on retente sans contrainte de
    // périphérique plutôt que de laisser la capture totalement à l'arrêt.
    if (deviceId) {
      console.warn('[capture.html] Échec avec deviceId exact, nouvelle tentative sans contrainte:', err.message);
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, sampleRate: TARGET_SAMPLE_RATE },
          video: false,
        });
      } catch (err2) {
        reportError('Impossible d\'accéder au micro: ' + err2.message);
        return;
      }
    } else {
      reportError('Impossible d\'accéder au micro: ' + err.message);
      return;
    }
  }

  try {
    audioContext = new AudioContext({ sampleRate: TARGET_SAMPLE_RATE });
    const blob = new Blob([WORKLET_SOURCE], { type: 'application/javascript' });
    const workletUrl = URL.createObjectURL(blob);
    await audioContext.audioWorklet.addModule(workletUrl);
    URL.revokeObjectURL(workletUrl);

    sourceNode = audioContext.createMediaStreamSource(mediaStream);
    workletNode = new AudioWorkletNode(audioContext, 'pcm16-processor');

    workletNode.port.onmessage = (event) => {
      // event.data est déjà un ArrayBuffer PCM16 (transféré, pas copié, côté
      // worklet -> renderer). On le relaie tel quel au process main.
      window.captureBridge.sendAudioChunk(event.data);
    };

    sourceNode.connect(workletNode);
    // Ne PAS connecter workletNode à audioContext.destination : on ne veut
    // aucun retour audio dans les haut-parleurs, juste la capture.

    isCapturing = true;
    console.log('[capture.html] Capture démarrée.');
  } catch (err) {
    reportError('Échec de l\'initialisation du pipeline audio: ' + err.message);
    stopCapture();
  }
}

function stopCapture() {
  isCapturing = false;

  if (sourceNode) { try { sourceNode.disconnect(); } catch (_) {} sourceNode = null; }
  if (workletNode) { try { workletNode.disconnect(); } catch (_) {} workletNode = null; }
  if (audioContext) { try { audioContext.close(); } catch (_) {} audioContext = null; }
  if (mediaStream) {
    mediaStream.getTracks().forEach((track) => { try { track.stop(); } catch (_) {} });
    mediaStream = null;
  }
  console.log('[capture.html] Capture arrêtée.');
}

async function listDevices() {
  try {
    // Sur certains navigateurs/Electron, les labels ne sont renseignés
    // qu'après qu'une permission média a déjà été accordée au moins une
    // fois — main.js accorde cette permission automatiquement à toutes
    // les fenêtres de l'app (voir session.setPermissionRequestHandler),
    // donc ce n'est pas un souci ici.
    const devices = await navigator.mediaDevices.enumerateDevices();
    const audioInputs = devices
      .filter((d) => d.kind === 'audioinput')
      .map((d) => ({ deviceId: d.deviceId, label: d.label || 'Micro (nom indisponible)' }));
    window.captureBridge.sendDevicesResult(audioInputs);
  } catch (err) {
    reportError('Échec de l\'énumération des micros: ' + err.message);
    window.captureBridge.sendDevicesResult([]);
  }
}

window.captureBridge.onStart(startCapture);
window.captureBridge.onStop(stopCapture);
window.captureBridge.onListDevices(listDevices);
</script>
</body>
</html>
