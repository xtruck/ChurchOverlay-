<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurchOverlay — Affichage</title>
<style>
/* CORRECTIF (audit — police du verset jamais chargée) : @import doit être
   la toute première règle d'une feuille de style (avant même :root et les
   @property ci-dessous), sinon le navigateur l'ignore silencieusement —
   confirmé par l'onglet "Issues" de Chrome DevTools ("Define @import rules
   at the top of the stylesheet"). Remontée ici, avant toute autre règle.
   AJOUT (audit — police jugée trop fantaisiste/décorative pour un cadre
   professionnel) : Merriweather (verset) + Manrope (référence) sont les
   polices du thème "nuit" par défaut (config/themes/nuit.json) — sobres,
   sans empattement décoratif, conçues pour la lisibilité à l'écran/projeté.
   Cormorant Garamond et Plus Jakarta Sans restent chargées (thèmes
   personnalisés existants/futurs qui les référencent encore). */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Manrope:wght@500;600;700&display=swap');

/* ==========================================================================
   CSS Variables for Dynamic Themes (AI Innovation Pack)
   ========================================================================== */
:root {
  /* Même identité "verrière nocturne" que le tableau de bord : bleu-nuit
     profond en fond, lumière de cierge (or) en accent unique. Avant, ce
     fichier tournait sur un thème générique bleu marine/rose sans rapport
     avec le dashboard — l'opérateur voyait deux apps différentes. */
  --overlay-bg: linear-gradient(160deg, #0a0e1c 0%, #0d1226 55%, #10152b 100%);
  --overlay-text: #f6f3ec;
  --overlay-text-muted: #a8adc9;
  --overlay-accent: #d9bb6c;
  /* CORRECTIF (audit — police jugée "fantaisiste"/pas assez professionnelle) :
     Cormorant Garamond a un style calligraphique (empattements fins, courbes
     prononcées) qui peut se lire comme italique/décoratif projeté en grand,
     pas adapté à un cadre sérieux. Remplacée par Merriweather (le choix du
     thème "nuit" par défaut, voir config/themes/nuit.json) — un serif
     sobre, épais et très lisible à distance, sans fioriture. */
  --overlay-font: 'Merriweather', Georgia, serif;
  --overlay-font-ui: 'Plus Jakarta Sans', 'Open Sans', sans-serif;
  --overlay-border: rgba(220, 180, 106, 0.20);
  --overlay-glow: rgba(220, 180, 106, 0.32);
  --overlay-shadow: rgba(0, 0, 0, 0.55);
  --overlay-particle: #dcb46a;
}

/* AJOUT (innovation frontend — ambiances vivantes) : enregistrer les
   variables de couleur du thème via @property permet au navigateur
   d'interpoler leur changement en douceur (Chromium d'Electron le
   supporte pleinement). Sans ça, changer --overlay-glow via JS
   (applyTheme) faisait sauter instantanément la couleur du halo et de
   la carte d'un mood à l'autre — correct fonctionnellement, mais
   brutal visuellement pour un lieu de culte où la transition doit
   rester discrète. */
@property --overlay-glow {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(220, 180, 106, 0.32);
}
@property --overlay-accent {
  syntax: '<color>';
  inherits: true;
  initial-value: #d9bb6c;
}
@property --overlay-border {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(220, 180, 106, 0.20);
}
@property --overlay-particle {
  syntax: '<color>';
  inherits: true;
  initial-value: #dcb46a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
  font-family: var(--overlay-font);
}

/* AJOUT (audit round 6 — style "église moderne") : halo de lumière ambiant,
   doux et pulsant lentement, façon rayons filtrant à travers un vitrail.
   Couche purement décorative, sous les particules, ne capte aucun clic. */
.ambient-light {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: -1;
  opacity: 0.4;
  /* Une seule respiration, centrée sous la carte — plus de trois halos
     concurrents qui tiraient l'œil loin du texte du verset. */
  background: radial-gradient(ellipse 55% 35% at 50% 100%, var(--overlay-glow) 0%, transparent 70%);
  animation: ambientPulse 12s ease-in-out infinite;
  /* AJOUT : transition de couleur du halo quand l'ambiance change
     (setMoodTheme côté dashboard) — grâce à @property ci-dessus, le
     dégradé lui-même s'anime au lieu de sauter d'une teinte à l'autre. */
  transition: background 2.2s ease;
}
@keyframes ambientPulse {
  0%, 100% { opacity: 0.28; }
  50% { opacity: 0.44; }
}

/* Particules d'ambiance */
.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.particle {
  position: absolute;
  width: 3px; height: 3px;
  background: var(--overlay-particle);
  border-radius: 50%;
  opacity: 0;
  box-shadow: 0 0 6px 1px var(--overlay-particle), 0 0 12px 3px var(--overlay-glow);
  animation: float 11s infinite ease-in-out;
}
@keyframes float {
  0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Container principal */
#overlay-container {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 900px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
}

#overlay-container.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#overlay-container.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
}

/* Carte du verset */
.verse-card {
  background: var(--overlay-bg);
  color: var(--overlay-text);
  font-family: var(--overlay-font);
  padding: clamp(24px, 3vw, 40px) clamp(28px, 4vw, 52px);
  border-radius: 18px;
  border: 1px solid var(--overlay-border);
  box-shadow:
    0 0 46px var(--overlay-glow),
    0 14px 54px var(--overlay-shadow),
    inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  position: relative;
  overflow: hidden;
  /* AJOUT : accompagne le changement d'ambiance (mood) en douceur au
     lieu d'un saut de couleur instantané sur border/glow. */
  transition: background 2.2s ease, border-color 2.2s ease, box-shadow 2.2s ease;
}

.verse-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--overlay-accent), transparent);
}

/* Référence — c'est le premier repère pour quiconque arrive au milieu de la
   lecture ; elle doit primer visuellement sur le corps du texte, pas
   l'inverse. Taille fluide + police UI (pas la serif du corps) pour rester
   nette même projetée en grand. */
.verse-reference {
  font-family: var(--overlay-font-ui);
  font-size: clamp(14px, 1.3vw, 19px);
  font-weight: 700;
  color: var(--overlay-accent);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  margin-bottom: clamp(10px, 1.4vw, 18px);
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Texte — taille fluide calée sur la largeur de projection, pour rester
   lisible au fond d'une salle sur grand écran (22px fixe était illisible
   projeté ; clamp() adapte à toute résolution OBS/vidéoprojecteur). */
.verse-text {
  font-size: clamp(28px, 3.2vw, 46px);
  line-height: 1.35;
  font-weight: 500;
  text-shadow: 0 2px 12px rgba(0,0,0,0.4);
}

.verse-text-bilingual {
  font-family: var(--overlay-font);
  font-size: clamp(20px, 2.1vw, 30px);
  line-height: 1.4;
  margin-top: clamp(12px, 1.6vw, 20px);
  padding-top: clamp(12px, 1.6vw, 20px);
  border-top: 1px solid var(--overlay-border);
  /* CORRECTIF (audit — texte anglais bleuté, pas blanc comme le français) :
     utilisait --overlay-text-muted (bleu-gris, prévu pour des badges
     secondaires) au lieu de la même couleur que le verset principal. */
  color: var(--overlay-text);
}

/* Indicateur de source (AI detection) */
.source-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  color: var(--overlay-text-muted);
  font-family: var(--overlay-font-ui);
  text-transform: none;
  letter-spacing: 0;
  font-weight: 500;
}

.source-badge.ai {
  background: rgba(52, 211, 153, 0.16);
  color: #6ee7b7;
}

.source-badge.voice {
  background: rgba(78, 111, 216, 0.20);
  color: #9db1ec;
}

.source-badge.manual {
  background: rgba(220, 180, 106, 0.18);
  color: var(--overlay-accent);
}

/* Indicateur commande vocale */
#voice-indicator {
  position: fixed;
  top: 30px;
  right: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(20, 26, 48, 0.92);
  border: 1px solid rgba(78, 111, 216, 0.4);
  color: #cdd6f5;
  border-radius: 24px;
  font-family: var(--overlay-font-ui);
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease;
  z-index: 100;
  pointer-events: none;
  box-shadow: 0 4px 18px rgba(78, 111, 216, 0.25);
  backdrop-filter: blur(8px);
}

#voice-indicator.visible {
  opacity: 1;
  transform: translateY(0);
}

#voice-indicator .mic-icon {
  width: 16px;
  height: 16px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.7; }
}

/* Indicateur de détection sémantique */
#semantic-indicator {
  position: fixed;
  top: 30px;
  left: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(20, 26, 48, 0.92);
  border: 1px solid rgba(52, 211, 153, 0.4);
  color: #a7f3d0;
  border-radius: 24px;
  font-family: var(--overlay-font-ui);
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease;
  z-index: 100;
  pointer-events: none;
  max-width: 350px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 18px rgba(52, 211, 153, 0.2);
}

#semantic-indicator.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Alerte pipeline (transcription/audio en échec) */
#pipeline-alert {
  position: fixed;
  top: 30px;
  right: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(48, 20, 20, 0.92);
  border: 1px solid rgba(248, 113, 113, 0.5);
  color: #fecaca;
  border-radius: 24px;
  font-family: var(--overlay-font-ui);
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease;
  z-index: 100;
  pointer-events: none;
  max-width: 350px;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 18px rgba(248, 113, 113, 0.25);
}

#pipeline-alert.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Mode lecture */
#reading-indicator {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 20px;
  background: rgba(20, 26, 48, 0.92);
  border: 1px solid var(--overlay-border);
  color: var(--overlay-accent);
  border-radius: 24px;
  font-family: var(--overlay-font-ui);
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 100;
  pointer-events: none;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 18px rgba(220, 180, 106, 0.2);
}

#reading-indicator.visible {
  opacity: 1;
}

/* Animations d'entrée */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes gentleFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes solemnFade {
  from { opacity: 0; filter: blur(4px); }
  to { opacity: 1; filter: blur(0); }
}

@keyframes heartFade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes riseUp {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bloom {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes spiritWind {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Emergency clear flash */
@keyframes emergencyFlash {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; background: rgba(255, 0, 0, 0.3); }
}

.emergency-flash {
  animation: emergencyFlash 0.3s ease 3;
}

/* Animation appliquée dynamiquement */
.animate-verse {
  animation-duration: 0.8s;
  animation-fill-mode: both;
}

/* Responsive */
@media (max-width: 600px) {
  .verse-text { font-size: 18px; }
  .verse-text-bilingual { font-size: 15px; }
  .verse-card { padding: 20px 24px; }
}

/* ==========================================================================
   Typographie cinétique (innovation frontend — features.json:
   design.kineticTypography, prévu mais jamais construit : la config
   existait, aucune UI/rendu ne l'exploitait). Chaque mot du verset
   apparaît en cascade au lieu du fondu global de la carte entière —
   effet "lecture qui se dévoile", plus vivant à l'écran de projection.
   ========================================================================== */
.verse-text .kinetic-word {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  filter: blur(3px);
  animation: kineticWordIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards;
  animation-delay: var(--word-delay, 0ms);
}

@keyframes kineticWordIn {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

/* Respecte les préférences d'accessibilité : pas de cascade de mots
   pour qui a demandé de réduire les animations — le texte apparaît
   directement, complet. */
@media (prefers-reduced-motion: reduce) {
  .verse-text .kinetic-word {
    animation: none;
    opacity: 1;
    transform: none;
    filter: none;
  }
}

/* Advanced particle system */
.advanced-particle {
  position: absolute;
  pointer-events: none;
  z-index: 1;
}
</style>
<base target="_blank">
<!-- CORRECTIF (audit) : animation-library.js a été retiré du dépôt lors du
     passage à une palette unique (voir historique du projet) mais cette
     balise <script> y faisait toujours référence, provoquant une erreur
     404 au chargement de chaque overlay. animationLibrary reste `null`
     (voir plus bas) et tout le code qui l'utilise est déjà protégé par
     des gardes — comportement inchangé, juste plus d'erreur en console. -->
</head>
<body>

<!-- Particules d'ambiance -->
<div class="ambient-light" aria-hidden="true"></div>
<div class="particles" id="particles"></div>

<!-- Indicateur commande vocale -->
<div id="voice-indicator">
  <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
  </svg>
  <span>Commande vocale</span>
</div>

<!-- Indicateur détection sémantique -->
<div id="semantic-indicator">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
  </svg>
  <span id="semantic-text">Verset détecté par IA</span>
</div>

<!-- Alerte pipeline (transcription/audio en échec) -->
<div id="pipeline-alert">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
  </svg>
  <span id="pipeline-alert-text">Pipeline en erreur</span>
</div>

<!-- Indicateur mode lecture -->
<div id="reading-indicator">📖 Mode lecture active</div>

<!-- Container du verset -->
<div id="overlay-container" class="hidden">
  <div class="verse-card" id="verse-card">
    <div class="verse-reference" id="verse-reference">
      <span id="ref-text">ChurchOverlay</span>
      <span class="source-badge" id="source-badge" style="display:none"></span>
    </div>
    <div class="verse-text" id="verse-text">En attente d'une référence biblique...</div>
    <div class="verse-text-bilingual" id="verse-text-bilingual" style="display:none"></div>
  </div>
</div>

<script>
/* ==========================================================================
   WebSocket connection
   ========================================================================== */
// CORRECTIF (bug "serveur tout le temps hors ligne") : server.js rejette
// (code 1008) toute connexion sans jeton dès que l'authentification est
// activée côté serveur. Le token voyage dans la query string de la page
// overlay elle-même (celle collée dans OBS, ex.
// http://127.0.0.1:8765/overlay?token=...) — main.js y place désormais
// WS_VIEWER_TOKEN (accès lecture seule), pas le jeton opérateur.
//
// SECURITY (backend audit) : le token n'est plus rajouté en ?token= sur
// l'URL WebSocket elle-même (un reverse proxy exposant le serveur au LAN
// journalise typiquement l'URI de requête, exposant le jeton en clair).
// Il voyage maintenant via l'en-tête de handshake Sec-WebSocket-Protocol
// (2e argument du constructeur WebSocket).
const getWsToken = () => new URLSearchParams(window.location.search).get('token');
// CORRECTIF (bug "overlay hors ligne par défaut") : en file:// (cas réel,
// cette page est chargée depuis disque et collée dans OBS), il n'y a pas
// de window.location.host à réutiliser. main.js transmet le port réel via
// ?port=... (voir getOverlayUrl()) ; 8765 est le vrai défaut de server.js
// (voir config-validator.js > ENV_SCHEMA.PORT) — un correctif précédent
// utilisait 3000 par erreur ici, qui ne correspondait au port réel de
// server.js que si PORT était explicitement défini à cette valeur.
const getWsPort = () => new URLSearchParams(window.location.search).get('port') || '8765';
const getWsUrl = () => {
  if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${window.location.host}`;
  }
  return `ws://localhost:${getWsPort()}`;
};

// CORRECTIF (trouvé en marge de l'innovation frontend) : escapeHtml était
// appelé dans showVerse() pour le texte bilingue (EN) mais n'était défini
// nulle part dans ce fichier -> ReferenceError silencieuse dès qu'un verset
// avec langMode 'both' s'affichait (le crash arrêtait tout le script, donc
// aussi le WebSocket et les timers).
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

let ws = null;
let hideTimeout = null;
let currentTheme = 'default';
let currentAnimation = 'fadeInUp';
let currentMood = 'peace';
let reconnectTimer = null;
let animationLibrary = null;

function connectWs() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

  try {
    const token = getWsToken();
    ws = token ? new WebSocket(getWsUrl(), [token]) : new WebSocket(getWsUrl());
  } catch (e) {
    console.error('[overlay] Error creating WS:', e);
    scheduleOverlayReconnect();
    return;
  }

  ws.onopen = () => {
    console.log('[overlay] WebSocket connecté');
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (!msg || !msg.action) return;

    switch (msg.action) {
      case 'init':
        if (msg.theme) applyTheme(msg.theme);
        if (msg.mood) setMood(msg.mood);
        break;
      case 'showVerse':
        showVerse(msg);
        break;
      case 'hideVerse':
        hideVerse(msg.emergency);
        break;
      case 'applyTheme':
        applyTheme(msg);
        break;
      case 'applyAnimation':
        applyAnimation(msg.animation, msg.options);
        break;
      case 'setMood':
        setMood(msg.mood);
        break;
      case 'languageChanged':
        break;
      case 'translationChanged':
        break;
      case 'readingStarted':
        showReadingIndicator(true);
        break;
      case 'readingStopped':
        showReadingIndicator(false);
        break;
      case 'nextVerse':
      case 'previousVerse':
      case 'nextChapter':
        break;
      case 'extendTime':
        extendDisplayTime(msg.extraMs);
        break;
      case 'pauseTimer':
        pauseTimer();
        break;
      case 'resumeTimer':
        resumeTimer();
        break;
      case 'emergencyClear':
        emergencyClear();
        break;
      case 'semanticDetected':
        showSemanticIndicator(msg.reference, msg.confidence);
        break;
      case 'transcriptCorrected':
        console.log('[overlay] Transcript corrected:', msg.corrected);
        break;
      case 'error':
        console.error('[overlay] Server error:', msg.error);
        break;
      case 'transcriptionError':
        console.error('[overlay] Transcription error:', msg.error);
        showPipelineAlert('Transcription indisponible — vérifier la connexion internet');
        break;
      case 'audioError':
        console.error('[overlay] Audio capture error:', msg.error);
        showPipelineAlert('Capture audio interrompue — vérifier le micro');
        break;
      case 'audioSilenceWarning':
        console.warn('[overlay] Silence prolongé:', msg.message);
        showPipelineAlert('Aucune voix détectée — vérifiez le micro');
        break;
    }
  };

  ws.onclose = () => {
    console.log('[overlay] WebSocket déconnecté');
    scheduleOverlayReconnect();
  };

  ws.onerror = (err) => {
    console.error('[overlay] WebSocket error:', err);
  };
}

function scheduleOverlayReconnect() {
  if (!reconnectTimer) {
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectWs();
    }, 3000);
  }
}

connectWs();

/* ==========================================================================
   Typographie cinétique
   ========================================================================== */
// Active la config config/features.json -> design.kineticTypography (elle
// existait déjà côté config mais n'avait aucun effet visuel réel jusqu'ici :
// applyAnimation('wordByWord') n'animait que la carte entière, pas les mots).
// Passages trop longs (> 55 mots) : la cascade deviendrait plus distrayante
// que lisible sur un plan large, donc on retombe sur un affichage direct.
const KINETIC_MAX_WORDS = 55;
const KINETIC_WORD_STEP_MS = 55;

function renderVerseTextContent(el, text) {
  el.classList.remove('kinetic-mode');
  const words = (text || '').split(/(\s+)/).filter(Boolean);
  const wordCount = words.filter(w => !/^\s+$/.test(w)).length;

  if (wordCount === 0 || wordCount > KINETIC_MAX_WORDS) {
    el.textContent = text || '';
    return;
  }

  el.innerHTML = '';
  el.classList.add('kinetic-mode');
  let wordIndex = 0;
  words.forEach((token) => {
    if (/^\s+$/.test(token)) {
      el.appendChild(document.createTextNode(token));
      return;
    }
    const span = document.createElement('span');
    span.className = 'kinetic-word';
    span.textContent = token;
    span.style.setProperty('--word-delay', `${wordIndex * KINETIC_WORD_STEP_MS}ms`);
    el.appendChild(span);
    wordIndex++;
  });
}

/* ==========================================================================
   Display functions
   ========================================================================== */
// CORRECTIF (audit — plusieurs versets à la fois pouvaient déborder de
// l'écran) : réduit progressivement la taille du texte du verset jusqu'à
// ce que la carte tienne dans la hauteur de fenêtre disponible, avec un
// plancher lisible (jamais en dessous de MIN_VERSE_FONT_PX). Remise à la
// taille par défaut (CSS clamp()) avant chaque mesure, pour repartir de
// zéro à chaque nouveau verset plutôt que de cumuler les réductions
// précédentes.
const MIN_VERSE_FONT_PX = 18;
const VIEWPORT_MARGIN_PX = 120; // marge haut+bas pour rester lisible, pas collé aux bords
function fitVerseCardToViewport() {
  const card = document.getElementById('verse-card');
  const verseTextEl = document.getElementById('verse-text');
  if (!card || !verseTextEl) return;

  verseTextEl.style.fontSize = '';
  const maxCardHeight = window.innerHeight - VIEWPORT_MARGIN_PX;
  if (maxCardHeight <= 0) return;

  let currentSize = parseFloat(getComputedStyle(verseTextEl).fontSize);
  let guard = 0;
  while (card.scrollHeight > maxCardHeight && currentSize > MIN_VERSE_FONT_PX && guard < 30) {
    currentSize -= 2;
    verseTextEl.style.fontSize = `${currentSize}px`;
    guard++;
  }
}

function showVerse(data) {
  const container = document.getElementById('overlay-container');
  const card = document.getElementById('verse-card');
  const refText = document.getElementById('ref-text');
  const verseText = document.getElementById('verse-text');
  const verseBilingual = document.getElementById('verse-text-bilingual');
  const sourceBadge = document.getElementById('source-badge');

  // Update content
  refText.textContent = data.reference || 'Référence inconnue';

  // Bilingual display — on détermine d'abord le texte principal réel
  // (le français prend le pas sur le texte brut si bilingue), puis on
  // ne fait le rendu (cinétique ou direct) qu'une seule fois dessus.
  let mainText = data.text || '';
  if (data.langMode === 'both' && data.text_fr && data.text_en) {
    verseBilingual.style.display = 'block';
    verseBilingual.innerHTML = `<em>EN:</em> ${escapeHtml(data.text_en)}`;
    mainText = data.text_fr;
  } else {
    verseBilingual.style.display = 'none';
  }
  renderVerseTextContent(verseText, mainText);

  // Source badge
  if (data.detectedBy || data.triggeredByVoice || data.triggeredManually) {
    sourceBadge.style.display = 'inline-flex';
    if (data.triggeredByVoice) {
      sourceBadge.className = 'source-badge voice';
      sourceBadge.textContent = '🎤 Voix';
      showVoiceIndicator();
    } else if (data.triggeredManually) {
      sourceBadge.className = 'source-badge manual';
      sourceBadge.textContent = '👤 Manuel';
    } else if (data.detectedBy === 'semantic' || data.detectedBy === 'quote') {
      sourceBadge.className = 'source-badge ai';
      sourceBadge.textContent = '🤖 IA';
    } else {
      sourceBadge.style.display = 'none';
    }
  } else {
    sourceBadge.style.display = 'none';
  }

  // Use animation library if available, otherwise fallback to legacy
  if (animationLibrary && data.animation) {
    applyAnimation(data.animation, data.animationOptions);
  } else {
    // Legacy animation
    card.className = 'verse-card animate-verse';
    card.style.animationName = currentAnimation;
  }

  // Show
  container.className = 'visible';

  // CORRECTIF (audit — plages de plusieurs versets pouvaient déborder de
  // l'écran) : #overlay-container n'a aucune limite de hauteur ni
  // .verse-card ; pour une plage demandée à voix haute ("versets 2 à 8"),
  // le texte concaténé de plusieurs versets peut largement dépasser
  // l'espace disponible — la carte, ancrée en bas de l'écran, pousserait
  // alors son sommet hors du cadre visible, sans qu'aucun mécanisme
  // n'ajuste quoi que ce soit. On réduit la taille du texte du verset
  // (jamais en dessous d'un plancher lisible) jusqu'à ce que la carte
  // tienne dans la hauteur de la fenêtre. Après le rendu (requestAnimationFrame)
  // pour mesurer la vraie hauteur une fois le texte injecté dans le DOM.
  requestAnimationFrame(fitVerseCardToViewport);

  // Auto-hide timer
  clearTimeout(hideTimeout);
  const duration = sanitizeDurationMs(data.durationMs);
  hideTimeout = setTimeout(() => hideVerse(false), duration);
}

function hideVerse(emergency = false) {
  const container = document.getElementById('overlay-container');
  if (emergency) {
    container.className = 'hidden emergency-flash';
  } else {
    container.className = 'hidden';
  }
  clearTimeout(hideTimeout);
  hideTimeout = null;
}

function extendDisplayTime(extraMs) {
  if (hideTimeout) {
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => hideVerse(false), sanitizeDurationMs(extraMs));
  }
}

// Borne strictement toute durée de timer venant du réseau (WebSocket) avant
// de la passer à setTimeout : évite qu'une valeur non finie, négative ou
// démesurée (accidentelle ou malveillante) ne cause un épuisement de
// ressources côté overlay. Alignée avec le plafond serveur (1h = 3600000 ms).
const MAX_DISPLAY_DURATION_MS = 3600000;
// Filet de sécurité uniquement (si le serveur envoie une valeur invalide/
// absente) : aligné sur le défaut serveur de 120s (config/features.json
// display.verseDurationMs). Le serveur envoie normalement toujours une
// durée valide via getVerseDurationMs().
const DEFAULT_DISPLAY_DURATION_MS = 120000;
function sanitizeDurationMs(value) {
  const n = Number(value);
  if (!Number.isFinite(n) || n <= 0) return DEFAULT_DISPLAY_DURATION_MS;
  return Math.min(n, MAX_DISPLAY_DURATION_MS);
}

let timerPaused = false;
let pauseRemaining = 0;
let pauseStartTime = 0;

function pauseTimer() {
  if (hideTimeout && !timerPaused) {
    timerPaused = true;
    pauseStartTime = Date.now();
    clearTimeout(hideTimeout);
    console.log('[overlay] Timer paused');
  }
}

function resumeTimer() {
  if (timerPaused) {
    timerPaused = false;
    console.log('[overlay] Timer resumed');
    // We don't know original remaining, so just extend by elapsed pause time
    // In practice, the server handles the real timing
  }
}

function emergencyClear() {
  hideVerse(true);
  showVoiceIndicator('🚨 Urgence');
  setTimeout(() => hideVoiceIndicator(), 2000);
}

/* ==========================================================================
   Theme system
   ========================================================================== */
function applyTheme(theme) {
  if (!theme) return;
  const root = document.documentElement;

  // CORRECTIF (audit — changer de thème dans le tableau de bord ne
  // changeait RIEN sur l'overlay réel) : theme-loader.js (thèmes "nuit"/
  // "claire" et thèmes personnalisés créés par l'opérateur) envoie une
  // forme imbriquée { variables: {'--bg':..., '--verse-font':...},
  // effects, animations, background } — totalement différente des
  // propriétés plates (theme.background, theme.color...) que cette
  // fonction attendait plus bas. Aucune des conditions ci-dessous ne
  // s'exécutait donc jamais pour cette source : silencieusement sans
  // effet, changer de thème dans le tableau de bord ne faisait rien sur
  // l'overlay projeté. On accepte désormais aussi cette forme.
  if (theme.variables) {
    const v = theme.variables;
    if (v['--bg']) root.style.setProperty('--overlay-bg', v['--bg']);
    if (v['--text']) root.style.setProperty('--overlay-text', v['--text']);
    if (v['--accent']) root.style.setProperty('--overlay-accent', v['--accent']);
    if (v['--verse-font']) root.style.setProperty('--overlay-font', v['--verse-font']);
    if (v['--ref-font']) root.style.setProperty('--overlay-font-ui', v['--ref-font']);
    if (theme.animations && theme.animations.default) currentAnimation = theme.animations.default;
    return;
  }

  if (theme.background) root.style.setProperty('--overlay-bg', theme.background);
  if (theme.color) root.style.setProperty('--overlay-text', theme.color);
  if (theme.accentColor) root.style.setProperty('--overlay-accent', theme.accentColor);
  if (theme.fontFamily) root.style.setProperty('--overlay-font', theme.fontFamily);
  if (theme.borderColor) root.style.setProperty('--overlay-border', theme.borderColor);
  if (theme.glowColor) root.style.setProperty('--overlay-glow', theme.glowColor);
  if (theme.shadowColor) root.style.setProperty('--overlay-shadow', theme.shadowColor);
  if (theme.particleColor) root.style.setProperty('--overlay-particle', theme.particleColor);
  if (theme.animation) currentAnimation = theme.animation;

  // CORRECTIF PERF (audit CPU) : updateParticles() était appelée mais
  // jamais définie nulle part dans ce fichier -> ReferenceError silencieuse
  // à chaque changement de thème, qui interrompait applyTheme() en plein
  // milieu. La couleur des particules est une variable CSS (--overlay-particle,
  // déjà positionnée ci-dessus) : le navigateur la propage tout seul à tous
  // les éléments .particle/.advanced-particle existants, aucune fonction
  // JS n'est nécessaire ici.
}

/* ==========================================================================
   Animation system
   ========================================================================== */
function applyAnimation(animationKey, options = {}) {
  if (!animationLibrary) return;
  
  const card = document.getElementById('verse-card');
  animationLibrary.applyAnimation(card, animationKey, options);
}

function setMood(mood) {
  if (!animationLibrary) return;
  
  currentMood = mood;
  const container = document.getElementById('overlay-container');
  
  // Clear old advanced particles
  const oldParticles = container.querySelectorAll('.advanced-particle');
  oldParticles.forEach(p => p.remove());
  
  // Create new particle system based on mood
  animationLibrary.createParticleSystem(container, mood);
  
  console.log('[overlay] Mood set to:', mood);
}
