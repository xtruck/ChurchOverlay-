<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- AJOUT (audit sécurité Electron, Phase 3) : même politique et mêmes
         raisons que dashboard.html (voir son commentaire) — script-src/
         object-src/base-uri/form-action stricts, img-src/connect-src/
         media-src larges (port serveur dynamique, caméras IP LAN). style-src
         garde 'unsafe-inline' pour le <style>@import ci-dessous ET les
         thèmes qui appliquent des variables CSS inline (root.style.setProperty,
         voir overlay.js). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: http: https:; media-src 'self' http:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>ChurchOverlay — Affichage</title>
    <style>
      /* CORRECTIF (audit — police du verset jamais chargée) : @import doit être
   la toute première règle d'une feuille de style (avant même :root et les
   @property ci-dessous), sinon le navigateur l'ignore silencieusement —
   confirmé par l'onglet "Issues" de Chrome DevTools ("Define @import rules
   at the top of the stylesheet"). Remontée ici, avant toute autre règle.
   AJOUT (audit — police jugée trop fantaisiste/décorative pour un cadre
   professionnel) : Merriweather (verset) + Manrope (référence) sont les
   polices du thème "nuit" par défaut (config/themes/nuit.json) — sobres,
   sans empattement décoratif, conçues pour la lisibilité à l'écran/projeté.
   Cormorant Garamond et Plus Jakarta Sans restent chargées (thèmes
   personnalisés existants/futurs qui les référencent encore). */
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Manrope:wght@500;600;700&display=swap');

      /* ==========================================================================
   CSS Classes for Inline Styles
   ========================================================================== */
      .hidden-display {
        display: none;
      }

      #black-screen {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 200;
      }

      #service-countdown {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 180;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff;
        font-family: var(--font-display, serif);
      }

      #countdown-label {
        font-size: 1.2rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 1rem;
      }

      #countdown-time {
        font-size: 5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      #countdown-sub {
        font-size: 0.9rem;
        opacity: 0.5;
        margin-top: 1rem;
      }

      .source-badge {
        display: none;
      }

      .verse-text-bilingual {
        display: none;
      }

      /* ==========================================================================
   CSS Variables for Dynamic Themes (AI Innovation Pack)
   ========================================================================== */
      :root {
        /* Même identité "verrière nocturne" que le tableau de bord : bleu-nuit
     profond en fond, lumière de cierge (or) en accent unique. Avant, ce
     fichier tournait sur un thème générique bleu marine/rose sans rapport
     avec le dashboard — l'opérateur voyait deux apps différentes. */
        --overlay-bg: linear-gradient(160deg, #0b0c10 0%, #101218 55%, #14151c 100%);
        --overlay-text: #e8eaf0;
        --overlay-text-muted: #9aa0b0;
        --overlay-accent: #ff8a3d;
        /* CORRECTIF (audit — police jugée "fantaisiste"/pas assez professionnelle) :
     Cormorant Garamond a un style calligraphique (empattements fins, courbes
     prononcées) qui peut se lire comme italique/décoratif projeté en grand,
     pas adapté à un cadre sérieux. Remplacée par Merriweather (le choix du
     thème "nuit" par défaut, voir config/themes/nuit.json) — un serif
     sobre, épais et très lisible à distance, sans fioriture. */
        --overlay-font: 'Merriweather', Georgia, serif;
        --overlay-font-ui: 'IBM Plex Sans', 'Open Sans', sans-serif;
        --overlay-border: rgba(255, 138, 61, 0.2);
        --overlay-glow: rgba(255, 138, 61, 0.32);
        --overlay-shadow: rgba(0, 0, 0, 0.55);
        --overlay-particle: #ff8a3d;
        /* AJOUT (thèmes — champs déclarés dans config/themes/*.json mais
     jamais consommés par applyTheme(), voir plus bas) : valeurs par
     défaut identiques aux constantes qui étaient codées en dur dans
     .verse-card/.verse-text/.verse-reference ci-dessous, pour un rendu
     identique tant qu'aucun thème n'a encore poussé ses propres valeurs. */
        --overlay-verse-size: clamp(28px, 3.2vw, 46px);
        --overlay-verse-weight: 500;
        --overlay-radius: 18px;
        --overlay-blur: 14px;
        --overlay-reference-color: var(--overlay-accent);
      }

      /* AJOUT (innovation frontend — ambiances vivantes) : enregistrer les
   variables de couleur du thème via @property permet au navigateur
   d'interpoler leur changement en douceur (Chromium d'Electron le
   supporte pleinement). Sans ça, changer --overlay-glow via JS
   (applyTheme) faisait sauter instantanément la couleur du halo et de
   la carte d'un mood à l'autre — correct fonctionnellement, mais
   brutal visuellement pour un lieu de culte où la transition doit
   rester discrète. */
      @property --overlay-glow {
        syntax: '<color>';
        inherits: true;
        initial-value: rgba(255, 138, 61, 0.32);
      }
      @property --overlay-accent {
        syntax: '<color>';
        inherits: true;
        initial-value: #ff8a3d;
      }
      @property --overlay-border {
        syntax: '<color>';
        inherits: true;
        initial-value: rgba(255, 138, 61, 0.2);
      }
      @property --overlay-particle {
        syntax: '<color>';
        inherits: true;
        initial-value: #ff8a3d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        font-family: var(--overlay-font);
      }

      /* AJOUT (audit round 6 — style "église moderne") : halo de lumière ambiant,
   doux et pulsant lentement, façon rayons filtrant à travers un vitrail.
   Couche purement décorative, sous les particules, ne capte aucun clic. */
      .ambient-light {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
        opacity: 0.4;
        /* Une seule respiration, centrée sous la carte — plus de trois halos
     concurrents qui tiraient l'œil loin du texte du verset. */
        background: radial-gradient(
          ellipse 55% 35% at 50% 100%,
          var(--overlay-glow) 0%,
          transparent 70%
        );
        animation: ambientPulse 12s ease-in-out infinite;
        /* AJOUT : transition de couleur du halo quand l'ambiance change
     (setMoodTheme côté dashboard) — grâce à @property ci-dessus, le
     dégradé lui-même s'anime au lieu de sauter d'une teinte à l'autre. */
        transition: background 2.2s ease;
      }
      @keyframes ambientPulse {
        0%,
        100% {
          opacity: 0.28;
        }
        50% {
          opacity: 0.44;
        }
      }

      /* Particules d'ambiance — voir #ambientCanvas plus bas (audit perf) : cette
   règle ciblait un conteneur .particles jamais peuplé par aucun JS depuis
   le retrait d'animation-library.js (voir commentaire près de <head> plus
   bas) — ~20 lignes de CSS mortes, remplacées par un rendu canvas léger. */
      #ambientCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* Container principal */
      #overlay-container {
        position: fixed;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 900px;
        z-index: 10;
        opacity: 0;
        transition:
          opacity 0.6s ease,
          transform 0.6s ease,
          bottom 0.4s ease;
        pointer-events: none;
      }

      /* CORRECTIF (audit — sous-titres) : la bande #caption-strip (fixed, bottom:0,
   voir plus bas) peut s'étendre sur 2 lignes pour une phrase longue — sans
   ce décalage, elle chevauche le bas de la carte verset (fixed, bottom:60px
   ci-dessus) quand les deux sont visibles en même temps. 130px dégage même
   le cas 2 lignes avec de la marge. */
      body.captions-active #overlay-container {
        bottom: 130px;
      }

      #overlay-container.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      #overlay-container.hidden {
        opacity: 0;
        transform: translateX(-50%) translateY(30px);
      }

      /* Carte du verset */
      .verse-card {
        background: var(--overlay-bg);
        color: var(--overlay-text);
        font-family: var(--overlay-font);
        padding: clamp(24px, 3vw, 40px) clamp(28px, 4vw, 52px);
        border-radius: var(--overlay-radius);
        border: 1px solid var(--overlay-border);
        box-shadow:
          0 0 46px var(--overlay-glow),
          0 14px 54px var(--overlay-shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(var(--overlay-blur));
        position: relative;
        overflow: hidden;
        /* AJOUT : accompagne le changement d'ambiance (mood) en douceur au
     lieu d'un saut de couleur instantané sur border/glow. */
        transition:
          background 2.2s ease,
          border-color 2.2s ease,
          box-shadow 2.2s ease;
      }

      .verse-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--overlay-accent), transparent);
      }

      /* Référence — c'est le premier repère pour quiconque arrive au milieu de la
   lecture ; elle doit primer visuellement sur le corps du texte, pas
   l'inverse. Taille fluide + police UI (pas la serif du corps) pour rester
   nette même projetée en grand. */
      .verse-reference {
        font-family: var(--overlay-font-ui);
        font-size: clamp(14px, 1.3vw, 19px);
        font-weight: 700;
        color: var(--overlay-reference-color);
        text-transform: uppercase;
        letter-spacing: 2.5px;
        margin-bottom: clamp(10px, 1.4vw, 18px);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Texte — taille fluide calée sur la largeur de projection, pour rester
   lisible au fond d'une salle sur grand écran (22px fixe était illisible
   projeté ; clamp() adapte à toute résolution OBS/vidéoprojecteur). */
      .verse-text {
        font-size: var(--overlay-verse-size);
        line-height: 1.35;
        font-weight: var(--overlay-verse-weight);
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }

      .verse-text-bilingual {
        font-family: var(--overlay-font);
        font-size: clamp(20px, 2.1vw, 30px);
        line-height: 1.4;
        margin-top: clamp(12px, 1.6vw, 20px);
        padding-top: clamp(12px, 1.6vw, 20px);
        border-top: 1px solid var(--overlay-border);
        /* CORRECTIF (audit — texte anglais bleuté, pas blanc comme le français) :
     utilisait --overlay-text-muted (bleu-gris, prévu pour des badges
     secondaires) au lieu de la même couleur que le verset principal. */
        color: var(--overlay-text);
      }

      /* Indicateur de source (AI detection) */
      .source-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        padding: 3px 9px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--overlay-text-muted);
        font-family: var(--overlay-font-ui);
        text-transform: none;
        letter-spacing: 0;
        font-weight: 500;
      }

      .source-badge.ai {
        background: rgba(52, 211, 153, 0.16);
        color: #6ee7b7;
      }

      .source-badge.voice {
        background: rgba(78, 111, 216, 0.2);
        color: #9db1ec;
      }

      .source-badge.manual {
        background: rgba(255, 138, 61, 0.18);
        color: var(--overlay-accent);
      }

      /* Indicateur commande vocale */
      #voice-indicator {
        position: fixed;
        top: 30px;
        right: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(20, 26, 48, 0.92);
        border: 1px solid rgba(78, 111, 216, 0.4);
        color: #cdd6f5;
        border-radius: 24px;
        font-family: var(--overlay-font-ui);
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.4s ease;
        z-index: 100;
        pointer-events: none;
        box-shadow: 0 4px 18px rgba(78, 111, 216, 0.25);
        backdrop-filter: blur(8px);
      }

      #voice-indicator.visible {
        opacity: 1;
        transform: translateY(0);
      }

      #voice-indicator .mic-icon {
        width: 16px;
        height: 16px;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.7;
        }
      }

      /* Indicateur de détection sémantique */
      #semantic-indicator {
        position: fixed;
        top: 30px;
        left: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(20, 26, 48, 0.92);
        border: 1px solid rgba(52, 211, 153, 0.4);
        color: #a7f3d0;
        border-radius: 24px;
        font-family: var(--overlay-font-ui);
        font-size: 12px;
        font-weight: 600;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.4s ease;
        z-index: 100;
        pointer-events: none;
        max-width: 350px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 18px rgba(52, 211, 153, 0.2);
      }

      #semantic-indicator.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Alerte pipeline (transcription/audio en échec) */
      #pipeline-alert {
        position: fixed;
        top: 30px;
        right: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: rgba(48, 20, 20, 0.92);
        border: 1px solid rgba(248, 113, 113, 0.5);
        color: #fecaca;
        border-radius: 24px;
        font-family: var(--overlay-font-ui);
        font-size: 12px;
        font-weight: 600;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.4s ease;
        z-index: 100;
        pointer-events: none;
        max-width: 350px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 18px rgba(248, 113, 113, 0.25);
      }

      #pipeline-alert.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Mode lecture */
      #reading-indicator {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        background: rgba(20, 26, 48, 0.92);
        border: 1px solid var(--overlay-border);
        color: var(--overlay-accent);
        border-radius: 24px;
        font-family: var(--overlay-font-ui);
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        transition: opacity 0.4s ease;
        z-index: 100;
        pointer-events: none;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 18px rgba(255, 138, 61, 0.2);
      }

      #reading-indicator.visible {
        opacity: 1;
      }

      /* Animations d'entrée */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes gentleFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes solemnFade {
        from {
          opacity: 0;
          filter: blur(4px);
        }
        to {
          opacity: 1;
          filter: blur(0);
        }
      }

      @keyframes heartFade {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes riseUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bloom {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes spiritWind {
        from {
          opacity: 0;
          transform: translateX(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Emergency clear flash */
      @keyframes emergencyFlash {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
          background: rgba(255, 0, 0, 0.3);
        }
      }

      .emergency-flash {
        animation: emergencyFlash 0.3s ease 3;
      }

      /* Animation appliquée dynamiquement */
      .animate-verse {
        animation-duration: 0.8s;
        animation-fill-mode: both;
      }

      /* Responsive */
      @media (max-width: 600px) {
        .verse-text {
          font-size: 18px;
        }
        .verse-text-bilingual {
          font-size: 15px;
        }
        .verse-card {
          padding: 20px 24px;
        }
      }

      /* ==========================================================================
   Typographie cinétique (innovation frontend — features.json:
   design.kineticTypography, prévu mais jamais construit : la config
   existait, aucune UI/rendu ne l'exploitait). Chaque mot du verset
   apparaît en cascade au lieu du fondu global de la carte entière —
   effet "lecture qui se dévoile", plus vivant à l'écran de projection.
   ========================================================================== */
      .verse-text .kinetic-word {
        display: inline-block;
        opacity: 0;
        transform: translateY(14px);
        filter: blur(3px);
        animation: kineticWordIn 0.7s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        animation-delay: var(--word-delay, 0ms);
      }

      @keyframes kineticWordIn {
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      /* Respecte les préférences d'accessibilité : pas de cascade de mots
   pour qui a demandé de réduire les animations — le texte apparaît
   directement, complet. */
      @media (prefers-reduced-motion: reduce) {
        .verse-text .kinetic-word {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }

      /* ==========================================================================
   Mode grand contraste (audit — accessibilité, gratuit/léger). Bascule
   opérateur explicite (voir action 'accessibilityMode'), pas de détection
   automatique. CSS pur : on réutilise les mêmes variables --overlay-* que le
   reste du fichier, donc halo/particules/badges s'adaptent tout seuls sans
   dupliquer les règles élément par élément.
   ========================================================================== */
      body.high-contrast {
        --overlay-bg: #000000;
        --overlay-text: #ffffff;
        --overlay-text-muted: #e8e8e8;
        --overlay-accent: #ffd54a;
        --overlay-border: rgba(255, 255, 255, 0.45);
        --overlay-glow: transparent;
        --overlay-particle: transparent;
      }
      body.high-contrast .verse-text {
        font-size: clamp(38px, 4.6vw, 68px);
        text-shadow: none;
      }
      body.high-contrast .verse-reference {
        font-size: clamp(18px, 1.8vw, 26px);
      }
      body.high-contrast .ambient-light,
      body.high-contrast #ambientCanvas,
      body.high-contrast .advanced-particle {
        display: none !important;
      }
      body.high-contrast .verse-text .kinetic-word {
        animation: none;
        opacity: 1;
        transform: none;
        filter: none;
      }

      /* ==========================================================================
   Sous-titres en direct (audit — accessibilité, gratuit/léger). Le texte
   transcrit circule déjà sur chaque segment (broadcast 'transcript' côté
   serveur) — cette bande ne fait qu'afficher ce qui existait déjà, aucun
   nouveau calcul ni appel réseau.
   ========================================================================== */
      #caption-strip {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        flex-direction: column;
        gap: 4px;
        padding: 14px clamp(20px, 4vw, 48px);
        background: rgba(0, 0, 0, 0.72);
        color: #ffffff;
        font-family: var(--overlay-font-ui);
        font-size: clamp(15px, 1.6vw, 22px);
        line-height: 1.4;
        text-align: center;
        z-index: 5;
      }
      #caption-strip.visible {
        display: flex;
      }
      /* AJOUT (sous-titres traduits en direct, opt-in) : ligne distincte, en
   italique et légèrement plus sobre pour rester secondaire face au sous-
   titre original — vide (donc invisible, :empty) tant qu'aucune traduction
   n'est arrivée pour ce segment. */
      #caption-strip-translation {
        font-style: italic;
        font-size: 0.85em;
        color: rgba(255, 255, 255, 0.75);
      }
      #caption-strip-translation:empty {
        display: none;
      }

      /* ==========================================================================
   Motif de test (audit — affichage/sortie, gratuit/léger). Barres de
   couleur statiques façon mire de calage broadcast (blanc/jaune/cyan/vert/
   magenta/rouge/bleu) — sert à vérifier OBS/NDI (via DistroAV)/projecteur
   AVANT le culte, indépendamment de tout verset. CSS pur, aucun calcul par
   frame : zéro coût CPU au-delà d'un rendu statique normal.
   ========================================================================== */
      #test-pattern {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        flex-direction: column;
      }
      #test-pattern.visible {
        display: flex;
      }
      #test-pattern .bars {
        flex: 1;
        display: flex;
      }
      #test-pattern .bars > div {
        flex: 1;
      }
      #test-pattern .bar-white {
        background: #ffffff;
      }
      #test-pattern .bar-yellow {
        background: #ffff00;
      }
      #test-pattern .bar-cyan {
        background: #00ffff;
      }
      #test-pattern .bar-green {
        background: #00ff00;
      }
      #test-pattern .bar-magenta {
        background: #ff00ff;
      }
      #test-pattern .bar-red {
        background: #ff0000;
      }
      #test-pattern .bar-blue {
        background: #0000ff;
      }
      #test-pattern .label {
        padding: 10px 16px;
        background: #000000;
        color: #ffffff;
        font-family: var(--overlay-font-ui);
        font-size: 14px;
        letter-spacing: 1px;
      }

      /* ==========================================================================
   Motifs de fond (audit — affichage/sortie, gratuit/léger). Couche
   optionnelle sous la carte du verset, en plus des dégradés de thème
   existants — dégradés CSS générés, aucune image, aucun poids ajouté.
   ========================================================================== */
      #pattern-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.5;
      }
      #pattern-layer.pattern-dots {
        background-image: radial-gradient(var(--overlay-accent) 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.12;
      }
      #pattern-layer.pattern-grid {
        background-image:
          linear-gradient(var(--overlay-border) 1px, transparent 1px),
          linear-gradient(90deg, var(--overlay-border) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.35;
      }
      #pattern-layer.pattern-diagonal {
        background-image: repeating-linear-gradient(
          45deg,
          var(--overlay-border) 0px,
          var(--overlay-border) 1px,
          transparent 1px,
          transparent 22px
        );
        opacity: 0.3;
      }

      /* ==========================================================================
   Médiathèque (photos/vidéos déclenchées à la voix ou manuellement, voir
   action 'showMedia'). Même principe de prise de contrôle plein écran que
   #test-pattern, en z-index plus haut (150) pour passer au-dessus de tout
   le reste (motif de test compris) : un seul média à l'écran à la fois.
   ========================================================================== */
      #media-layer {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: none;
        align-items: center;
        justify-content: center;
        background: #000000;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #media-layer.visible {
        display: flex;
        opacity: 1;
      }
      #media-layer img,
      #media-layer video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        /* AJOUT (cohérence visuelle avec .verse-card) : même famille de coins
     arrondis/ombre que la carte de verset, pour que le média affiché ne
     ressemble pas à un élément d'une app différente. */
        border-radius: var(--overlay-radius);
        box-shadow: 0 14px 54px var(--overlay-shadow);
        /* AJOUT (détails d'affichage média — style d'apparition, voir showMediaItem()
     dans le script plus bas) : transform/opacity uniquement (GPU-composité,
     même discipline que l'audit perf de cette session) — jamais de propriété
     coûteuse (width/height/filter) animée par frame. */
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }
      /* AJOUT (Ken Burns — champ backgroundImage.kenBurns déclaré dans
   config/themes/*.json mais jamais consommé, voir showMediaItem()) : zoom
   lent uniquement sur les images fixes (une vidéo "bouge" déjà). Désactivé
   sous prefers-reduced-motion, comme le reste des animations de ce fichier. */
      #media-layer img.ken-burns {
        animation: kenBurns 20s ease-out forwards;
      }
      @keyframes kenBurns {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.06);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #media-layer img.ken-burns {
          animation: none;
        }
      }
      /* 'fade' (par défaut) : le fondu du layer suffit, le média lui-même est statique. */
      #media-layer.transition-slide img,
      #media-layer.transition-slide video {
        transform: translateY(0);
      }
      #media-layer.transition-slide:not(.visible) img,
      #media-layer.transition-slide:not(.visible) video {
        transform: translateY(40px);
      }
      #media-layer.transition-zoom img,
      #media-layer.transition-zoom video {
        transform: scale(1);
      }
      #media-layer.transition-zoom:not(.visible) img,
      #media-layer.transition-zoom:not(.visible) video {
        transform: scale(0.85);
      }
      /* 'cut' : aucune transition, apparition/disparition instantanée. */
      #media-layer.transition-cut {
        transition: none;
      }
      #media-layer.transition-cut img,
      #media-layer.transition-cut video {
        transition: none;
      }
      #media-layer img[hidden],
      #media-layer video[hidden] {
        display: none;
      }

      /* ==========================================================================
   Studio de scènes (texte + logo/image composés sur un fond, voir action
   'showScene') — lot 4/6. Même tier de z-index que #media-layer (150) :
   scène/verset et scène/média sont mutuellement exclusifs, comme média/
   verset déjà aujourd'hui — jamais deux à l'écran en même temps.
   ========================================================================== */
      #scene-layer {
        position: fixed;
        inset: 0;
        z-index: 150;
        display: none;
        background: #000000;
        opacity: 0;
        transition: opacity 0.3s ease;
        overflow: hidden;
        /* CORRECTIF (studio de scènes, lot 6/6 — trouvé en vérifiant l'aperçu
           du composeur dans un vrai navigateur) : renderSceneDom() (voir
           scene-render.js) dimensionne le texte en fontSizePct + 'cqh' —
           relatif à la HAUTEUR DE CE CONTENEUR (container query), pas à
           l'unité CSS vh qui se serait résolue contre la fenêtre ENTIÈRE du
           navigateur. Sans hasard ici (#scene-layer occupe déjà tout le
           viewport), donc AUCUN changement visuel sur l'overlay réel — mais
           la même fonction, utilisée telle quelle pour l'aperçu du studio de
           scènes (galerie + composeur, voir dashboard.css), y rendait un
           texte démesuré et rogné : la taille se calculait contre la fenêtre
           du tableau de bord entier, pas contre la petite vignette d'aperçu.
           container-type:size déclare ce conteneur comme référence pour cqh. */
        container-type: size;
      }
      #scene-layer.visible {
        display: block;
        opacity: 1;
      }
      #scene-layer .scene-background-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Ancré par son propre centre (translate -50%/-50%) — fonctionne
   identiquement pour un bloc de texte (largeur variable) et une image
   (largeur fixée par widthPct), quelle que soit la position choisie. */
      #scene-layer .scene-element {
        position: absolute;
      }
      #scene-layer .scene-text {
        /* Empêche un texte long de déborder du cadre, quelle que soit sa
     position — text-align (posé en ligne, voir renderSceneDom()) gère
     l'alignement À L'INTÉRIEUR de cette largeur. */
        max-width: 80%;
        white-space: pre-wrap;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      }
      #scene-layer .scene-image img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--overlay-radius);
        box-shadow: 0 14px 54px var(--overlay-shadow);
      }

      /* Advanced particle system */
      .advanced-particle {
        position: absolute;
        pointer-events: none;
        z-index: 1;
      }
    </style>
    <base target="_blank" />
  </head>
  <body>
    <!-- Motif de fond optionnel (affichage/sortie — voir action 'backgroundPatternMode') -->
    <div id="pattern-layer" aria-hidden="true"></div>

    <!-- Médiathèque : photo/vidéo affichée en plein écran (voir action 'showMedia') -->
    <div id="media-layer" aria-hidden="true">
      <img id="media-layer-img" alt="" hidden />
      <video id="media-layer-video" hidden playsinline></video>
    </div>

    <!-- Studio de scènes : texte + logo/image composés (voir action 'showScene') -->
    <div id="scene-layer" aria-hidden="true"></div>

    <!-- Particules d'ambiance -->
    <div class="ambient-light" aria-hidden="true"></div>
    <canvas id="ambientCanvas" aria-hidden="true"></canvas>

    <!-- Indicateur commande vocale -->
    <div id="voice-indicator">
      <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
        <path
          d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
        />
      </svg>
      <span>Commande vocale</span>
    </div>

    <!-- Indicateur détection sémantique -->
    <div id="semantic-indicator">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
        />
      </svg>
      <span id="semantic-text">Verset détecté par IA</span>
    </div>

    <!-- Alerte pipeline (transcription/audio en échec) -->
    <div id="pipeline-alert">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"
        />
      </svg>
      <span id="pipeline-alert-text">Pipeline en erreur</span>
    </div>

    <!-- Indicateur mode lecture -->
    <div id="reading-indicator">📖 Mode lecture active</div>

    <!-- Container du verset -->
    <div id="overlay-container" class="hidden">
      <div class="verse-card" id="verse-card">
        <div class="verse-reference" id="verse-reference">
          <span id="ref-text">ChurchOverlay</span>
          <span class="source-badge" id="source-badge"></span>
        </div>
        <div class="verse-text" id="verse-text">En attente d'une référence biblique...</div>
        <div class="verse-text-bilingual" id="verse-text-bilingual"></div>
      </div>
    </div>

    <!-- Sous-titres en direct (accessibilité — voir action 'captionsMode') -->
    <div id="caption-strip" aria-live="polite">
      <div id="caption-strip-text"></div>
      <!-- AJOUT (sous-titres traduits en direct, opt-in — voir caption-translator.js) :
       seconde ligne, distincte de la traduction de VERSETS (langMode 'both').
       Masquée tant qu'aucune traduction n'a encore été reçue pour ce segment. -->
      <div id="caption-strip-translation" aria-live="polite"></div>
    </div>

    <!-- Motif de test (affichage/sortie — voir action 'testPatternMode') -->
    <div id="test-pattern" aria-hidden="true">
      <div class="bars">
        <div class="bar-white"></div>
        <div class="bar-yellow"></div>
        <div class="bar-cyan"></div>
        <div class="bar-green"></div>
        <div class="bar-magenta"></div>
        <div class="bar-red"></div>
        <div class="bar-blue"></div>
      </div>
      <div class="label">
        ChurchOverlay — MOTIF DE TEST — réglez OBS / NDI / projecteur avant le culte
      </div>
    </div>

    <!-- Écran noir — masque tout (test pattern, média, versets) pour coupure immédiate -->
    <div id="black-screen" class="hidden-display" aria-hidden="true"></div>

    <!-- Compteur avant culte — affiche un countdown avant le début du culte -->
    <div id="service-countdown" class="hidden-display">
      <div id="countdown-label">Le culte commence dans</div>
      <div id="countdown-time">00:00</div>
      <div id="countdown-sub"></div>
    </div>

    <!-- AJOUT (studio de scènes, lot 5/6) : SCENE_POSITION_PCT/renderSceneDom
         chargés ici, AVANT le script principal ci-dessous, qui les utilise
         directement comme variables globales (script classique, même
         convention que camera-capture.js dans dashboard.html) — module
         partagé avec l'aperçu du studio dans le tableau de bord, pour que
         "ce que l'opérateur voit en éditant" et "ce qui est sur le
         projecteur" ne puissent jamais diverger. -->
    <script src="scene-render.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
