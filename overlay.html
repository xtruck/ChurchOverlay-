<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChurchOverlay — Affichage</title>
<style>
/* ==========================================================================
   CSS Variables for Dynamic Themes (AI Innovation Pack)
   ========================================================================== */
:root {
  --overlay-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  --overlay-text: #FFFFFF;
  --overlay-accent: #e94560;
  --overlay-font: 'Playfair Display', Georgia, serif;
  --overlay-border: rgba(255, 255, 255, 0.1);
  --overlay-glow: rgba(233, 69, 96, 0.3);
  --overlay-shadow: rgba(0, 0, 0, 0.5);
  --overlay-particle: #e94560;
}

/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:wght@400;700&family=Open+Sans:wght@400;600&family=Cinzel:wght@400;700&family=Great+Vibes&family=Merriweather:wght@400;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
  font-family: var(--overlay-font);
}

/* Particules d'ambiance */
.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  background: var(--overlay-particle);
  border-radius: 50%;
  opacity: 0;
  animation: float 8s infinite ease-in-out;
}
@keyframes float {
  0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

/* Container principal */
#overlay-container {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 900px;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
  pointer-events: none;
}

#overlay-container.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

#overlay-container.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(30px);
}

/* Carte du verset */
.verse-card {
  background: var(--overlay-bg);
  color: var(--overlay-text);
  font-family: var(--overlay-font);
  padding: 28px 36px;
  border-radius: 16px;
  border: 1px solid var(--overlay-border);
  box-shadow:
    0 0 40px var(--overlay-glow),
    0 12px 50px var(--overlay-shadow),
    inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

.verse-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--overlay-accent);
  opacity: 0.8;
}

/* Référence */
.verse-reference {
  font-size: 15px;
  font-weight: 600;
  color: var(--overlay-accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Texte */
.verse-text {
  font-size: 22px;
  line-height: 1.6;
  font-weight: 400;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.verse-text-bilingual {
  font-size: 18px;
  line-height: 1.5;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--overlay-border);
  opacity: 0.85;
}

/* Indicateur de source (AI detection) */
.source-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.7);
  font-family: 'Open Sans', sans-serif;
  text-transform: none;
  letter-spacing: 0;
}

.source-badge.ai {
  background: rgba(76, 175, 80, 0.2);
  color: #81C784;
}

.source-badge.voice {
  background: rgba(33, 150, 243, 0.2);
  color: #64B5F6;
}

.source-badge.manual {
  background: rgba(255, 152, 0, 0.2);
  color: #FFB74D;
}

/* Indicateur commande vocale */
#voice-indicator {
  position: fixed;
  top: 30px;
  right: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(33, 150, 243, 0.9);
  color: white;
  border-radius: 24px;
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease;
  z-index: 100;
  pointer-events: none;
  box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
}

#voice-indicator.visible {
  opacity: 1;
  transform: translateY(0);
}

#voice-indicator .mic-icon {
  width: 16px;
  height: 16px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.2); opacity: 0.7; }
}

/* Indicateur de détection sémantique */
#semantic-indicator {
  position: fixed;
  top: 30px;
  left: 30px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(76, 175, 80, 0.9);
  color: white;
  border-radius: 24px;
  font-family: 'Open Sans', sans-serif;
  font-size: 12px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(-20px);
  transition: all 0.4s ease;
  z-index: 100;
  pointer-events: none;
  max-width: 350px;
}

#semantic-indicator.visible {
  opacity: 1;
  transform: translateY(0);
}

/* Mode lecture */
#reading-indicator {
  position: fixed;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 20px;
  background: rgba(233, 69, 96, 0.9);
  color: white;
  border-radius: 24px;
  font-family: 'Open Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 100;
  pointer-events: none;
}

#reading-indicator.visible {
  opacity: 1;
}

/* Animations d'entrée */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes gentleFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes solemnFade {
  from { opacity: 0; filter: blur(4px); }
  to { opacity: 1; filter: blur(0); }
}

@keyframes heartFade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes riseUp {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bloom {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes spiritWind {
  from { opacity: 0; transform: translateX(-30px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Emergency clear flash */
@keyframes emergencyFlash {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; background: rgba(255, 0, 0, 0.3); }
}

.emergency-flash {
  animation: emergencyFlash 0.3s ease 3;
}

/* Animation appliquée dynamiquement */
.animate-verse {
  animation-duration: 0.8s;
  animation-fill-mode: both;
}

/* Responsive */
@media (max-width: 600px) {
  .verse-text { font-size: 18px; }
  .verse-text-bilingual { font-size: 15px; }
  .verse-card { padding: 20px 24px; }
}
</style>
<base target="_blank">
</head>
<body>

<!-- Particules d'ambiance -->
<div class="particles" id="particles"></div>

<!-- Indicateur commande vocale -->
<div id="voice-indicator">
  <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
  </svg>
  <span>Commande vocale</span>
</div>

<!-- Indicateur détection sémantique -->
<div id="semantic-indicator">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
  </svg>
  <span id="semantic-text">Verset détecté par IA</span>
</div>

<!-- Indicateur mode lecture -->
<div id="reading-indicator">📖 Mode lecture active</div>

<!-- Container du verset -->
<div id="overlay-container" class="hidden">
  <div class="verse-card" id="verse-card">
    <div class="verse-reference" id="verse-reference">
      <span id="ref-text">ChurchOverlay</span>
      <span class="source-badge" id="source-badge" style="display:none"></span>
    </div>
    <div class="verse-text" id="verse-text">En attente d'une référence biblique...</div>
    <div class="verse-text-bilingual" id="verse-text-bilingual" style="display:none"></div>
  </div>
</div>

<script>
/* ==========================================================================
   WebSocket connection
   ========================================================================== */
const getWsUrl = () => {
  if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${window.location.host}`;
  }
  return 'ws://localhost:3000';
};

let ws = null;
let hideTimeout = null;
let currentTheme = 'default';
let currentAnimation = 'fadeInUp';
let reconnectTimer = null;

function connectWs() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

  try {
    ws = new WebSocket(getWsUrl());
  } catch (e) {
    console.error('[overlay] Error creating WS:', e);
    scheduleOverlayReconnect();
    return;
  }

  ws.onopen = () => {
    console.log('[overlay] WebSocket connecté');
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  };

  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (!msg || !msg.action) return;

    switch (msg.action) {
      case 'init':
        if (msg.theme) applyTheme(msg.theme);
        break;
      case 'showVerse':
        showVerse(msg);
        break;
      case 'hideVerse':
        hideVerse(msg.emergency);
        break;
      case 'applyTheme':
        applyTheme(msg);
        break;
      case 'languageChanged':
        break;
      case 'translationChanged':
        break;
      case 'readingStarted':
        showReadingIndicator(true);
        break;
      case 'readingStopped':
        showReadingIndicator(false);
        break;
      case 'nextVerse':
      case 'previousVerse':
      case 'nextChapter':
        break;
      case 'extendTime':
        extendDisplayTime(msg.extraMs);
        break;
      case 'pauseTimer':
        pauseTimer();
        break;
      case 'resumeTimer':
        resumeTimer();
        break;
      case 'emergencyClear':
        emergencyClear();
        break;
      case 'semanticDetected':
        showSemanticIndicator(msg.reference, msg.confidence);
        break;
      case 'transcriptCorrected':
        console.log('[overlay] Transcript corrected:', msg.corrected);
        break;
      case 'error':
        console.error('[overlay] Server error:', msg.error);
        break;
    }
  };

  ws.onclose = () => {
    console.log('[overlay] WebSocket déconnecté');
    scheduleOverlayReconnect();
  };

  ws.onerror = (err) => {
    console.error('[overlay] WebSocket error:', err);
  };
}

function scheduleOverlayReconnect() {
  if (!reconnectTimer) {
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectWs();
    }, 3000);
  }
}

connectWs();

/* ==========================================================================
   Display functions
   ========================================================================== */
function showVerse(data) {
  const container = document.getElementById('overlay-container');
  const card = document.getElementById('verse-card');
  const refText = document.getElementById('ref-text');
  const verseText = document.getElementById('verse-text');
  const verseBilingual = document.getElementById('verse-text-bilingual');
  const sourceBadge = document.getElementById('source-badge');

  // Update content
  refText.textContent = data.reference || 'Référence inconnue';
  verseText.textContent = data.text || '';

  // Bilingual display
  if (data.langMode === 'both' && data.text_fr && data.text_en) {
    verseBilingual.style.display = 'block';
    verseBilingual.innerHTML = `<em>EN:</em> ${escapeHtml(data.text_en)}`;
    verseText.textContent = data.text_fr;
  } else {
    verseBilingual.style.display = 'none';
  }

  // Source badge
  if (data.detectedBy || data.triggeredByVoice || data.triggeredManually) {
    sourceBadge.style.display = 'inline-flex';
    if (data.triggeredByVoice) {
      sourceBadge.className = 'source-badge voice';
      sourceBadge.textContent = '🎤 Voix';
      showVoiceIndicator();
    } else if (data.triggeredManually) {
      sourceBadge.className = 'source-badge manual';
      sourceBadge.textContent = '👤 Manuel';
    } else if (data.detectedBy === 'semantic' || data.detectedBy === 'quote') {
      sourceBadge.className = 'source-badge ai';
      sourceBadge.textContent = '🤖 IA';
    } else {
      sourceBadge.style.display = 'none';
    }
  } else {
    sourceBadge.style.display = 'none';
  }

  // Animation
  card.className = 'verse-card animate-verse';
  card.style.animationName = currentAnimation;

  // Show
  container.className = 'visible';

  // Auto-hide timer
  clearTimeout(hideTimeout);
  const duration = data.durationMs || 300000;
  hideTimeout = setTimeout(() => hideVerse(false), duration);
}

function hideVerse(emergency = false) {
  const container = document.getElementById('overlay-container');
  if (emergency) {
    container.className = 'hidden emergency-flash';
  } else {
    container.className = 'hidden';
  }
  clearTimeout(hideTimeout);
  hideTimeout = null;
}

function extendDisplayTime(extraMs) {
  if (hideTimeout) {
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => hideVerse(false), extraMs);
  }
}

let timerPaused = false;
let pauseRemaining = 0;
let pauseStartTime = 0;

function pauseTimer() {
  if (hideTimeout && !timerPaused) {
    timerPaused = true;
    pauseStartTime = Date.now();
    clearTimeout(hideTimeout);
    console.log('[overlay] Timer paused');
  }
}

function resumeTimer() {
  if (timerPaused) {
    timerPaused = false;
    console.log('[overlay] Timer resumed');
    // We don't know original remaining, so just extend by elapsed pause time
    // In practice, the server handles the real timing
  }
}

function emergencyClear() {
  hideVerse(true);
  showVoiceIndicator('🚨 Urgence');
  setTimeout(() => hideVoiceIndicator(), 2000);
}

/* ==========================================================================
   Theme system
   ========================================================================== */
function applyTheme(theme) {
  if (!theme) return;
  const root = document.documentElement;

  if (theme.background) root.style.setProperty('--overlay-bg', theme.background);
  if (theme.color) root.style.setProperty('--overlay-text', theme.color);
  if (theme.accentColor) root.style.setProperty('--overlay-accent', theme.accentColor);
  if (theme.fontFamily) root.style.setProperty('--overlay-font', theme.fontFamily);
  if (theme.borderColor) root.style.setProperty('--overlay-border', theme.borderColor);
  if (theme.glowColor) root.style.setProperty('--overlay-glow', theme.glowColor);
  if (theme.shadowColor) root.style.setProperty('--overlay-shadow', theme.shadowColor);
  if (theme.particleColor) root.style.setProperty('--overlay-particle', theme.particleColor);
  if (theme.animation) currentAnimation = theme.animation;

  // Update particles color
  updateParticles();
}

/* ==========================================================================
   Indicators
   ========================================================================== */
let voiceIndicatorTimeout = null;
let semanticIndicatorTimeout = null;

function showVoiceIndicator(text = 'Commande vocale') {
  const el = document.getElementById('voice-indicator');
  el.querySelector('span').textContent = text;
  el.classList.add('visible');
  clearTimeout(voiceIndicatorTimeout);
  voiceIndicatorTimeout = setTimeout(() => hideVoiceIndicator(), 2500);
}

function hideVoiceIndicator() {
  document.getElementById('voice-indicator').classList.remove('visible');
}

function showSemanticIndicator(reference, confidence) {
  const el = document.getElementById('semantic-indicator');
  const textEl = document.getElementById('semantic-text');
  textEl.textContent = `IA: ${reference} (${Math.round((confidence || 0) * 100)}%)`;
  el.classList.add('visible');
  clearTimeout(semanticIndicatorTimeout);
  semanticIndicatorTimeout = setTimeout(() => {
    el.classList.remove('visible');
  }, 4000);
}

function showReadingIndicator(show) {
  const el = document.getElementById('reading-indicator');
  el.classList.toggle('visible', show);
}

/* ==========================================================================
   Particles
   ========================================================================== */
function createParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (6 + Math.random() * 4) + 's';
    container.appendChild(p);
  }
}

function updateParticles() {
  const particles = document.querySelectorAll('.particle');
  particles.forEach(p => {
    p.style.background = getComputedStyle(document.documentElement).getPropertyValue('--overlay-particle');
  });
}

/* ==========================================================================
   Utilities
   ========================================================================== */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ==========================================================================
   Init
   ========================================================================== */
createParticles();
console.log('[overlay] ChurchOverlay display ready');
</script>
</body>
</html>
