<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- AJOUT (audit sécurité, extension aux pages Electron/OBS restantes) :
         même politique qu'overlay.html pour les mêmes raisons — connexion
         WebSocket sur un PORT DYNAMIQUE (WS_HOST/PORT configurables) et logo
         (#branding-logo-img/-video) dont l'URL vient du serveur via ce
         WebSocket, donc connect-src/img-src/media-src restent volontairement
         larges (http:/ws: sans domaine figé) plutôt que de risquer de casser
         l'habillage caméra en silence. style-src garde 'unsafe-inline' pour
         le <style>@import Google Fonts ci-dessous ; script-src également,
         pour le <script> de connexion/rendu du logo (pas de dépendance de
         test à addInitScript ici, mais 'self' seul casserait ce <script>
         inline de la même façon que documenté pour dashboard.html/setup.html
         plus haut dans ce chantier). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: http: https:; media-src 'self' http:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>ChurchOverlay — Habillage caméra</title>
    <!--
  ============================================================================
  branding-overlay.html — Logo + titre/sous-titre au-dessus de la caméra
  ----------------------------------------------------------------------------
  AJOUT (demande explicite — "logos, titres, automatisé, mieux qu'OBS").

  Page DISTINCTE de overlay.html (pas un mode/thème de la même page) :
  celle-ci n'affiche JAMAIS de verset, jamais de sous-titre de prédication —
  uniquement le logo de l'église et un bandeau titre/sous-titre, pensés pour
  être posés PAR-DESSUS une source caméra (DroidCam, caméra IP, webcam...)
  dans une scène OBS.

  ChurchOverlay ne peut pas fusionner du HTML directement dans le flux vidéo
  d'une source caméra — c'est OBS qui compose les calques. Ce que cette page
  apporte par rapport à habiller la caméra "à la main" dans OBS (source
  image + source texte repositionnées manuellement à chaque culte) :
  UNE FOIS cette page ajoutée comme Source Navigateur au-dessus de la
  caméra dans OBS, tout le contenu (logo, titre, sous-titre, visibilité)
  se pilote ensuite depuis le tableau de bord ChurchOverlay — plus jamais
  besoin de rouvrir les propriétés d'une source OBS pour changer un texte.

  Connexion WebSocket : même mécanisme que overlay.html (jeton/port via
  ?token=&port=, injectés par main.js/getBrandingOverlayUrl()) — code
  dupliqué plutôt que partagé, cette page tourne indépendamment dans OBS,
  sans accès aux fonctions de overlay.html.
  ============================================================================
-->
    <style>
      /* CORRECTIF (chantier Studio Clair, Track C) : palette figée en dur
     à celle de config/themes/studio-clair-ivoire.json (fond/accent/texte/
     police) — cette page n'est PAS branchée sur le système de thèmes
     overlay (theme-loader.js), elle a son propre petit bloc de styles
     locaux comme stage-display.html/announcement-loop.html ; la
     rebrancher serait un vrai chantier d'architecture séparé, hors
     périmètre ici. AJOUT d'origine (cohérence visuelle avec overlay.html) :
     le titre du bandeau utilise la même serif display que la carte de
     verset — Newsreader remplace Merriweather ici, cohérent avec le
     nouveau thème par défaut de l'overlay (Track B du même chantier). */
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@600&display=swap');
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* Transparent à dessein : OBS compose cette page PAR-DESSUS la source
       caméra placée en dessous dans la scène — un fond opaque cacherait
       entièrement l'image caméra. */
        background: transparent;
        font-family:
          'Segoe UI',
          'IBM Plex Sans',
          -apple-system,
          sans-serif;
      }

      /* ==========================================================================
     Logo — coin configurable (voir action 'brandingUpdate', champs
     position/size). Deux éléments (#branding-logo-img / -video), un seul
     visible à la fois selon logoType — voir applyBranding() plus bas :
     GIF/image passent par <img> (l'animation d'un GIF est nativement gérée
     par le navigateur), vidéo (.mp4/.webm) par <video> en boucle muette.
     ========================================================================== */
      .branding-logo {
        position: fixed;
        object-fit: contain;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        display: none;
      }
      .branding-logo.visible {
        display: block;
      }
      body.pos-top-left .branding-logo {
        top: 32px;
        left: 32px;
      }
      body.pos-top-right .branding-logo {
        top: 32px;
        right: 32px;
      }
      body.pos-bottom-left .branding-logo {
        bottom: 32px;
        left: 32px;
      }
      body.pos-bottom-right .branding-logo {
        bottom: 32px;
        right: 32px;
      }
      /* AJOUT (demande explicite — "plus de paramètres") : taille du logo, en
     plus de sa position — voir action 'setBrandingSize'. */
      body.size-small .branding-logo {
        max-width: 110px;
        max-height: 65px;
      }
      body.size-medium .branding-logo {
        max-width: 180px;
        max-height: 100px;
      }
      body.size-large .branding-logo {
        max-width: 280px;
        max-height: 160px;
      }

      /* ==========================================================================
     Bandeau titre/sous-titre ("lower third") — toujours en bas, centré.
     Volontairement séparé du coin du logo pour ne jamais se chevaucher avec
     lui, quelle que soit la position choisie pour le logo.
     ========================================================================== */
      #branding-lowerthird {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%) translateY(24px);
        max-width: 82vw;
        padding: 16px 28px 14px;
        border-radius: 10px;
        /* CORRECTIF (Studio Clair) : même dégradé ivoire que le fond
       overlay par défaut (studio-clair-ivoire.json), translucide pour
       rester un bandeau composité PAR-DESSUS la caméra dans OBS, pas un
       fond opaque. Bordure sombre à faible opacité (pas --border-subtle
       clair, qui se fondrait dans un fond de caméra lui-même clair) —
       garde une délimitation visible quelle que soit la luminosité de
       l'image caméra en dessous. */
        background: linear-gradient(165deg, rgba(250, 248, 245, 0.92), rgba(244, 239, 230, 0.92));
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(43, 38, 32, 0.14);
        color: #2b2620;
        text-align: center;
        opacity: 0;
        overflow: hidden;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #branding-lowerthird.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
      /* AJOUT (cohérence visuelle avec .verse-card::before dans overlay.html) :
     même fin trait en dégradé, désormais terracotta (accent Studio Clair)
     au lieu de l'ancien or, pour que le bandeau titre porte la même
     signature visuelle que la carte de verset. */
      #branding-lowerthird::before {
        content: '';
        position: absolute;
        top: 0;
        left: 8px;
        right: 8px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #b8622f, transparent);
      }
      #branding-title {
        font-family: 'Newsreader', Georgia, serif;
        font-size: clamp(18px, 2.2vw, 28px);
        font-weight: 600;
        line-height: 1.3;
      }
      #branding-subtitle {
        margin-top: 4px;
        font-size: clamp(13px, 1.3vw, 17px);
        font-weight: 500;
        color: rgba(43, 38, 32, 0.72);
        line-height: 1.3;
      }
      #branding-subtitle:empty {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #branding-lowerthird {
          transition: opacity 0.01ms;
          transform: translateX(-50%) translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <img id="branding-logo-img" class="branding-logo" alt="" />
    <video id="branding-logo-video" class="branding-logo" autoplay loop muted></video>

    <div id="branding-lowerthird">
      <div id="branding-title"></div>
      <div id="branding-subtitle"></div>
    </div>

    <script>
      'use strict';

      // Même mécanisme que overlay.html (voir son commentaire détaillé) : jeton
      // via l'en-tête de handshake WebSocket (Sec-WebSocket-Protocol), pas dans
      // l'URL — évite qu'il finisse en clair dans des journaux d'accès.
      const getWsToken = () => new URLSearchParams(window.location.search).get('token');
      const getWsPort = () => new URLSearchParams(window.location.search).get('port') || '8765';
      const getWsUrl = () => {
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          return `${proto}//${window.location.host}`;
        }
        return `ws://localhost:${getWsPort()}`;
      };

      let ws = null;
      let reconnectTimer = null;

      function applyBranding(data) {
        if (!data) return;

        // AJOUT (demande explicite — "même vidéo, même GIF") : un seul des deux
        // éléments visible à la fois selon logoType — un GIF passe par <img>
        // (animation gérée nativement par le navigateur), une vraie vidéo
        // (.mp4/.webm) par <video> en boucle muette.
        const logoImg = document.getElementById('branding-logo-img');
        const logoVideo = document.getElementById('branding-logo-video');
        if (logoVideo) logoVideo.playsInline = true;
        const isVideo = data.logoType === 'video';
        const activeLogo = isVideo ? logoVideo : logoImg;
        const inactiveLogo = isVideo ? logoImg : logoVideo;

        if (inactiveLogo) {
          inactiveLogo.classList.remove('visible');
          inactiveLogo.removeAttribute('src');
        }
        if (activeLogo) {
          if (data.logoUrl) {
            if (activeLogo.src !== data.logoUrl) activeLogo.src = data.logoUrl;
            activeLogo.classList.add('visible');
          } else {
            activeLogo.classList.remove('visible');
            activeLogo.removeAttribute('src');
          }
        }

        const position = ['top-left', 'top-right', 'bottom-left', 'bottom-right'].includes(
          data.position
        )
          ? data.position
          : 'bottom-right';
        const size = ['small', 'medium', 'large'].includes(data.size) ? data.size : 'medium';
        document.body.className = `pos-${position} size-${size}`;

        const titleEl = document.getElementById('branding-title');
        const subtitleEl = document.getElementById('branding-subtitle');
        if (titleEl) titleEl.textContent = data.title || '';
        if (subtitleEl) subtitleEl.textContent = data.subtitle || '';

        const bar = document.getElementById('branding-lowerthird');
        if (bar) bar.classList.toggle('visible', !!data.visible && !!(data.title || data.subtitle));
      }

      function connectWs() {
        if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN))
          return;

        try {
          const token = getWsToken();
          ws = token ? new WebSocket(getWsUrl(), [token]) : new WebSocket(getWsUrl());
        } catch (e) {
          console.error('[branding-overlay] Error creating WS:', e);
          scheduleReconnect();
          return;
        }

        ws.onopen = () => {
          console.log('[branding-overlay] WebSocket connecté');
          if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
        };

        ws.onmessage = (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }
          if (!msg || !msg.action) return;

          if (msg.action === 'init' || msg.action === 'brandingUpdate') {
            applyBranding(msg.branding || msg);
          }
        };

        ws.onclose = () => {
          console.log('[branding-overlay] WebSocket déconnecté');
          scheduleReconnect();
        };

        ws.onerror = (err) => {
          console.error('[branding-overlay] WebSocket error:', err);
        };
      }

      function scheduleReconnect() {
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connectWs();
          }, 3000);
        }
      }

      connectWs();
    </script>
  </body>
</html>
