<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ChurchOverlay</title>
  <!--
    ChurchOverlay mark, small-size version (favicon, header badge, 16-48 px
    icon sizes). Same idea as logo.svg with flat fills, a heavier cross and no
    fine detail, so it stays legible when tiny. Flat fills only (no gradient
    ids) so it can be inlined more than once in a page without id clashes.
  -->
  <rect x="8" y="8" width="1008" height="1008" rx="228" fill="#16222f" stroke="#3a4e6b" stroke-width="16"/>
  <rect x="436" y="104" width="152" height="560" rx="36" fill="#e9b13f"/>
  <rect x="272" y="236" width="480" height="152" rx="36" fill="#e9b13f"/>
  <rect x="128" y="712" width="768" height="184" rx="92" fill="#ede6d8"/>
  <circle cx="252" cy="804" r="50" fill="#ef4a4a"/>
  <rect x="348" y="786" width="420" height="36" rx="18" fill="#0f1722"/>
</svg>
