<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<!--
  Electron Security Warning fix (docs/tutorial/security.md) — same
  reasoning as the dashboard/overlay pages' own CSP comments, with one
  difference: connect-src allows the bare "ws:" scheme rather than a pinned
  ws://127.0.0.1:* host, because this page (ARCHITECTURE.md section 65.6)
  is opened from whatever LAN IP the operator's machine reports at the
  time — 'self' can't be used for the WS connection (different port than
  this page's own HTTP port) and the exact host isn't knowable in advance.
  The operator token remains the real access control here, not this policy
  (section 65.6 already documents this isn't a security boundary).
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ws:; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Remote</title>
<link href="fonts/fonts.css" rel="stylesheet" />
<style>
  /*
    ARCHITECTURE.md section 65.6 — a phone-based second-operator remote.
    Deliberately narrow: what is on screen, clear it, step the rundown,
    clear media. Same "Vespers" system as the desktop console, scaled for
    one thumb: big targets, one column, the tally colour for what is live.
  */
  :root {
    --nave: #0f1722;
    --pew: #162130;
    --stone: #223044;
    --line: #2b3b52;
    --line-strong: #3a4e6b;
    --vellum: #ede6d8;
    --ash: #a3adbb;
    --ash-dim: #75839a;
    --accent: #e0a93b;
    --accent-ink: #1c1405;
    --on-air: #ef4a4a;
    --on-air-soft: rgba(239, 74, 74, 0.14);
    --cue: #3fcf8e;
    --warn: #f08a3c;
    --font-display: "Instrument Serif", Georgia, serif;
    --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--nave); color: var(--vellum); font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
  body { padding: 16px 16px 40px; max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0; }
  #status-pill { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--ash); }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ash-dim); }
  #status-pill.connected #status-dot { background: var(--cue); }
  #status-pill.disconnected #status-dot { background: var(--warn); }

  .card { background: var(--pew); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card-title { font-family: var(--font-display); font-size: 21px; margin: 0 0 12px; }

  #on-screen { border-width: 2px; transition: border-color 160ms ease, box-shadow 160ms ease; }
  #on-screen.live { border-color: var(--on-air); box-shadow: 0 0 0 4px var(--on-air-soft); }
  #on-screen-state { font-size: 13px; font-weight: 600; color: var(--ash); margin-bottom: 6px; }
  #on-screen.live #on-screen-state { color: #ff8f8f; }
  #on-screen-ref { font-family: var(--font-display); font-size: 30px; line-height: 1.1; min-height: 1.1em; }

  .scene-list { display: flex; flex-direction: column; gap: 8px; }
  .scene-chip { padding: 14px 16px; border-radius: 10px; background: var(--nave); border: 1px solid var(--line); font-size: 15px; color: var(--ash); }
  .scene-chip.active { border-color: var(--on-air); color: var(--vellum); }
  .scene-chip.interrupted { border-color: var(--accent); }
  .scene-empty { color: var(--ash-dim); font-size: 14px; padding: 8px 0; }

  button { font: inherit; font-size: 16px; font-weight: 600; border-radius: 12px; padding: 16px; border: 1px solid transparent; cursor: pointer; min-height: 52px; }
  button:disabled { opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active:not(:disabled) { transform: translateY(1px); }
  .btn-row { display: flex; gap: 10px; }
  .btn-secondary { background: var(--stone); color: var(--vellum); border-color: var(--line-strong); flex: 1; }
  .btn-danger { background: transparent; color: #ff8f8f; border-color: var(--on-air); width: 100%; }
  .btn-clear { background: var(--on-air); color: #fff; width: 100%; margin-top: 14px; font-size: 17px; }

  #no-token { display: none; text-align: center; color: var(--ash); padding: 40px 20px; }
</style>
<body>
  <header>
    <h1 data-t="title">Remote</h1>
    <div id="status-pill" class="disconnected"><span id="status-dot"></span><span id="status-text">…</span></div>
  </header>

  <div id="no-token" data-t="noToken">No operator token in the link. Copy the remote link from the desktop console's Settings again.</div>

  <div id="app">
    <section id="on-screen" class="card" aria-live="polite">
      <div id="on-screen-state" data-t="offAir">Nothing on screen</div>
      <div id="on-screen-ref"></div>
      <button id="clear-verse-btn" class="btn-clear" data-t="clearScreen">Clear the screen</button>
    </section>

    <div class="card">
      <h2 class="card-title" data-t="rundown">Rundown</h2>
      <div id="scene-list" class="scene-list">
        <div class="scene-empty" data-t="noRundown">No rundown loaded.</div>
      </div>
      <div class="btn-row" style="margin-top: 12px">
        <button id="prev-btn" class="btn-secondary" disabled data-t="previous">Previous</button>
        <button id="next-btn" class="btn-secondary" disabled data-t="next">Next</button>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title" data-t="media">Media</h2>
      <button id="clear-media-btn" class="btn-danger" data-t="clearMedia">Stop media</button>
    </div>
  </div>

  <script src="/remote.js"></script>
</body>
</html>
