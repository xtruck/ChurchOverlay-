<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<!--
  Electron Security Warning fix (docs/tutorial/security.md) — same
  reasoning as the dashboard/overlay pages' own CSP comments, with one
  difference: connect-src allows the bare "ws:" scheme rather than a pinned
  ws://127.0.0.1:* host, because this page (ARCHITECTURE.md section 65.6)
  is opened from whatever LAN IP the operator's machine reports at the
  time — 'self' can't be used for the WS connection (different port than
  this page's own HTTP port) and the exact host isn't knowable in advance.
  The operator token remains the real access control here, not this policy
  (section 65.6 already documents this isn't a security boundary).
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws:; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  /*
    ARCHITECTURE.md section 65.6 — a phone-based second-operator remote.
    Deliberately narrow: rundown scene navigation and media clear only, no
    mic/import/manual-override — not a security boundary (the token
    already grants full operator access), a USABILITY one, since a phone
    screen is a poor fit for those actions. Same visual language as the
    dashboard (Instrument Serif/Sans, JetBrains Mono, dark glass cards),
    scaled for a single-column mobile layout.
  */
  :root {
    --mesh-1: #7c6bff;
    --mesh-2: #ff6fae;
    --bg-void: #0a0a12;
    --glass-bg: rgba(20, 20, 34, 0.62);
    --glass-bg-raised: rgba(28, 28, 46, 0.72);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-border-strong: rgba(255, 255, 255, 0.22);
    --text-primary: #f5f5fb;
    --text-secondary: #b7b7cc;
    --text-tertiary: #82829c;
    --accent: #8f7dff;
    --accent-strong: #a996ff;
    --accent-ink: #17102f;
    --success: #34d399;
    --danger: #ff7086;
    --danger-soft: rgba(255, 112, 134, 0.16);
    --radius-md: 14px;
    --radius-lg: 20px;
    --font-display: "Instrument Serif", Georgia, serif;
    --font-ui: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--text-primary);
    font-family: var(--font-ui);
    background-color: var(--bg-void);
    background-image:
      radial-gradient(at 20% 10%, color-mix(in srgb, var(--mesh-1) 50%, transparent) 0px, transparent 45%),
      radial-gradient(at 85% 90%, color-mix(in srgb, var(--mesh-2) 40%, transparent) 0px, transparent 45%);
    background-attachment: fixed;
  }
  body { padding: 16px; padding-bottom: 40px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  h1 {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 20px;
    margin: 0;
  }
  #status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--glass-bg-raised);
    border: 1px solid var(--glass-border);
    font-size: 11px;
    font-family: var(--font-mono);
  }
  #status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); }
  #status-pill.connected #status-dot { background: var(--success); }
  #status-pill.disconnected #status-dot { background: var(--danger); }

  .card {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    margin-bottom: 10px;
  }

  .scene-list { display: flex; flex-direction: column; gap: 8px; }
  .scene-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--glass-border);
    font-size: 14px;
    color: var(--text-secondary);
  }
  .scene-chip.active { border-color: var(--accent); background: rgba(143, 125, 255, 0.16); color: var(--text-primary); }
  .scene-chip.interrupted { border-color: var(--danger); }
  .scene-empty { color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 12px 0; }

  button {
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius-md);
    padding: 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.4; }
  .btn-row { display: flex; gap: 10px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); flex: 1; }
  .btn-secondary { background: var(--glass-bg-raised); color: var(--text-primary); border: 1px solid var(--glass-border-strong); flex: 1; }
  .btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(255, 112, 134, 0.35); width: 100%; }

  #no-token {
    display: none;
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 20px;
  }
</style>
</head>
<body>
  <header>
    <h1>ChurchOverlay Remote</h1>
    <div id="status-pill" class="disconnected"><span id="status-dot"></span><span id="status-text">connecting…</span></div>
  </header>

  <div id="no-token">
    No operator token in the link. Scan the QR code from the desktop dashboard's Remote panel again.
  </div>

  <div id="app">
    <div class="card">
      <div class="card-title">Rundown</div>
      <div id="scene-list" class="scene-list">
        <div class="scene-empty">No rundown loaded.</div>
      </div>
      <div class="btn-row" style="margin-top: 12px">
        <button id="prev-btn" class="btn-secondary" disabled>◀ Previous</button>
        <button id="next-btn" class="btn-secondary" disabled>Next ▶</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Media</div>
      <button id="clear-media-btn" class="btn-danger">Clear media</button>
    </div>
  </div>

  <script src="/remote.js"></script>
</body>
</html>
