<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChurchOverlay — Overlay</title>
<style>
  :root {
    --accent: #f5a15a;
    --scrim: rgba(6, 7, 10, 0.55);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: "Iowan Old Style", "Georgia", "Times New Roman", serif;
    overflow: hidden;
  }

  #status {
    position: fixed;
    top: 14px;
    left: 14px;
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #b6bcc7;
    background: rgba(0, 0, 0, 0.45);
    padding: 5px 10px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  #verse {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 9%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 7%;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #verse.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #verse-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1150px;
    padding: 28px 48px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.42));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
  }

  #verse-text {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-size: clamp(20px, 3vw, 42px);
    line-height: 1.35;
    text-align: center;
    font-weight: 500;
  }

  #verse-ref-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  #verse-ref-row::before,
  #verse-ref-row::after {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--accent);
    opacity: 0.7;
  }
  #verse-reference {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    font-size: clamp(13px, 1.5vw, 20px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="verse">
    <div id="verse-card">
      <div id="verse-text"></div>
      <div id="verse-ref-row">
        <div id="verse-reference"></div>
      </div>
    </div>
  </div>
  <script src="/overlay.js"></script>
</body>
</html>
