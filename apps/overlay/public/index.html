<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ChurchOverlay — Overlay</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: Georgia, "Times New Roman", serif;
    overflow: hidden;
  }
  #status {
    position: fixed;
    top: 12px;
    left: 12px;
    font-family: monospace;
    font-size: 12px;
    color: #9ca3af;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 4px;
  }
  #verse {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 8%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 6%;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #verse.visible { opacity: 1; }
  #verse-text {
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    font-size: clamp(20px, 3.2vw, 44px);
    line-height: 1.3;
    text-align: center;
    max-width: 1100px;
  }
  #verse-reference {
    margin-top: 14px;
    color: #f5a15a;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    font-size: clamp(14px, 1.6vw, 22px);
    font-weight: bold;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="verse">
    <div id="verse-text"></div>
    <div id="verse-reference"></div>
  </div>
  <script src="/overlay.js"></script>
</body>
</html>
