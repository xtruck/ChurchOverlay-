<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--
  Electron Security Warning fix (docs/tutorial/security.md) — same reasoning
  as apps/desktop/renderer/index.html's own CSP comment: default-src 'none'
  plus explicit allowances. img-src/media-src 'self' cover the voice-
  triggered media layer's images/video/audio, all served same-origin from
  "/media/<id>" by this page's own StaticServer (never a remote URL).
  connect-src allows ws://127.0.0.1:* since the WS server runs on a
  different port than the HTTP port serving this page.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; media-src 'self'; connect-src 'self' ws://127.0.0.1:*; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  /*
    Verse Ops Console visual system (Phase 0 — ARCHITECTURE.md section 59),
    applied here with the SAME typography as the operator dashboard
    (Instrument Serif/Sans, JetBrains Mono) but a deliberately different
    visual language, unchanged from the prior redesign's reasoning: this is
    composited over live, unpredictable video in OBS Browser Source, not
    rendered on its own background, so legibility over anything drives every
    choice here — no mesh gradient, no app-chrome accent color. The scrim
    (a plain dark gradient) is the PRIMARY legibility mechanism and works
    regardless of browser support; backdrop-filter blur is layered on top
    as a progressive frosted-glass enhancement, not a replacement for it.
  */
  :root {
    --accent: #b7a6ff;
    --scrim: rgba(6, 7, 10, 0.6);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }

  #status {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: #b6bcc7;
    background: rgba(0, 0, 0, 0.45);
    padding: 5px 10px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  #verse {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 9%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 7%;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #verse.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #verse-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1150px;
    padding: 28px 48px;
    border-radius: 20px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    /* Progressive enhancement only — see the comment above #status.
       The scrim gradient above already guarantees legibility without this. */
    #verse-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }

  #verse-text {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 3.2vw, 44px);
    line-height: 1.4;
    text-align: center;
    font-weight: 400;
  }

  /*
    Bilingual mode (ARCHITECTURE.md section 63.4): present only when a
    verse:show payload carries `secondary` — French (primary, above, in
    #verse-text) stays in the existing styling; English (secondary) is
    visually subordinate: smaller, italic, slightly less opaque. Hidden
    entirely (not just empty) for single-language mode, so it takes no
    layout space at all.
  */
  #verse-secondary-text {
    display: none;
    color: rgba(255, 255, 255, 0.75);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(14px, 1.8vw, 24px);
    line-height: 1.45;
    text-align: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
  }
  #verse-secondary-text.visible { display: block; }

  #verse-ref-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  #verse-ref-row::before,
  #verse-ref-row::after {
    content: "";
    width: 22px;
    height: 1px;
    background: var(--accent);
    opacity: 0.7;
  }
  #verse-reference {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: clamp(13px, 1.5vw, 20px);
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /*
    Media Library (ARCHITECTURE.md section 60) had no audience-facing
    display at all until this — the server/dashboard side was fully built
    and tested, but the actual OBS overlay only ever handled verse:show/
    verse:clear. An image/video cue is a full "scene" (a slide inserted
    between segments), so it fills the frame on an opaque black backdrop
    rather than the transparent-body treatment the verse card uses — z-index
    keeps it BEHIND the verse/announcement layers, so a live-detected verse
    interrupting a rundown's media scene (section 64.2) still overlays on
    top instead of the two fighting for the same layer. Audio has no visual
    at all — it plays without ever toggling this layer's visibility.
  */
  #media-layer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  #media-layer.visible { display: flex; }
  #media-image, #media-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Announcement (ARCHITECTURE.md section 64.1) — new content type, reuses
     the verse card's scrim-first legibility recipe with its own simpler
     title+body layout. Sits above the media layer, same as #verse. */
  #announcement {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 7%;
    opacity: 0;
    pointer-events: none;
    transform: translateY(18px);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #announcement.visible { opacity: 1; transform: translateY(0); }
  #announcement-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 1000px;
    padding: 36px 52px;
    border-radius: 20px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #announcement-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }
  #announcement-title {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: clamp(20px, 2.6vw, 34px);
    font-weight: 700;
    text-align: center;
  }
  #announcement-body {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 2.4vw, 30px);
    line-height: 1.45;
    text-align: center;
  }

  /*
    Glossary definition (ARCHITECTURE.md section 65.5) — visually DISTINCT
    from the announcement card, deliberately: a definition is a momentary
    aside the operator never manages (it clears itself on a fixed server
    timer, section 65.5), not a scene. A compact lower-left corner card,
    not a full-screen center takeover, reflects that difference at a
    glance rather than looking like just another announcement.
  */
  #definition {
    position: fixed;
    left: 5%;
    bottom: 9%;
    z-index: 2;
    max-width: 440px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(12px);
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #definition.visible { opacity: 1; transform: translateY(0); }
  #definition-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 22px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #definition-card {
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      backdrop-filter: blur(14px) saturate(115%);
    }
  }
  #definition-term {
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #definition-body {
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="status">connecting…</div>
  <div id="media-layer">
    <img id="media-image" alt="" style="display: none" />
    <video id="media-video" style="display: none" playsinline></video>
  </div>
  <audio id="media-audio"></audio>
  <div id="verse">
    <div id="verse-card">
      <div id="verse-text"></div>
      <div id="verse-secondary-text"></div>
      <div id="verse-ref-row">
        <div id="verse-reference"></div>
      </div>
    </div>
  </div>
  <div id="announcement">
    <div id="announcement-card">
      <div id="announcement-title"></div>
      <div id="announcement-body"></div>
    </div>
  </div>
  <div id="definition">
    <div id="definition-card">
      <div id="definition-term"></div>
      <div id="definition-body"></div>
    </div>
  </div>
  <script src="/overlay.js"></script>
</body>
</html>
