<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--
  Electron Security Warning fix (docs/tutorial/security.md) — same reasoning
  as apps/desktop/renderer/index.html's own CSP comment: default-src 'none'
  plus explicit allowances. img-src/media-src 'self' cover the voice-
  triggered media layer's images/video/audio, all served same-origin from
  "/media/<id>" by this page's own StaticServer (never a remote URL).
  connect-src allows the bare "ws:" scheme rather than a pinned
  ws://127.0.0.1:* host, matching apps/remote/public/index.html's own CSP
  and for the identical reason (ARCHITECTURE.md section 65.6): once
  allowPhoneRemote is on, the WS server binds to 0.0.0.0, and this page can
  be opened from whatever LAN address reaches it — not only 127.0.0.1 — so
  the exact host isn't knowable in advance. As section 65.6 already
  documents, the viewer token remains the real access control here, not
  this policy.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self' ws:; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Overlay</title>
<link href="fonts/fonts.css" rel="stylesheet" />
<style>
  /*
    Verse Ops Console visual system (Phase 0 — ARCHITECTURE.md section 59),
    applied here with the SAME typography as the operator dashboard
    (Instrument Serif/Sans, JetBrains Mono) but a deliberately different
    visual language, unchanged from the prior redesign's reasoning: this is
    composited over live, unpredictable video in OBS Browser Source, not
    rendered on its own background, so legibility over anything drives every
    choice here — no mesh gradient, no app-chrome accent color. The scrim
    (a plain dark gradient) is the PRIMARY legibility mechanism and works
    regardless of browser support; backdrop-filter blur is layered on top
    as a progressive frosted-glass enhancement, not a replacement for it.
  */
  :root {
    /*
      ARCHITECTURE.md section 110: every colour/brand value below is a CSS
      custom property that overlay.js sets from the server's overlay:style
      event (only ever validated #rrggbb or clamped numbers, never markup).
      The defaults here are the gilt-night palette = the look from before
      the style system existed, so a page that never receives a style
      renders as it always did.
    */
    --accent: #e6c27a;
    --accent-rgb: 230, 194, 122;
    --ov-card-rgb: 6, 7, 10;
    --ov-card-a: 0.6;
    --scrim: rgba(var(--ov-card-rgb), var(--ov-card-a));
    --ov-text: #ffffff;
    --ov-text2: #f2f4f7;
    --ov-border: rgba(255, 255, 255, 0.08);
    --ov-backdrop: #0c1320;
    --ov-backdrop-2: #070b12;
    --ov-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    /* Vespers 2 motion (MASTER.md): enter 320ms, exit faster (200ms),
       transform/opacity only. */
    --ov-ease: cubic-bezier(0.2, 0, 0, 1);
    --ov-ease-out: cubic-bezier(0.4, 0, 1, 1);
    --ov-enter: 320ms;
    --ov-exit: 200ms;
    /* Section 133: rgb triples of two more colour roles, for translucent
       design effects (overlay.js sets them with the rest of the palette). */
    --ov-text2-rgb: 242, 244, 247;
    --ov-border-rgb: 42, 45, 51;
    /* Section 133 verse card motion. Entrances decelerate long and soft
       (expo-out), exits accelerate briefly, sweeps ease both ways. */
    --vc-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --vc-ease-in: cubic-bezier(0.5, 0, 0.75, 0);
    --vc-ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
    --vc-exit: 420ms;
    --vc-fade: 260ms;
    /* Letterbox bar height of the cinema design (2.39:1 would be 12.8vh; a
       touch less keeps more of the live picture). */
    --lb-h: 10vh;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    /* Broadcast type: real kerning + ligatures, optical sizes where the
       face has them, grayscale AA (CEF composites onto video). */
    font-kerning: normal;
    font-optical-sizing: auto;
    font-feature-settings: "kern" 1, "liga" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  /*
    Connection chrome: a diagnostic, never content. It starts hidden (no
    flash on load), stays hidden while connected, and appears only when
    something has been wrong for longer than a short grace period (see
    overlay.js setStatus). Small, low-contrast, top-left, out of the
    title-safe verse area.
  */
  #status {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #c7ccd6;
    background: rgba(11, 14, 19, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 4px 10px;
    border-radius: 999px;
    pointer-events: none;
  }
  #status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f08a3c;
  }

  /*
    ARCHITECTURE.md section 110.2: the church name and logo are free-placed
    brand items. x/y are the item CENTRE in percent of the frame; the text
    size is "px at 1080p" turned into vh so it scales with the frame (OBS
    source size, NDI 1920x1080 and the dashboard preview all agree).
    Hidden until overlay:style says otherwise: no product name is ever shown.
  */
  .brand-item {
    position: fixed;
    z-index: 3;
    display: none;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    pointer-events: none;
    user-select: none;
  }
  .brand-item.visible { display: block; }
  #brand-name {
    white-space: nowrap;
    font-size: calc(var(--brand-size, 28) * 0.0925926vh);
    letter-spacing: 0.02em;
    color: var(--brand-color, var(--ov-text));
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }
  #brand-name.plate {
    background: rgba(var(--ov-card-rgb), 0.55);
    padding: 0.4em 1em;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  #brand-logo {
    height: 12vh;
    width: auto;
    max-width: 40vw;
    object-fit: contain;
  }
  #status { transition: opacity var(--ov-exit) var(--ov-ease); }
  #status.status-hidden { opacity: 0; visibility: hidden; transition: opacity var(--ov-exit) var(--ov-ease), visibility 0s linear var(--ov-exit); }

  /*
    Lower-third base: bottom-anchored inside a ~7% title-safe margin.
    Exit (200ms, accelerate) is faster than enter (320ms, decelerate);
    only opacity/transform animate, so nothing reflows on air.
  */
  #verse {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 9%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 7%;
    overflow: hidden;
    opacity: 0;
    transform: translate3d(0, 10px, 0);
    /* Section 133 exit: a brief accelerate-out; the text also softens (below). */
    transition: opacity var(--vc-exit) var(--vc-ease-in), transform var(--vc-exit) var(--vc-ease-in);
  }
  #verse.visible {
    opacity: 1;
    transform: none;
    /* The container only fades and lifts a little: the card, the words and
       the reference carry the choreography (see "Section 133" below). */
    transition: opacity 380ms var(--vc-ease-out), transform 800ms var(--vc-ease-out);
  }
  #verse.vc-fade.visible { transition: opacity var(--vc-fade) ease-out, transform var(--vc-fade) ease-out; }
  #verse.vc-cut, #verse.vc-cut #verse-text, #verse.vc-cut #verse-secondary-text { transition: none; }
  #verse:not(.visible) #verse-text,
  #verse:not(.visible) #verse-secondary-text {
    filter: blur(3px);
    transition: filter var(--vc-exit) var(--vc-ease-in);
  }

  #verse-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1150px;
    padding: 28px 52px 26px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--scrim), rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.8)));
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    border: 1px solid var(--ov-border);
    box-sizing: border-box;
    max-height: 100%;
    overflow: hidden;
    /* Section 133: positioned + its own stacking context, so design layers
       (::before/::after with z-index -1) paint above the card surface but
       BELOW the text. The auto-fit's last-resort shrink is a variable here
       (not an inline transform) so the entrance keyframes can include it. */
    position: relative;
    isolation: isolate;
    transform: scale(var(--fit-scale, 1));
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    /* Progressive enhancement only — see the comment above #status.
       The scrim gradient above already guarantees legibility without this. */
    #verse-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }

  #verse-text {
    color: var(--ov-text);
    text-shadow: var(--ov-shadow);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 3.2vw, 44px);
    line-height: 1.34;
    letter-spacing: 0.003em;
    text-align: center;
    font-weight: 400;
    /* ~60-character measure for a lower-third; em-based so it tracks the
       size fitVerseText() picks. Balanced wrapping avoids a lone last
       word ("pretty" fallback for engines without balance). */
    max-width: 32em;
    text-wrap: pretty;
    text-wrap: balance;
    hanging-punctuation: first last;
    font-variant-numeric: lining-nums;
    overflow-wrap: break-word;
  }

  /*
    ARCHITECTURE.md section 82: fullscreen layout — the confirmed default.
    Unlike lower-third (above), this deliberately gives #verse-card an
    OPAQUE full-bleed background rather than the translucent scrim: the
    user's explicit requirement is that a poster/media backdrop underneath
    is fully covered while a verse is showing, not just dimmed around a
    small card. #verse itself switches from bottom-anchored to filling and
    centering in the whole viewport; text sizes step up so a full screen
    of otherwise-empty space still reads as intentional, not a lower-third
    card stretched thin.
  */
  #verse.fullscreen {
    inset: 0;
    bottom: 0;
    justify-content: center;
    padding: 4vh 6vw;
    overflow: hidden;
  }
  #verse.fullscreen #verse-card {
    max-width: none;
    width: 100%;
    height: auto;
    max-height: 100%;
    min-height: 0;
    padding: clamp(24px, 5vh, 72px) clamp(24px, 5vw, 96px);
    justify-content: center;
    border-radius: 0;
    border: none;
    /* Not a flat black: a soft fall of light from above, like a lit
       window over the nave, fading into deep ink. Opaque, so a poster or
       video underneath stays fully covered (section 82). */
    background: transparent;
    box-shadow: none;
  }
  /* The full-bleed backdrop lives on the fixed #verse container, not the
     card: overlay.js's fitVerseText() measures the CARD against a fraction
     of the viewport, so the card must stay content-sized. Painting the
     container instead truly covers the whole frame (section 82's
     requirement — the old padded card left the poster/video visible
     around its edges). A soft fall of light from above, like a lit window
     over the nave, fading into deep ink. */
  #verse.fullscreen {
    background:
      radial-gradient(120% 70% at 50% -12%, rgba(var(--accent-rgb), 0.11), transparent 62%),
      radial-gradient(90% 60% at 50% 125%, rgba(46, 78, 128, 0.28), transparent 70%),
      linear-gradient(180deg, var(--ov-backdrop), var(--ov-backdrop-2));
  }
  #verse.fullscreen #verse-text { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); line-height: 1.28; max-width: 26em; }
  /* The full-bleed backdrop never slides: it only fades, so the frame edge
     never shows video through a moving gap. The words inside still settle
     (see .reveal below). */
  #verse.fullscreen,
  #verse.fullscreen.visible { transform: none; }
  /*
    #verse-text/#verse-secondary-text font-size is NOT set here —
    overlay.js's fitVerseText() always sets it as an inline style (an
    auto-shrink-to-fit algorithm, not a fixed size), which would silently
    override any font-size declared in this stylesheet regardless of
    specificity. fitVerseText() itself branches on this fullscreen class
    to use a much larger cap and a bigger available area — see its own
    comment in overlay.js.
  */

  /*
    Bilingual mode (ARCHITECTURE.md section 63.4): present only when a
    verse:show payload carries `secondary` — French (primary, above, in
    #verse-text) stays in the existing styling; English (secondary) is
    visually subordinate: smaller, italic, slightly less opaque. Hidden
    entirely (not just empty) for single-language mode, so it takes no
    layout space at all.
  */
  #verse-secondary-text {
    display: none;
    color: var(--ov-text2);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(14px, 1.8vw, 24px);
    line-height: 1.45;
    text-align: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
    max-width: 40em;
    text-wrap: pretty;
    text-wrap: balance;
  }
  #verse-secondary-text.visible { display: block; }

  #verse-ref-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
  }
  #verse-ref-row::before,
  #verse-ref-row::after {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--accent);
    opacity: 0.6;
  }
  #verse-reference {
    color: var(--accent);
    text-shadow: var(--ov-shadow);
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: clamp(18px, 2.1vw, 34px);
    font-weight: 400;
    letter-spacing: 0.02em;
    font-variant-numeric: lining-nums;
    white-space: nowrap;
  }
  #verse.fullscreen #verse-ref-row { margin-top: clamp(18px, 3vh, 40px); }
  #verse.fullscreen #verse-reference { font-size: clamp(22px, 2.5vw, 48px); }
  #verse.fullscreen #verse-ref-row::before,
  #verse.fullscreen #verse-ref-row::after { width: clamp(28px, 4vw, 72px); }

  /*
    ARCHITECTURE.md section 108: preset visual templates for how the verse
    card itself looks, independent of verseLayout (fullscreen/lower-third
    is WHERE it sits on screen; these are what it looks like there). Class
    applied to #verse-card by overlay.js's applyBranding(), from the same
    branding:update payload organizationName/accentColor already arrive on
    (ARCHITECTURE.md section 94's precedent: static for the process
    lifetime, synced on connect). "classic" is the default look above —
    no extra class, zero risk of regressing every existing install's
    appearance. font-size is deliberately untouched by every rule below:
    overlay.js's fitVerseText() always sets it as an inline style (see the
    comment above #verse-secondary-text), which would silently override
    anything declared here regardless of specificity.

    Each template also gets a fullscreen-scoped override
    (#verse.fullscreen #verse-card.tpl-*), matching fullscreen's own higher
    specificity (#verse.fullscreen #verse-card) — without it, fullscreen's
    existing "no card chrome" rule would silently erase every template's
    own distinguishing chrome, making all four look identical in fullscreen
    mode (the app's own confirmed default layout, ARCHITECTURE.md section
    82) — the one case this feature would most need to actually work in.
  */
  #verse-card.tpl-banner {
    background: rgba(var(--ov-card-rgb), calc(0.4 + var(--ov-card-a) * 0.5));
    border-radius: 6px;
    border: none;
    border-top: 6px solid var(--accent);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  #verse-card.tpl-banner #verse-text,
  #verse-card.tpl-banner #verse-reference {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 600;
  }
  /* Sans at display sizes wants tighter tracking and leading than the serif. */
  #verse-card.tpl-banner #verse-text { letter-spacing: -0.005em; line-height: 1.3; }
  #verse-card.tpl-banner #verse-reference {
    font-size: clamp(14px, 1.5vw, 24px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #verse-card.tpl-banner #verse-ref-row::before,
  #verse-card.tpl-banner #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-banner {
    border-top: 10px solid var(--accent);
    background: linear-gradient(180deg, rgba(var(--ov-card-rgb), 0.35), rgba(var(--ov-card-rgb), 0.7));
  }

  #verse-card.tpl-minimal {
    background: transparent;
    border: none;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    padding: 12px 24px;
  }
  #verse-card.tpl-minimal #verse-text {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.3;
    /* No card: a tight edge shadow for crispness plus a wide soft halo for
       legibility over bright video. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 3px 18px rgba(0, 0, 0, 0.75);
  }
  #verse-card.tpl-minimal #verse-reference {
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 2px 12px rgba(0, 0, 0, 0.7);
  }
  #verse-card.tpl-minimal #verse-ref-row::before,
  #verse-card.tpl-minimal #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-minimal { background: transparent; }

  #verse-card.tpl-elegant {
    border: 1px solid var(--accent);
    border-radius: 28px;
    box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.12), 0 12px 48px rgba(0, 0, 0, 0.35);
    padding: 36px 56px;
  }
  #verse-card.tpl-elegant #verse-reference {
    letter-spacing: 0.06em;
  }
  #verse-card.tpl-elegant #verse-text { line-height: 1.4; }
  #verse-card.tpl-elegant #verse-ref-row::before,
  #verse-card.tpl-elegant #verse-ref-row::after { width: 44px; opacity: 0.8; }
  #verse.fullscreen #verse-card.tpl-elegant {
    border: 1px solid var(--accent);
    box-shadow: 0 0 90px rgba(var(--accent-rgb), 0.1);
  }

  /*
    ARCHITECTURE.md section 110: two new card designs.
    glass: a frosted pane, strong blur, hairline light border.
    ribbon: an accent bar down the left edge, text set left-aligned.
    Each has a fullscreen override for the same reason the four above do
    (fullscreen's "no card chrome" rule would otherwise erase them).
  */
  #verse-card.tpl-glass {
    background: linear-gradient(135deg, rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.8)), rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.55)));
    border: 1px solid var(--ov-border);
    border-radius: 32px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    backdrop-filter: blur(28px) saturate(140%);
  }
  #verse-card.tpl-glass #verse-ref-row::before,
  #verse-card.tpl-glass #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-glass {
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.35));
    border-radius: 40px;
    width: auto;
    max-width: 92%;
    padding: clamp(24px, 5vh, 64px) clamp(28px, 5vw, 88px);
    border: 1px solid var(--ov-border);
  }

  #verse-card.tpl-ribbon {
    align-items: flex-start;
    border-radius: 4px 22px 22px 4px;
    border: none;
    border-left: 12px solid var(--accent);
    padding: 28px 48px 28px 40px;
  }
  #verse-card.tpl-ribbon #verse-text,
  #verse-card.tpl-ribbon #verse-secondary-text { text-align: left; }
  /* Balanced lines read as a ragged block when set left; keep the full
     measure and only avoid orphans. */
  #verse-card.tpl-ribbon #verse-text,
  #verse-card.tpl-ribbon #verse-secondary-text { text-wrap: pretty; }
  #verse-card.tpl-ribbon #verse-ref-row::before { display: none; }
  #verse-card.tpl-ribbon #verse-ref-row::after { width: 56px; }
  #verse.fullscreen #verse-card.tpl-ribbon {
    width: auto;
    max-width: 92%;
    align-self: center;
    border-left: 16px solid var(--accent);
    border-radius: 6px 36px 36px 6px;
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.5));
  }

  /*
    Clear-text palettes (card opacity 0): no card at all, so legibility rests
    on the text shadow alone. Set by overlay.js; wins over every design.
  */
  #verse-card.no-card,
  #verse.fullscreen #verse-card.no-card {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  #verse-card.no-card #verse-text,
  #verse-card.no-card #verse-reference,
  #verse-card.no-card #verse-secondary-text {
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 0 18px rgba(0, 0, 0, 0.75);
  }

  /* ===================================================================
     Section 133: cinematic verse cards and transitions.

     overlay.js (with the pure verse-motion.js) drives a small state machine
     on #verse through classes:
       vc-enter     full intro: card, then words line by line, then reference
       vc-swap-out  verse-to-verse, outgoing half: the content lifts away
       vc-swap-in   verse-to-verse, incoming half: the card stays up
       vc-fade      short fade (late join, "gentle" style, reduced motion)
       vc-fade-out  outgoing half of a gentle verse-to-verse change
       vc-cut       no motion at all ("instant" style)
     and #verse[data-card] names the design. Every verse word is its own
     .vc-w span (built with textContent), whose start delay --d (ms) is
     computed per line by verse-motion.js after the auto-fit has run.
     Every class is removed when the reveal settles, so a verse at rest is
     plain static text with no animation, filter or extra layer left on it.

     Only opacity, transform and filter are animated (compositor-friendly in
     OBS's CEF); keyframes are mostly from-only, so each lands exactly on the
     element's own resting style: text is fully legible the moment it settles.
     =================================================================== */
  #verse-text .vc-w { display: inline-block; max-width: 100%; }
  .vc-dropcap, #verse-ornament { display: none; }
  #verse-card {
    --rv-dx: 0em;
    --rv-dy: 0.3em;
    --rv-blur: 7px;
    --rv-scale: 1;
    --rv-ease: var(--vc-ease-out);
    --card-dx: 0px;
    --card-dy: 16px;
    --card-s: 0.985;
    --card-dur: 700ms;
    --card-ease: var(--vc-ease-out);
  }
  #verse.vc-dense .vc-w { --rv-blur: 0px; }

  @keyframes vc-word-in {
    from { opacity: 0; transform: translate3d(var(--rv-dx), var(--rv-dy), 0) scale(var(--rv-scale)); filter: blur(var(--rv-blur)); }
  }
  @keyframes vc-rise-in {
    from { opacity: 0; transform: translate3d(0, 0.45em, 0); filter: blur(6px); }
  }
  @keyframes vc-card-in {
    from { opacity: 0; transform: translate3d(var(--card-dx), var(--card-dy), 0) scale(calc(var(--fit-scale, 1) * var(--card-s))); }
  }
  @keyframes vc-card-return {
    from { opacity: 0.55; transform: scale(calc(var(--fit-scale, 1) * 0.99)); }
  }
  @keyframes vc-card-dim {
    to { opacity: 0.55; transform: scale(calc(var(--fit-scale, 1) * 0.99)); }
  }
  @keyframes vc-out {
    to { opacity: 0; transform: translate3d(0, -0.2em, 0); filter: blur(6px); }
  }
  @keyframes vc-fade-in { from { opacity: 0; } }
  @keyframes vc-fade-out { to { opacity: 0; } }
  @keyframes vc-rule-grow { from { transform: scaleX(0); opacity: 0; } }
  @keyframes vc-sweep {
    from { transform: translate3d(-120%, 0, 0); opacity: 0; }
    25% { opacity: 1; }
    70% { opacity: 1; }
    to { transform: translate3d(320%, 0, 0); opacity: 0; }
  }

  /* --- incoming --- */
  #verse.vc-enter #verse-card { animation: vc-card-in var(--card-dur) var(--card-ease) both; }
  #verse.vc-swap-in #verse-card { animation: vc-card-return 560ms var(--vc-ease-out) both; }
  #verse.vc-enter .vc-w,
  #verse.vc-swap-in .vc-w {
    animation: vc-word-in calc(var(--vc-word-dur, 560) * 1ms) var(--rv-ease) calc(var(--d, 0) * 1ms) both;
  }
  #verse.vc-enter #verse-secondary-text,
  #verse.vc-swap-in #verse-secondary-text {
    animation: vc-rise-in calc(var(--vc-word-dur, 560) * 1ms) var(--vc-ease-out) calc(var(--vc-sec-delay, 0) * 1ms) both;
  }
  #verse.vc-enter #verse-ref-row,
  #verse.vc-swap-in #verse-ref-row {
    animation: vc-rise-in calc(var(--vc-ref-dur, 520) * 1ms) var(--vc-ease-out) calc(var(--vc-ref-delay, 0) * 1ms) both;
  }
  /* The accent rules draw outward from the reference, just ahead of it. */
  #verse-ref-row::before { transform-origin: 100% 50%; }
  #verse-ref-row::after { transform-origin: 0% 50%; }
  #verse.vc-enter #verse-ref-row::before, #verse.vc-enter #verse-ref-row::after,
  #verse.vc-swap-in #verse-ref-row::before, #verse.vc-swap-in #verse-ref-row::after {
    animation: vc-rule-grow 760ms var(--vc-ease-out) calc(var(--vc-ref-delay, 0) * 1ms - 60ms) both;
  }
  /* A soft band of light crosses the card once, behind the text (z-index -1
     inside the card's stacking context). Only on designs with a surface. */
  #verse:is(.vc-enter, .vc-swap-in) #verse-card:is(:not([class*="tpl-"]), .tpl-banner, .tpl-elegant, .tpl-glass, .tpl-ribbon, .tpl-cinema, .tpl-stained):not(.no-card)::after {
    content: "";
    position: absolute;
    top: -20%;
    bottom: -20%;
    left: 0;
    width: 40%;
    z-index: -1;
    pointer-events: none;
    background: linear-gradient(100deg, transparent 0%, rgba(var(--accent-rgb), 0.09) 38%, rgba(255, 255, 255, 0.09) 50%, rgba(var(--accent-rgb), 0.07) 62%, transparent 100%);
    animation: vc-sweep 880ms var(--vc-ease-inout) 90ms both;
  }

  /* --- outgoing (verse to verse) --- */
  #verse.vc-swap-out #verse-card { animation: vc-card-dim calc(var(--vc-out-dur, 300) * 1ms) var(--vc-ease-in) forwards; }
  #verse.vc-swap-out #verse-text,
  #verse.vc-swap-out #verse-secondary-text,
  #verse.vc-swap-out #verse-ornament,
  #verse.vc-swap-out #verse-ref-row {
    animation: vc-out calc(var(--vc-out-dur, 300) * 1ms) var(--vc-ease-in) forwards;
  }
  #verse.vc-swap-out #verse-ref-row { animation-duration: calc(var(--vc-out-dur, 300) * 0.8ms); }

  /* --- gentle / late join / reduced motion --- */
  #verse.vc-fade #verse-text,
  #verse.vc-fade #verse-secondary-text,
  #verse.vc-fade #verse-ornament,
  #verse.vc-fade #verse-ref-row { animation: vc-fade-in var(--vc-fade) ease-out both; }
  #verse.vc-fade-out #verse-text,
  #verse.vc-fade-out #verse-secondary-text,
  #verse.vc-fade-out #verse-ornament,
  #verse.vc-fade-out #verse-ref-row { animation: vc-fade-out 180ms ease-in forwards; }

  /* ---------------------------------------------------------------
     New design 1: cinema. A widescreen title: letterbox bars close in
     from the frame edges, the verse rests on a full-width band of the
     card colour rising out of the bottom bar, a warm light leak crosses
     it, and the words drift in sideways like a film title.
     --------------------------------------------------------------- */
  #verse-letterbox { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: none; }
  #verse[data-card="cinema"] + #verse-letterbox { display: block; }
  .lb-bar {
    position: absolute;
    left: 0;
    right: 0;
    height: var(--lb-h);
    background: rgb(var(--ov-card-rgb));
    transform: scaleY(0);
    transition: transform 460ms var(--vc-ease-in) 80ms;
  }
  .lb-top { top: 0; transform-origin: 50% 0%; }
  .lb-bottom { bottom: 0; transform-origin: 50% 100%; }
  .lb-bar::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent 8%, rgba(var(--accent-rgb), 0.5) 50%, transparent 92%);
  }
  .lb-top::after { bottom: 0; }
  .lb-bottom::after { top: 0; }
  #verse.visible[data-card="cinema"] + #verse-letterbox .lb-bar { transform: none; transition: transform 900ms var(--vc-ease-out); }
  #verse.vc-cut + #verse-letterbox .lb-bar { transition: none; }
  #verse[data-card="cinema"]:not(.fullscreen) { bottom: var(--lb-h); padding: 0; }
  #verse-card.tpl-cinema {
    --rv-dx: 0.4em;
    --rv-dy: 0em;
    --rv-blur: 10px;
    --rv-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --card-dy: 0px;
    --card-s: 1;
    --card-dur: 900ms;
    width: 100%;
    max-width: none;
    padding: 10vh 12% 3.4vh;
    border: none;
    border-radius: 0;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: linear-gradient(0deg, rgba(var(--ov-card-rgb), 0.97) 0%, rgba(var(--ov-card-rgb), 0.82) 38%, rgba(var(--ov-card-rgb), 0.45) 70%, rgba(var(--ov-card-rgb), 0) 100%);
  }
  #verse-card.tpl-cinema #verse-text { letter-spacing: 0.006em; line-height: 1.3; max-width: 30em; }
  #verse-card.tpl-cinema #verse-ref-row { margin-top: 16px; gap: 18px; }
  #verse-card.tpl-cinema #verse-ref-row::before,
  #verse-card.tpl-cinema #verse-ref-row::after { width: 64px; opacity: 0.55; }
  #verse-card.tpl-cinema #verse-reference {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: clamp(12px, 1.15vw, 21px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
  }
  /* The light leak: wider, warmer and slower than the shared sweep. */
  #verse:is(.vc-enter, .vc-swap-in) #verse-card.tpl-cinema:not(.no-card)::after {
    width: 55%;
    background: radial-gradient(50% 60% at 50% 70%, rgba(var(--accent-rgb), 0.26), rgba(var(--accent-rgb), 0.08) 55%, transparent 75%);
    animation: vc-sweep 1100ms var(--vc-ease-inout) 60ms both;
  }
  #verse.fullscreen[data-card="cinema"] { padding: var(--lb-h) 6vw; }
  #verse.fullscreen #verse-card.tpl-cinema { background: transparent; padding: 2vh 4vw; }
  #verse.fullscreen #verse-card.tpl-cinema #verse-reference { font-size: clamp(14px, 1.4vw, 28px); }

  /* ---------------------------------------------------------------
     New design 2: manuscript. An illuminated page: a framed leaf with a
     hairline inner rule, an accent drop cap, justified text and a
     diamond ornament above a small-capital reference. Its motion is ink
     settling: the initial blooms first, then the lines come into focus
     with no travel at all.
     --------------------------------------------------------------- */
  #verse-card.tpl-manuscript {
    --rv-dy: 0em;
    --rv-blur: 9px;
    --rv-ease: cubic-bezier(0.25, 0.6, 0.3, 1);
    --card-dy: 10px;
    --card-s: 0.99;
    --card-dur: 900ms;
    max-width: 1080px;
    padding: 38px 62px 28px;
    border-radius: 6px;
    border: 1px solid rgba(var(--accent-rgb), 0.55);
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(var(--accent-rgb), 0.1), transparent 62%),
      linear-gradient(180deg, rgba(var(--ov-card-rgb), calc(0.3 + var(--ov-card-a) * 0.7)), rgba(var(--ov-card-rgb), calc(0.36 + var(--ov-card-a) * 0.64)));
    box-shadow: 0 20px 56px rgba(0, 0, 0, 0.36);
  }
  #verse-card.tpl-manuscript::before {
    content: "";
    position: absolute;
    inset: 7px;
    z-index: -1;
    border: 1px solid rgba(var(--accent-rgb), 0.3);
    border-radius: 3px;
    pointer-events: none;
  }
  /* Set ragged-right: without hyphenation (each word is an atomic span),
     justified lines open wide rivers at fullscreen sizes. */
  #verse-card.tpl-manuscript #verse-text,
  #verse-card.tpl-manuscript #verse-secondary-text {
    align-self: stretch;
    max-width: none;
    text-align: left;
    text-wrap: pretty;
  }
  #verse-card.tpl-manuscript #verse-text { line-height: 1.36; }
  #verse-card.tpl-manuscript #verse-secondary-text { border-top-color: rgba(var(--accent-rgb), 0.3); }
  #verse-card.tpl-manuscript .vc-dropcap {
    display: block;
    float: left;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 3.15em;
    line-height: 0.78;
    margin: 0.08em 0.1em 0 -0.02em;
    color: var(--accent);
    text-shadow: 0 0 0.4em rgba(var(--accent-rgb), 0.25);
  }
  #verse-card.tpl-manuscript.vc-single .vc-dropcap { font-size: 1.9em; line-height: 0.9; margin: -0.12em 0.06em 0 0; }
  #verse-card.tpl-manuscript .vc-capsrc { display: none; }
  #verse-card.tpl-manuscript #verse-ornament {
    display: block;
    position: relative;
    width: min(260px, 42%);
    height: 12px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-rgb), 0.75) 34%, rgba(var(--accent-rgb), 0.75) 45%, transparent 45%, transparent 55%, rgba(var(--accent-rgb), 0.75) 55%, rgba(var(--accent-rgb), 0.75) 66%, transparent 100%) center / 100% 1px no-repeat;
  }
  #verse-card.tpl-manuscript #verse-ornament::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    transform: rotate(45deg);
    background: var(--accent);
  }
  #verse-card.tpl-manuscript #verse-ref-row { margin-top: 10px; }
  #verse-card.tpl-manuscript #verse-ref-row::before,
  #verse-card.tpl-manuscript #verse-ref-row::after { display: none; }
  #verse-card.tpl-manuscript #verse-reference {
    font-style: normal;
    font-size: clamp(13px, 1.3vw, 23px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  @keyframes vc-ink {
    from { opacity: 0; transform: scale(1.14); filter: blur(12px); }
  }
  @keyframes vc-ornament-in {
    from { opacity: 0; transform: scaleX(0.2); }
  }
  #verse.vc-enter .tpl-manuscript .vc-dropcap,
  #verse.vc-swap-in .tpl-manuscript .vc-dropcap { animation: vc-ink 1000ms cubic-bezier(0.25, 0.6, 0.3, 1) 40ms both; }
  #verse.vc-enter .tpl-manuscript #verse-ornament,
  #verse.vc-swap-in .tpl-manuscript #verse-ornament {
    animation: vc-ornament-in 760ms var(--vc-ease-out) calc(var(--vc-ref-delay, 0) * 1ms - 120ms) both;
  }
  #verse.fullscreen #verse-card.tpl-manuscript {
    width: auto;
    max-width: min(90%, 1560px);
    padding: clamp(32px, 6vh, 84px) clamp(36px, 6vw, 112px) clamp(24px, 4vh, 60px);
    border-radius: 8px;
    border: 1px solid rgba(var(--accent-rgb), 0.55);
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(var(--accent-rgb), 0.1), transparent 62%),
      linear-gradient(180deg, rgba(var(--ov-card-rgb), calc(0.3 + var(--ov-card-a) * 0.7)), rgba(var(--ov-card-rgb), calc(0.36 + var(--ov-card-a) * 0.64)));
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.4);
  }
  #verse.fullscreen #verse-card.tpl-manuscript::before { inset: 10px; }
  #verse.fullscreen #verse-card.tpl-manuscript #verse-reference { font-size: clamp(16px, 1.7vw, 34px); }
  #verse.fullscreen #verse-card.tpl-manuscript #verse-ornament { width: min(380px, 40%); margin-top: clamp(20px, 3.5vh, 44px); }

  /* ---------------------------------------------------------------
     New design 3: stained glass. A cathedral window: an arched card with a
     faint leaded lattice, lit from within by a slow, breathing glow of the
     palette's accent. The glow blooms before the words arrive.
     --------------------------------------------------------------- */
  #verse-card.tpl-stained {
    --rv-dy: 0.25em;
    --rv-blur: 8px;
    --card-dy: 24px;
    --card-s: 0.96;
    --card-dur: 900ms;
    max-width: 1060px;
    padding: 64px 64px 30px;
    border-radius: 50% 50% 16px 16px / 110px 110px 16px 16px;
    border: 1px solid rgba(var(--accent-rgb), 0.5);
    background:
      repeating-linear-gradient(60deg, rgba(var(--accent-rgb), 0.06) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(-60deg, rgba(var(--accent-rgb), 0.06) 0 1px, transparent 1px 64px),
      linear-gradient(180deg, rgba(var(--ov-card-rgb), calc(0.1 + var(--ov-card-a) * 0.8)), rgba(var(--ov-card-rgb), calc(0.2 + var(--ov-card-a) * 0.8)));
    box-shadow: 0 0 90px rgba(var(--accent-rgb), 0.2), 0 22px 60px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 0 4px rgba(var(--accent-rgb), 0.08);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    backdrop-filter: blur(16px) saturate(130%);
  }
  #verse-card.tpl-stained::before {
    content: "";
    position: absolute;
    inset: -10% -6%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(46% 62% at 50% 0%, rgba(var(--accent-rgb), 0.42), transparent 72%),
      radial-gradient(34% 55% at 12% 30%, rgba(var(--accent-rgb), 0.18), transparent 70%),
      radial-gradient(34% 55% at 88% 30%, rgba(var(--ov-text2-rgb), 0.08), transparent 70%),
      radial-gradient(60% 50% at 50% 110%, rgba(var(--ov-border-rgb), 0.35), transparent 70%);
    animation: vc-breathe 9s ease-in-out infinite alternate;
  }
  @keyframes vc-breathe {
    from { opacity: 0.75; transform: scale(1); }
    to { opacity: 1; transform: scale(1.06); }
  }
  @keyframes vc-bloom {
    from { opacity: 0; transform: scale(0.6); }
  }
  #verse.vc-enter #verse-card.tpl-stained::before { animation: vc-bloom 1200ms var(--vc-ease-out) both, vc-breathe 9s ease-in-out 1200ms infinite alternate; }
  #verse-card.tpl-stained #verse-text { line-height: 1.38; }
  #verse-card.tpl-stained #verse-ref-row::before,
  #verse-card.tpl-stained #verse-ref-row::after { width: 52px; opacity: 0.8; }
  #verse-card.tpl-stained #verse-ref-row::before { background: linear-gradient(90deg, transparent, var(--accent)); }
  #verse-card.tpl-stained #verse-ref-row::after { background: linear-gradient(90deg, var(--accent), transparent); }
  #verse.fullscreen #verse-card.tpl-stained {
    width: auto;
    max-width: min(88%, 1500px);
    padding: clamp(60px, 12vh, 150px) clamp(40px, 6vw, 110px) clamp(28px, 5vh, 70px);
    border-radius: 50% 50% 20px 20px / 160px 160px 20px 20px;
    border: 1px solid rgba(var(--accent-rgb), 0.5);
    background:
      repeating-linear-gradient(60deg, rgba(var(--accent-rgb), 0.05) 0 1px, transparent 1px 90px),
      repeating-linear-gradient(-60deg, rgba(var(--accent-rgb), 0.05) 0 1px, transparent 1px 90px),
      linear-gradient(180deg, rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.6)), rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.8)));
    box-shadow: 0 0 140px rgba(var(--accent-rgb), 0.18);
  }

  /* ---------------------------------------------------------------
     New design 4: poster. Editorial typography: big left-set serif lines
     under a giant accent quotation mark, the card fading off to the right.
     In fullscreen the backdrop drifts very slowly (a Ken Burns move of
     light, not of the text). Lines arrive one by one, no in-line ripple.
     --------------------------------------------------------------- */
  #verse[data-card="poster"]:not(.fullscreen) { align-items: flex-start; padding: 0 5%; }
  #verse-card.tpl-poster {
    --rv-dy: 0.55em;
    --rv-blur: 4px;
    --card-dx: -28px;
    --card-dy: 0px;
    --card-s: 1;
    --card-dur: 800ms;
    align-items: flex-start;
    max-width: 1560px;
    padding: 30px 150px 30px calc(var(--vc-font, 44px) * 2.1 + 40px);
    border: none;
    border-radius: 0;
    /* Solid where the words are, then the card dissolves into the picture. */
    background: linear-gradient(90deg, rgba(var(--ov-card-rgb), calc(0.25 + var(--ov-card-a) * 0.75)) 0%, rgba(var(--ov-card-rgb), calc(0.2 + var(--ov-card-a) * 0.75)) 82%, rgba(var(--ov-card-rgb), 0) 100%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
  }
  #verse-card.tpl-poster::before {
    content: "\201C";
    position: absolute;
    left: 22px;
    top: 0.02em;
    z-index: -1;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: calc(var(--vc-font, 44px) * 7.5);
    line-height: 0.74;
    color: var(--accent);
    opacity: 0.9;
    pointer-events: none;
  }
  @keyframes vc-quote-in {
    from { opacity: 0; transform: translate3d(0, 0.08em, 0) scale(1.3); filter: blur(10px); }
  }
  #verse.vc-enter #verse-card.tpl-poster::before,
  #verse.vc-swap-in #verse-card.tpl-poster::before { animation: vc-quote-in 900ms var(--vc-ease-out) both; }
  #verse-card.tpl-poster #verse-text,
  #verse-card.tpl-poster #verse-secondary-text { text-align: left; text-wrap: pretty; max-width: 26em; }
  #verse-card.tpl-poster #verse-text { line-height: 1.12; letter-spacing: -0.012em; }
  #verse-card.tpl-poster #verse-secondary-text { border-top: none; padding-top: 0; margin-top: 14px; max-width: 46em; }
  #verse-card.tpl-poster #verse-ref-row { margin-top: 20px; }
  #verse-card.tpl-poster #verse-ref-row::before { width: 44px; height: 3px; opacity: 1; }
  #verse-card.tpl-poster #verse-ref-row::after { display: none; }
  #verse-card.tpl-poster #verse-reference {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: clamp(13px, 1.3vw, 22px);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  #verse.fullscreen[data-card="poster"] { align-items: flex-start; padding: 6vh 7vw; }
  #verse.fullscreen #verse-card.tpl-poster { width: auto; max-width: 100%; background: transparent; padding-left: calc(var(--vc-font, 100px) * 1.6 + 2vw); padding-right: 2vw; }
  #verse.fullscreen #verse-card.tpl-poster::before { font-size: calc(var(--vc-font, 100px) * 4.6); }
  #verse.fullscreen #verse-card.tpl-poster #verse-reference { font-size: clamp(16px, 1.6vw, 30px); }
  #verse.fullscreen[data-card="poster"]::before {
    content: "";
    position: absolute;
    inset: -15%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(40% 38% at 22% 30%, rgba(var(--accent-rgb), 0.2), transparent 70%),
      radial-gradient(46% 42% at 82% 78%, rgba(var(--ov-border-rgb), 0.5), transparent 70%),
      radial-gradient(30% 30% at 70% 20%, rgba(var(--ov-text2-rgb), 0.06), transparent 70%);
    animation: vc-drift 28s ease-in-out infinite alternate;
  }
  @keyframes vc-drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to { transform: translate3d(3%, 2%, 0) scale(1.08); }
  }

  /* ---------------------------------------------------------------
     New design 5: split. Minimal and modern: the reference stands in its
     own column, right-aligned against a vertical accent rule, the verse
     set in clean sans to the right. The rule draws first, then the two
     columns open away from it.
     --------------------------------------------------------------- */
  #verse-card.tpl-split {
    --rv-dx: -0.45em;
    --rv-dy: 0em;
    --rv-blur: 6px;
    --card-dy: 10px;
    --card-dur: 700ms;
    display: grid;
    grid-template-columns: minmax(0, max-content) 2px minmax(0, 1fr);
    column-gap: 34px;
    align-items: center;
    max-width: 1340px;
    padding: 30px 52px 30px 44px;
    border: none;
    border-radius: 3px;
    background: rgba(var(--ov-card-rgb), calc(0.15 + var(--ov-card-a) * 0.85));
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.32);
  }
  #verse-card.tpl-split #verse-text {
    grid-column: 3;
    grid-row: 1;
    text-align: left;
    text-wrap: pretty;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: -0.008em;
    line-height: 1.3;
  }
  #verse-card.tpl-split #verse-secondary-text { grid-column: 3; grid-row: 2; text-align: left; text-wrap: pretty; border-top: none; padding-top: 0; margin-top: 10px; }
  #verse-card.tpl-split #verse-ornament {
    display: block;
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: stretch;
    width: 2px;
    background: var(--accent);
  }
  #verse-card.tpl-split #verse-ref-row { grid-column: 1; grid-row: 1 / span 2; margin: 0; justify-content: flex-end; }
  #verse-card.tpl-split #verse-ref-row::before,
  #verse-card.tpl-split #verse-ref-row::after { display: none; }
  #verse-card.tpl-split #verse-reference {
    white-space: normal;
    max-width: 7.5em;
    text-align: right;
    text-wrap: balance;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 600;
    font-size: clamp(16px, 1.9vw, 34px);
    line-height: 1.15;
    letter-spacing: 0.005em;
  }
  @keyframes vc-rule-down { from { transform: scaleY(0); } }
  @keyframes vc-ref-from-rule { from { opacity: 0; transform: translate3d(0.6em, 0, 0); filter: blur(5px); } }
  #verse.vc-enter .tpl-split #verse-ornament,
  #verse.vc-swap-in .tpl-split #verse-ornament { animation: vc-rule-down 620ms var(--vc-ease-out) 40ms both; }
  #verse.vc-enter .tpl-split #verse-ref-row,
  #verse.vc-swap-in .tpl-split #verse-ref-row { animation-name: vc-ref-from-rule; }
  #verse.fullscreen #verse-card.tpl-split {
    width: auto;
    max-width: 94%;
    column-gap: clamp(28px, 3vw, 64px);
    padding: clamp(28px, 5vh, 72px) clamp(32px, 4vw, 84px);
    border-radius: 3px;
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.55));
  }
  #verse.fullscreen #verse-card.tpl-split #verse-reference { font-size: clamp(22px, 3vw, 64px); }

  /* ---------------------------------------------------------------
     New design 6: bold. High energy without noise: heavy left-set sans,
     an accent bar that wipes across the top edge, and the reference as a
     solid accent slab. The card lands with a small overshoot; the words
     pop in quickly; the whole entrance is the shortest of the set.
     --------------------------------------------------------------- */
  #verse[data-card="bold"]:not(.fullscreen) { align-items: flex-start; padding: 0 6%; }
  #verse-card.tpl-bold {
    --rv-dy: 0.4em;
    --rv-blur: 0px;
    --rv-scale: 0.92;
    --rv-ease: cubic-bezier(0.34, 1.45, 0.64, 1);
    --card-dy: 30px;
    --card-s: 0.96;
    --card-dur: 560ms;
    --card-ease: cubic-bezier(0.34, 1.35, 0.64, 1);
    align-items: flex-start;
    max-width: 1280px;
    padding: 36px 52px 30px;
    border: none;
    border-radius: 0;
    background: rgba(var(--ov-card-rgb), calc(0.25 + var(--ov-card-a) * 0.75));
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
  }
  #verse-card.tpl-bold::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 8px;
    z-index: -1;
    background: var(--accent);
    transform-origin: 0% 50%;
  }
  @keyframes vc-wipe { from { transform: scaleX(0); } }
  @keyframes vc-slab-in { from { opacity: 0; transform: translate3d(-0.8em, 0, 0); } }
  #verse.vc-enter #verse-card.tpl-bold::before,
  #verse.vc-swap-in #verse-card.tpl-bold::before { animation: vc-wipe 520ms cubic-bezier(0.7, 0, 0.2, 1) 60ms both; }
  #verse-card.tpl-bold #verse-text,
  #verse-card.tpl-bold #verse-secondary-text { text-align: left; text-wrap: pretty; }
  #verse-card.tpl-bold #verse-text {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.14;
    max-width: 28em;
  }
  #verse-card.tpl-bold #verse-secondary-text { border-top: none; padding-top: 0; margin-top: 12px; }
  #verse-card.tpl-bold #verse-ref-row { margin-top: 20px; }
  #verse-card.tpl-bold #verse-ref-row::before,
  #verse-card.tpl-bold #verse-ref-row::after { display: none; }
  #verse-card.tpl-bold #verse-reference {
    background: var(--accent);
    color: rgb(var(--ov-card-rgb));
    text-shadow: none;
    padding: 0.28em 0.7em 0.24em;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 700;
    font-size: clamp(13px, 1.3vw, 22px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #verse.vc-enter .tpl-bold #verse-ref-row,
  #verse.vc-swap-in .tpl-bold #verse-ref-row { animation-name: vc-slab-in; animation-timing-function: cubic-bezier(0.34, 1.3, 0.64, 1); }
  #verse.fullscreen #verse-card.tpl-bold {
    width: auto;
    max-width: 92%;
    padding: clamp(36px, 6vh, 90px) clamp(36px, 5vw, 100px);
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.55));
  }
  #verse.fullscreen #verse-card.tpl-bold::before { height: 12px; }
  #verse.fullscreen #verse-card.tpl-bold #verse-reference { font-size: clamp(16px, 1.6vw, 30px); }

  /* No card (clear-text palettes) still wins over every design, including
     the new ones declared after the original .no-card rule ([class] only
     lifts specificity). Their own surface layers go too. */
  #verse-card.no-card[class],
  #verse.fullscreen #verse-card.no-card[class] {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  #verse-card.tpl-stained.no-card::before,
  #verse-card.tpl-manuscript.no-card::before { display: none; }
  #verse-card.tpl-bold.no-card #verse-reference { text-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    #announcement, #announcement.visible, #definition, #definition.visible,
    #outline-layer, #outline-layer.visible, #status {
      transition: none !important;
      transform: none !important;
    }
    /* Section 133: a simple short fade, nothing moves, nothing loops. */
    #verse, #verse.visible { transform: none !important; transition: opacity 200ms linear !important; }
    #verse:not(.visible) #verse-text, #verse:not(.visible) #verse-secondary-text { filter: none; transition: none; }
    #verse *, #verse::before, #verse *::before, #verse *::after,
    .lb-bar { animation: none !important; }
    .lb-bar { transition: none !important; }
    #verse.vc-fade #verse-text, #verse.vc-fade #verse-secondary-text,
    #verse.vc-fade #verse-ornament, #verse.vc-fade #verse-ref-row { animation: vc-fade-in 200ms linear both !important; }
    #verse.vc-fade-out #verse-text, #verse.vc-fade-out #verse-secondary-text,
    #verse.vc-fade-out #verse-ornament, #verse.vc-fade-out #verse-ref-row { animation: vc-fade-out 150ms linear forwards !important; }
  }

  /*
    Principal poster (ARCHITECTURE.md section 67) — a persistent backdrop,
    not a scene: z-index 0, strictly BELOW #media-layer, so a voice-
    triggered media cue or rundown scene still opaquely covers it exactly
    like it would cover plain black, and a verse card (which only covers
    its own bottom-anchored region) reveals the poster around its edges —
    the whole point of this feature. No pause/resume logic needed: unlike
    every other content type, this layer is never explicitly "resumed,"
    it was simply never hidden by anything that didn't already cover it.
  */
  #poster-layer {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    z-index: 0;
  }
  #poster-layer.visible { display: block; }
  #poster-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /*
    Media Library (ARCHITECTURE.md section 60) had no audience-facing
    display at all until this — the server/dashboard side was fully built
    and tested, but the actual OBS overlay only ever handled verse:show/
    verse:clear. An image/video cue is a full "scene" (a slide inserted
    between segments), so it fills the frame on an opaque black backdrop
    rather than the transparent-body treatment the verse card uses — z-index
    keeps it BEHIND the verse/announcement layers, so a live-detected verse
    interrupting a rundown's media scene (section 64.2) still overlays on
    top instead of the two fighting for the same layer. Audio has no visual
    at all — it plays without ever toggling this layer's visibility.
  */
  #media-layer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  #media-layer.visible { display: flex; }
  #media-image, #media-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Announcement (ARCHITECTURE.md section 64.1) — new content type, reuses
     the verse card's scrim-first legibility recipe with its own simpler
     title+body layout. Sits above the media layer, same as #verse. */
  #announcement {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 7%;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 12px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #announcement.visible { opacity: 1; transform: none; transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease); }
  #announcement-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 1000px;
    padding: 36px 52px;
    border-radius: 20px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #announcement-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }
  #announcement-title {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: clamp(20px, 2.6vw, 34px);
    font-weight: 700;
    text-align: center;
  }
  #announcement-body {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 2.4vw, 30px);
    line-height: 1.45;
    text-align: center;
  }

  /*
    Glossary definition (ARCHITECTURE.md section 65.5) — visually DISTINCT
    from the announcement card, deliberately: a definition is a momentary
    aside the operator never manages (it clears itself on a fixed server
    timer, section 65.5), not a scene. A compact lower-left corner card,
    not a full-screen center takeover, reflects that difference at a
    glance rather than looking like just another announcement.
  */
  #definition {
    position: fixed;
    left: 5%;
    bottom: 9%;
    z-index: 2;
    max-width: 440px;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 10px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #definition.visible { opacity: 1; transform: none; transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease); }
  #definition-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 22px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #definition-card {
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      backdrop-filter: blur(14px) saturate(115%);
    }
  }
  #definition-term {
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #definition-body {
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  /*
    Canvas scene (ARCHITECTURE.md section 66) — the first content type
    whose WS payload carries a whole list of positioned elements rather
    than one fixed template's fields. z-index 3, ABOVE the four legacy
    templates above (media:1, verse/announcement/definition:2), since only
    one scene is ever on screen at a time and a canvas scene replaces
    whatever was showing, not layers alongside it. #canvas-layer itself is
    the stage; each layer is a real DOM node absolutely positioned inside
    it by percentage (matching the 0-100 coordinate space every layer's
    x/y/width/height is authored in), never a <canvas>/WebGL surface, so
    each layer keeps its own font/CSS exactly like the rest of this page.
  */
  #canvas-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: none;
    overflow: hidden;
    background: #000;
  }
  #canvas-layer.visible { display: block; }
  .canvas-layer-item { position: absolute; }
  .canvas-layer-text {
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    line-height: 1.3;
    overflow: hidden;
  }
  .canvas-layer-image, .canvas-layer-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /*
    Sermon Outline Point Lower-Third Presentation Layer
  */
  #outline-layer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 8%;
    z-index: 2;
    display: flex;
    justify-content: center;
    padding: 0 6%;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 12px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #outline-layer.visible {
    opacity: 1;
    transform: none;
    transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease);
  }
  #outline-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 950px;
    padding: 22px 38px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.52));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #outline-card {
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      backdrop-filter: blur(16px) saturate(120%);
    }
  }
  #outline-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(var(--accent-rgb), 0.16);
    border: 1px solid rgba(var(--accent-rgb), 0.4);
    color: var(--accent);
    font-family: "Instrument Sans", -apple-system, sans-serif;
    font-size: clamp(11px, 1.2vw, 15px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #outline-title {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(24px, 3.2vw, 42px);
    font-weight: 400;
    line-height: 1.2;
    text-align: center;
  }
  #outline-text {
    color: rgba(255, 255, 255, 0.85);
    font-family: "Instrument Sans", -apple-system, sans-serif;
    font-size: clamp(14px, 1.6vw, 20px);
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>
  <div id="status" class="status-hidden" role="status">connecting…</div>
  <div id="brand-name" class="brand-item"></div>
  <img id="brand-logo" class="brand-item" alt="" />
  <div id="poster-layer">
    <img id="poster-image" alt="" />
  </div>
  <div id="media-layer">
    <img id="media-image" alt="" style="display: none" />
    <video id="media-video" style="display: none" playsinline></video>
  </div>
  <audio id="media-audio"></audio>
  <div id="verse" data-card="classic">
    <div id="verse-card">
      <div id="verse-text"></div>
      <div id="verse-secondary-text"></div>
      <div id="verse-ornament" aria-hidden="true"></div>
      <div id="verse-ref-row">
        <div id="verse-reference"></div>
      </div>
    </div>
  </div>
  <!-- Section 133: the cinema design's letterbox bars. Outside #verse on
       purpose (a transformed ancestor would capture position: fixed); shown
       only by the sibling selector #verse[data-card="cinema"] + #verse-letterbox. -->
  <div id="verse-letterbox" aria-hidden="true"><div class="lb-bar lb-top"></div><div class="lb-bar lb-bottom"></div></div>
  <div id="outline-layer">
    <div id="outline-card">
      <div id="outline-badge"></div>
      <div id="outline-title"></div>
      <div id="outline-text"></div>
    </div>
  </div>
  <div id="announcement">
    <div id="announcement-card">
      <div id="announcement-title"></div>
      <div id="announcement-body"></div>
    </div>
  </div>
  <div id="definition">
    <div id="definition-card">
      <div id="definition-term"></div>
      <div id="definition-body"></div>
    </div>
  </div>
  <div id="canvas-layer"></div>
  <script src="verse-motion.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
