<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--
  Electron Security Warning fix (docs/tutorial/security.md) — same reasoning
  as apps/desktop/renderer/index.html's own CSP comment: default-src 'none'
  plus explicit allowances. img-src/media-src 'self' cover the voice-
  triggered media layer's images/video/audio, all served same-origin from
  "/media/<id>" by this page's own StaticServer (never a remote URL).
  connect-src allows the bare "ws:" scheme rather than a pinned
  ws://127.0.0.1:* host, matching apps/remote/public/index.html's own CSP
  and for the identical reason (ARCHITECTURE.md section 65.6): once
  allowPhoneRemote is on, the WS server binds to 0.0.0.0, and this page can
  be opened from whatever LAN address reaches it — not only 127.0.0.1 — so
  the exact host isn't knowable in advance. As section 65.6 already
  documents, the viewer token remains the real access control here, not
  this policy.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self' ws:; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Overlay</title>
<link href="fonts/fonts.css" rel="stylesheet" />
<style>
  /*
    Verse Ops Console visual system (Phase 0 — ARCHITECTURE.md section 59),
    applied here with the SAME typography as the operator dashboard
    (Instrument Serif/Sans, JetBrains Mono) but a deliberately different
    visual language, unchanged from the prior redesign's reasoning: this is
    composited over live, unpredictable video in OBS Browser Source, not
    rendered on its own background, so legibility over anything drives every
    choice here — no mesh gradient, no app-chrome accent color. The scrim
    (a plain dark gradient) is the PRIMARY legibility mechanism and works
    regardless of browser support; backdrop-filter blur is layered on top
    as a progressive frosted-glass enhancement, not a replacement for it.
  */
  :root {
    /*
      ARCHITECTURE.md section 110: every colour/brand value below is a CSS
      custom property that overlay.js sets from the server's overlay:style
      event (only ever validated #rrggbb or clamped numbers, never markup).
      The defaults here are the gilt-night palette = the look from before
      the style system existed, so a page that never receives a style
      renders as it always did.
    */
    --accent: #e6c27a;
    --accent-rgb: 230, 194, 122;
    --ov-card-rgb: 6, 7, 10;
    --ov-card-a: 0.6;
    --scrim: rgba(var(--ov-card-rgb), var(--ov-card-a));
    --ov-text: #ffffff;
    --ov-text2: #f2f4f7;
    --ov-border: rgba(255, 255, 255, 0.08);
    --ov-backdrop: #0c1320;
    --ov-backdrop-2: #070b12;
    --ov-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    /* Vespers 2 motion (MASTER.md): enter 320ms, exit faster (200ms),
       transform/opacity only. */
    --ov-ease: cubic-bezier(0.2, 0, 0, 1);
    --ov-ease-out: cubic-bezier(0.4, 0, 1, 1);
    --ov-enter: 320ms;
    --ov-exit: 200ms;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    /* Broadcast type: real kerning + ligatures, optical sizes where the
       face has them, grayscale AA (CEF composites onto video). */
    font-kerning: normal;
    font-optical-sizing: auto;
    font-feature-settings: "kern" 1, "liga" 1;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  /*
    Connection chrome: a diagnostic, never content. It starts hidden (no
    flash on load), stays hidden while connected, and appears only when
    something has been wrong for longer than a short grace period (see
    overlay.js setStatus). Small, low-contrast, top-left, out of the
    title-safe verse area.
  */
  #status {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #c7ccd6;
    background: rgba(11, 14, 19, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 4px 10px;
    border-radius: 999px;
    pointer-events: none;
  }
  #status::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f08a3c;
  }

  /*
    ARCHITECTURE.md section 110.2: the church name and logo are free-placed
    brand items. x/y are the item CENTRE in percent of the frame; the text
    size is "px at 1080p" turned into vh so it scales with the frame (OBS
    source size, NDI 1920x1080 and the dashboard preview all agree).
    Hidden until overlay:style says otherwise: no product name is ever shown.
  */
  .brand-item {
    position: fixed;
    z-index: 3;
    display: none;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-origin: center;
    pointer-events: none;
    user-select: none;
  }
  .brand-item.visible { display: block; }
  #brand-name {
    white-space: nowrap;
    font-size: calc(var(--brand-size, 28) * 0.0925926vh);
    letter-spacing: 0.02em;
    color: var(--brand-color, var(--ov-text));
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }
  #brand-name.plate {
    background: rgba(var(--ov-card-rgb), 0.55);
    padding: 0.4em 1em;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  #brand-logo {
    height: 12vh;
    width: auto;
    max-width: 40vw;
    object-fit: contain;
  }
  #status { transition: opacity var(--ov-exit) var(--ov-ease); }
  #status.status-hidden { opacity: 0; visibility: hidden; transition: opacity var(--ov-exit) var(--ov-ease), visibility 0s linear var(--ov-exit); }

  /*
    Lower-third base: bottom-anchored inside a ~7% title-safe margin.
    Exit (200ms, accelerate) is faster than enter (320ms, decelerate);
    only opacity/transform animate, so nothing reflows on air.
  */
  #verse {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 9%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 7%;
    overflow: hidden;
    opacity: 0;
    transform: translate3d(0, 12px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #verse.visible {
    opacity: 1;
    transform: none;
    transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease);
  }

  #verse-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 1150px;
    padding: 28px 52px 26px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--scrim), rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.8)));
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    border: 1px solid var(--ov-border);
    box-sizing: border-box;
    max-height: 100%;
    overflow: hidden;
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    /* Progressive enhancement only — see the comment above #status.
       The scrim gradient above already guarantees legibility without this. */
    #verse-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }

  #verse-text {
    color: var(--ov-text);
    text-shadow: var(--ov-shadow);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 3.2vw, 44px);
    line-height: 1.34;
    letter-spacing: 0.003em;
    text-align: center;
    font-weight: 400;
    /* ~60-character measure for a lower-third; em-based so it tracks the
       size fitVerseText() picks. Balanced wrapping avoids a lone last
       word ("pretty" fallback for engines without balance). */
    max-width: 32em;
    text-wrap: pretty;
    text-wrap: balance;
    hanging-punctuation: first last;
    font-variant-numeric: lining-nums;
    overflow-wrap: break-word;
  }

  /*
    ARCHITECTURE.md section 82: fullscreen layout — the confirmed default.
    Unlike lower-third (above), this deliberately gives #verse-card an
    OPAQUE full-bleed background rather than the translucent scrim: the
    user's explicit requirement is that a poster/media backdrop underneath
    is fully covered while a verse is showing, not just dimmed around a
    small card. #verse itself switches from bottom-anchored to filling and
    centering in the whole viewport; text sizes step up so a full screen
    of otherwise-empty space still reads as intentional, not a lower-third
    card stretched thin.
  */
  #verse.fullscreen {
    inset: 0;
    bottom: 0;
    justify-content: center;
    padding: 4vh 6vw;
    overflow: hidden;
  }
  #verse.fullscreen #verse-card {
    max-width: none;
    width: 100%;
    height: auto;
    max-height: 100%;
    min-height: 0;
    padding: clamp(24px, 5vh, 72px) clamp(24px, 5vw, 96px);
    justify-content: center;
    border-radius: 0;
    border: none;
    /* Not a flat black: a soft fall of light from above, like a lit
       window over the nave, fading into deep ink. Opaque, so a poster or
       video underneath stays fully covered (section 82). */
    background: transparent;
    box-shadow: none;
  }
  /* The full-bleed backdrop lives on the fixed #verse container, not the
     card: overlay.js's fitVerseText() measures the CARD against a fraction
     of the viewport, so the card must stay content-sized. Painting the
     container instead truly covers the whole frame (section 82's
     requirement — the old padded card left the poster/video visible
     around its edges). A soft fall of light from above, like a lit window
     over the nave, fading into deep ink. */
  #verse.fullscreen {
    background:
      radial-gradient(120% 70% at 50% -12%, rgba(var(--accent-rgb), 0.11), transparent 62%),
      radial-gradient(90% 60% at 50% 125%, rgba(46, 78, 128, 0.28), transparent 70%),
      linear-gradient(180deg, var(--ov-backdrop), var(--ov-backdrop-2));
  }
  #verse.fullscreen #verse-text { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); line-height: 1.28; max-width: 26em; }
  /* The full-bleed backdrop never slides: it only fades, so the frame edge
     never shows video through a moving gap. The words inside still settle
     (see .reveal below). */
  #verse.fullscreen,
  #verse.fullscreen.visible { transform: none; }
  /*
    #verse-text/#verse-secondary-text font-size is NOT set here —
    overlay.js's fitVerseText() always sets it as an inline style (an
    auto-shrink-to-fit algorithm, not a fixed size), which would silently
    override any font-size declared in this stylesheet regardless of
    specificity. fitVerseText() itself branches on this fullscreen class
    to use a much larger cap and a bigger available area — see its own
    comment in overlay.js.
  */

  /*
    Bilingual mode (ARCHITECTURE.md section 63.4): present only when a
    verse:show payload carries `secondary` — French (primary, above, in
    #verse-text) stays in the existing styling; English (secondary) is
    visually subordinate: smaller, italic, slightly less opaque. Hidden
    entirely (not just empty) for single-language mode, so it takes no
    layout space at all.
  */
  #verse-secondary-text {
    display: none;
    color: var(--ov-text2);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(14px, 1.8vw, 24px);
    line-height: 1.45;
    text-align: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.14);
    max-width: 40em;
    text-wrap: pretty;
    text-wrap: balance;
  }
  #verse-secondary-text.visible { display: block; }

  #verse-ref-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 18px;
  }
  #verse-ref-row::before,
  #verse-ref-row::after {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--accent);
    opacity: 0.6;
  }
  #verse-reference {
    color: var(--accent);
    text-shadow: var(--ov-shadow);
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: clamp(18px, 2.1vw, 34px);
    font-weight: 400;
    letter-spacing: 0.02em;
    font-variant-numeric: lining-nums;
    white-space: nowrap;
  }
  #verse.fullscreen #verse-ref-row { margin-top: clamp(18px, 3vh, 40px); }
  #verse.fullscreen #verse-reference { font-size: clamp(22px, 2.5vw, 48px); }
  #verse.fullscreen #verse-ref-row::before,
  #verse.fullscreen #verse-ref-row::after { width: clamp(28px, 4vw, 72px); }

  /*
    ARCHITECTURE.md section 108: preset visual templates for how the verse
    card itself looks, independent of verseLayout (fullscreen/lower-third
    is WHERE it sits on screen; these are what it looks like there). Class
    applied to #verse-card by overlay.js's applyBranding(), from the same
    branding:update payload organizationName/accentColor already arrive on
    (ARCHITECTURE.md section 94's precedent: static for the process
    lifetime, synced on connect). "classic" is the default look above —
    no extra class, zero risk of regressing every existing install's
    appearance. font-size is deliberately untouched by every rule below:
    overlay.js's fitVerseText() always sets it as an inline style (see the
    comment above #verse-secondary-text), which would silently override
    anything declared here regardless of specificity.

    Each template also gets a fullscreen-scoped override
    (#verse.fullscreen #verse-card.tpl-*), matching fullscreen's own higher
    specificity (#verse.fullscreen #verse-card) — without it, fullscreen's
    existing "no card chrome" rule would silently erase every template's
    own distinguishing chrome, making all four look identical in fullscreen
    mode (the app's own confirmed default layout, ARCHITECTURE.md section
    82) — the one case this feature would most need to actually work in.
  */
  #verse-card.tpl-banner {
    background: rgba(var(--ov-card-rgb), calc(0.4 + var(--ov-card-a) * 0.5));
    border-radius: 6px;
    border: none;
    border-top: 6px solid var(--accent);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  #verse-card.tpl-banner #verse-text,
  #verse-card.tpl-banner #verse-reference {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-style: normal;
    font-weight: 600;
  }
  /* Sans at display sizes wants tighter tracking and leading than the serif. */
  #verse-card.tpl-banner #verse-text { letter-spacing: -0.005em; line-height: 1.3; }
  #verse-card.tpl-banner #verse-reference {
    font-size: clamp(14px, 1.5vw, 24px);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #verse-card.tpl-banner #verse-ref-row::before,
  #verse-card.tpl-banner #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-banner {
    border-top: 10px solid var(--accent);
    background: linear-gradient(180deg, rgba(var(--ov-card-rgb), 0.35), rgba(var(--ov-card-rgb), 0.7));
  }

  #verse-card.tpl-minimal {
    background: transparent;
    border: none;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    padding: 12px 24px;
  }
  #verse-card.tpl-minimal #verse-text {
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.3;
    /* No card: a tight edge shadow for crispness plus a wide soft halo for
       legibility over bright video. */
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 3px 18px rgba(0, 0, 0, 0.75);
  }
  #verse-card.tpl-minimal #verse-reference {
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85), 0 2px 12px rgba(0, 0, 0, 0.7);
  }
  #verse-card.tpl-minimal #verse-ref-row::before,
  #verse-card.tpl-minimal #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-minimal { background: transparent; }

  #verse-card.tpl-elegant {
    border: 1px solid var(--accent);
    border-radius: 28px;
    box-shadow: 0 0 60px rgba(var(--accent-rgb), 0.12), 0 12px 48px rgba(0, 0, 0, 0.35);
    padding: 36px 56px;
  }
  #verse-card.tpl-elegant #verse-reference {
    letter-spacing: 0.06em;
  }
  #verse-card.tpl-elegant #verse-text { line-height: 1.4; }
  #verse-card.tpl-elegant #verse-ref-row::before,
  #verse-card.tpl-elegant #verse-ref-row::after { width: 44px; opacity: 0.8; }
  #verse.fullscreen #verse-card.tpl-elegant {
    border: 1px solid var(--accent);
    box-shadow: 0 0 90px rgba(var(--accent-rgb), 0.1);
  }

  /*
    ARCHITECTURE.md section 110: two new card designs.
    glass: a frosted pane, strong blur, hairline light border.
    ribbon: an accent bar down the left edge, text set left-aligned.
    Each has a fullscreen override for the same reason the four above do
    (fullscreen's "no card chrome" rule would otherwise erase them).
  */
  #verse-card.tpl-glass {
    background: linear-gradient(135deg, rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.8)), rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.55)));
    border: 1px solid var(--ov-border);
    border-radius: 32px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    backdrop-filter: blur(28px) saturate(140%);
  }
  #verse-card.tpl-glass #verse-ref-row::before,
  #verse-card.tpl-glass #verse-ref-row::after { display: none; }
  #verse.fullscreen #verse-card.tpl-glass {
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.35));
    border-radius: 40px;
    width: auto;
    max-width: 92%;
    padding: clamp(24px, 5vh, 64px) clamp(28px, 5vw, 88px);
    border: 1px solid var(--ov-border);
  }

  #verse-card.tpl-ribbon {
    align-items: flex-start;
    border-radius: 4px 22px 22px 4px;
    border: none;
    border-left: 12px solid var(--accent);
    padding: 28px 48px 28px 40px;
  }
  #verse-card.tpl-ribbon #verse-text,
  #verse-card.tpl-ribbon #verse-secondary-text { text-align: left; }
  /* Balanced lines read as a ragged block when set left; keep the full
     measure and only avoid orphans. */
  #verse-card.tpl-ribbon #verse-text,
  #verse-card.tpl-ribbon #verse-secondary-text { text-wrap: pretty; }
  #verse-card.tpl-ribbon #verse-ref-row::before { display: none; }
  #verse-card.tpl-ribbon #verse-ref-row::after { width: 56px; }
  #verse.fullscreen #verse-card.tpl-ribbon {
    width: auto;
    max-width: 92%;
    align-self: center;
    border-left: 16px solid var(--accent);
    border-radius: 6px 36px 36px 6px;
    background: rgba(var(--ov-card-rgb), calc(var(--ov-card-a) * 0.5));
  }

  /*
    Clear-text palettes (card opacity 0): no card at all, so legibility rests
    on the text shadow alone. Set by overlay.js; wins over every design.
  */
  #verse-card.no-card,
  #verse.fullscreen #verse-card.no-card {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  #verse-card.no-card #verse-text,
  #verse-card.no-card #verse-reference,
  #verse-card.no-card #verse-secondary-text {
    text-shadow: 0 2px 3px rgba(0, 0, 0, 0.9), 0 0 18px rgba(0, 0, 0, 0.75);
  }

  /*
    One orchestrated reveal per verse (re-triggered by overlay.js on every
    new verse, even when one is already showing): the words come into
    focus, then the reference settles in just after — the eye reads the
    scripture first, its address second.
  */
  /* opacity + transform only (no blur filter: cheaper in OBS's CEF and it
     never smears glyph edges mid-frame). Whole sequence ends by ~320ms. */
  @keyframes verse-focus-in {
    from { opacity: 0; transform: translate3d(0, 8px, 0); }
    to { opacity: 1; transform: none; }
  }
  #verse-card.reveal #verse-text,
  #verse-card.reveal #verse-secondary-text { animation: verse-focus-in 280ms var(--ov-ease) both; }
  #verse-card.reveal #verse-secondary-text { animation-delay: 40ms; }
  #verse-card.reveal #verse-ref-row { animation: verse-focus-in 240ms var(--ov-ease) 80ms both; }
  @media (prefers-reduced-motion: reduce) {
    #verse, #verse.visible, #announcement, #announcement.visible, #definition, #definition.visible,
    #outline-layer, #outline-layer.visible, #status {
      transition: none !important;
      transform: none !important;
    }
    #verse-card.reveal #verse-text,
    #verse-card.reveal #verse-secondary-text,
    #verse-card.reveal #verse-ref-row { animation: none; }
  }

  /*
    Principal poster (ARCHITECTURE.md section 67) — a persistent backdrop,
    not a scene: z-index 0, strictly BELOW #media-layer, so a voice-
    triggered media cue or rundown scene still opaquely covers it exactly
    like it would cover plain black, and a verse card (which only covers
    its own bottom-anchored region) reveals the poster around its edges —
    the whole point of this feature. No pause/resume logic needed: unlike
    every other content type, this layer is never explicitly "resumed,"
    it was simply never hidden by anything that didn't already cover it.
  */
  #poster-layer {
    position: fixed;
    inset: 0;
    display: none;
    background: #000;
    z-index: 0;
  }
  #poster-layer.visible { display: block; }
  #poster-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /*
    Media Library (ARCHITECTURE.md section 60) had no audience-facing
    display at all until this — the server/dashboard side was fully built
    and tested, but the actual OBS overlay only ever handled verse:show/
    verse:clear. An image/video cue is a full "scene" (a slide inserted
    between segments), so it fills the frame on an opaque black backdrop
    rather than the transparent-body treatment the verse card uses — z-index
    keeps it BEHIND the verse/announcement layers, so a live-detected verse
    interrupting a rundown's media scene (section 64.2) still overlays on
    top instead of the two fighting for the same layer. Audio has no visual
    at all — it plays without ever toggling this layer's visibility.
  */
  #media-layer {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  #media-layer.visible { display: flex; }
  #media-image, #media-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Announcement (ARCHITECTURE.md section 64.1) — new content type, reuses
     the verse card's scrim-first legibility recipe with its own simpler
     title+body layout. Sits above the media layer, same as #verse. */
  #announcement {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 7%;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 12px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #announcement.visible { opacity: 1; transform: none; transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease); }
  #announcement-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    max-width: 1000px;
    padding: 36px 52px;
    border-radius: 20px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #announcement-card {
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      backdrop-filter: blur(18px) saturate(115%);
    }
  }
  #announcement-title {
    color: var(--accent);
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: clamp(20px, 2.6vw, 34px);
    font-weight: 700;
    text-align: center;
  }
  #announcement-body {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 2.4vw, 30px);
    line-height: 1.45;
    text-align: center;
  }

  /*
    Glossary definition (ARCHITECTURE.md section 65.5) — visually DISTINCT
    from the announcement card, deliberately: a definition is a momentary
    aside the operator never manages (it clears itself on a fixed server
    timer, section 65.5), not a scene. A compact lower-left corner card,
    not a full-screen center takeover, reflects that difference at a
    glance rather than looking like just another announcement.
  */
  #definition {
    position: fixed;
    left: 5%;
    bottom: 9%;
    z-index: 2;
    max-width: 440px;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 10px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #definition.visible { opacity: 1; transform: none; transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease); }
  #definition-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 16px 22px;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.46));
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #definition-card {
      -webkit-backdrop-filter: blur(14px) saturate(115%);
      backdrop-filter: blur(14px) saturate(115%);
    }
  }
  #definition-term {
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #definition-body {
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    font-family: "Instrument Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  /*
    Canvas scene (ARCHITECTURE.md section 66) — the first content type
    whose WS payload carries a whole list of positioned elements rather
    than one fixed template's fields. z-index 3, ABOVE the four legacy
    templates above (media:1, verse/announcement/definition:2), since only
    one scene is ever on screen at a time and a canvas scene replaces
    whatever was showing, not layers alongside it. #canvas-layer itself is
    the stage; each layer is a real DOM node absolutely positioned inside
    it by percentage (matching the 0-100 coordinate space every layer's
    x/y/width/height is authored in), never a <canvas>/WebGL surface, so
    each layer keeps its own font/CSS exactly like the rest of this page.
  */
  #canvas-layer {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: none;
    overflow: hidden;
    background: #000;
  }
  #canvas-layer.visible { display: block; }
  .canvas-layer-item { position: absolute; }
  .canvas-layer-text {
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    line-height: 1.3;
    overflow: hidden;
  }
  .canvas-layer-image, .canvas-layer-media {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /*
    Sermon Outline Point Lower-Third Presentation Layer
  */
  #outline-layer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 8%;
    z-index: 2;
    display: flex;
    justify-content: center;
    padding: 0 6%;
    opacity: 0;
    pointer-events: none;
    transform: translate3d(0, 12px, 0);
    transition: opacity var(--ov-exit) var(--ov-ease-out), transform var(--ov-exit) var(--ov-ease-out);
  }
  #outline-layer.visible {
    opacity: 1;
    transform: none;
    transition: opacity var(--ov-enter) var(--ov-ease), transform var(--ov-enter) var(--ov-ease);
  }
  #outline-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 950px;
    padding: 22px 38px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--scrim), rgba(6, 7, 10, 0.52));
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
  }
  @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
    #outline-card {
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      backdrop-filter: blur(16px) saturate(120%);
    }
  }
  #outline-badge {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    background: rgba(var(--accent-rgb), 0.16);
    border: 1px solid rgba(var(--accent-rgb), 0.4);
    color: var(--accent);
    font-family: "Instrument Sans", -apple-system, sans-serif;
    font-size: clamp(11px, 1.2vw, 15px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  #outline-title {
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
    font-family: "Instrument Serif", Georgia, serif;
    font-size: clamp(24px, 3.2vw, 42px);
    font-weight: 400;
    line-height: 1.2;
    text-align: center;
  }
  #outline-text {
    color: rgba(255, 255, 255, 0.85);
    font-family: "Instrument Sans", -apple-system, sans-serif;
    font-size: clamp(14px, 1.6vw, 20px);
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
