<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--
    Conservative CSP: only this page's own script, stylesheet, fonts and
    favicon; the WebSocket goes back to the serving host (ws:/wss:, any
    port, since wsPort comes from the link). Saved notes are built with
    createElement/textContent (live.js), never innerHTML, and no inline
    script/style attributes are used, so 'unsafe-inline' is not needed.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'; object-src 'none'"
  />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="color-scheme" content="dark" />
  <title>Live Congregation Companion — ChurchOverlay</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="live.css" />
</head>
<body>
  <div class="live-app">
    <!-- Header with connection state and the translation currently on screen -->
    <header class="live-header">
      <div class="church-brand">
        <span class="live-pulse" aria-hidden="true"></span>
        <span class="brand-title" data-t="title">Live</span>
        <span id="live-status" class="live-status" role="status" data-t="connecting">Connecting…</span>
      </div>
      <div class="translation-control" role="group" data-t-label="translationInfo">
        <span data-t="bible">Bible</span>
        <span id="translation-label" class="translation-value" data-t="translationUnknown">Version not announced</span>
      </div>
    </header>

    <!-- Main live verse -->
    <main class="live-content">
      <section id="live-verse-card" class="verse-hero empty" aria-live="polite" aria-labelledby="live-reference">
        <div class="verse-header">
          <span class="badge-live" data-t="nowReading">Now reading</span>
          <h1 id="live-reference" class="verse-ref" data-t="welcome">Welcome to Service</h1>
        </div>
        <div class="verse-body">
          <p id="live-text" class="verse-words" data-t="waiting">Verses spoken during the sermon will appear here in real-time.</p>
        </div>
        <div class="verse-actions">
          <button type="button" id="btn-save-verse" class="btn-action" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" /></svg>
            <span data-t="save">Save to My Notes</span>
          </button>
          <button type="button" id="btn-copy-verse" class="btn-action secondary" disabled>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" /></svg>
            <span data-t="copy">Copy</span>
          </button>
        </div>
      </section>

      <!-- Saved verses / personal notebook -->
      <section class="notes-section" aria-labelledby="notes-heading">
        <div class="section-title-row">
          <h2 id="notes-heading"><span data-t="savedVerses">My Saved Verses</span> <span class="count-pill" id="saved-count">0</span></h2>
          <button type="button" id="btn-export-notes" class="btn-text">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
            <span data-t="export">Export All</span>
          </button>
        </div>
        <div id="saved-verses-list" class="saved-list empty">
          <p class="empty-hint" data-t="emptyNotes">Tap "Save to My Notes" on any verse above to bookmark it for later study.</p>
        </div>
      </section>
    </main>

    <!-- Toast notification -->
    <div id="live-toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>

  <script src="live.js"></script>
</body>
</html>
