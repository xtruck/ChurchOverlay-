<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>ChurchOverlay — Tableau de bord</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1c1f28;
    --panel-2: #171a22;
    --border: #2c3040;
    --text: #e8e9ee;
    --muted: #9195a6;
    --accent: #6c8cff;
    --accent-hover: #8aa4ff;
    --error: #ff6b6b;
    --ok: #4fd18b;
    --warn: #f0b94c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 13px;
    -webkit-user-select: none;
    user-select: none;
  }
  .wrap { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

  .status-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .dot.running { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.error { background: var(--error); box-shadow: 0 0 6px var(--error); }
  .dot.starting { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .dot.stopped { background: var(--muted); }
  .status-text { font-weight: 600; }
  .status-sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .status-card .spacer { flex: 1; }

  .field-label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }
  .url-row {
    display: flex;
    gap: 8px;
  }
  .url-box {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "Consolas", monospace;
    font-size: 11.5px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    -webkit-user-select: text;
    user-select: text;
  }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 12px;
    white-space: nowrap;
  }
  .btn-secondary {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-accent {
    background: var(--accent);
    color: #0c0e14;
  }
  .btn-accent:hover { background: var(--accent-hover); }

  .actions-row { display: flex; gap: 8px; }
  .actions-row button { flex: 1; }

  .logs-section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .logs-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: "Consolas", monospace;
    font-size: 11px;
    line-height: 1.55;
    height: 150px;
    overflow-y: auto;
    -webkit-user-select: text;
    user-select: text;
  }
  .logs-box .line { white-space: pre-wrap; word-break: break-word; }
  .logs-box .line.err { color: var(--error); }
  .logs-box .empty { color: var(--muted); }

  .toast {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="wrap">

    <div class="status-card">
      <div class="dot" id="status-dot"></div>
      <div>
        <div class="status-text" id="status-text">Chargement…</div>
        <div class="status-sub" id="status-sub">&nbsp;</div>
      </div>
      <div class="spacer"></div>
      <button class="btn-secondary" id="btn-restart" type="button">Redémarrer</button>
    </div>

    <div>
      <label class="field-label">URL de l'overlay (à coller dans OBS, source Navigateur)</label>
      <div class="url-row">
        <div class="url-box" id="overlay-url">—</div>
        <button class="btn-accent" id="btn-copy" type="button">Copier</button>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-secondary" id="btn-change-mic" type="button">Changer de microphone / clé</button>
    </div>

    <div class="logs-section">
      <label class="field-label">Journal</label>
      <div class="logs-box" id="logs-box">
        <div class="empty">En attente d'activité…</div>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusSub = document.getElementById('status-sub');
    const overlayUrlBox = document.getElementById('overlay-url');
    const logsBox = document.getElementById('logs-box');
    const btnRestart = document.getElementById('btn-restart');
    const btnCopy = document.getElementById('btn-copy');
    const btnChangeMic = document.getElementById('btn-change-mic');
    const toast = document.getElementById('toast');

    let currentOverlayUrl = '';

    const STATUS_LABELS = {
      starting: { text: 'Démarrage en cours…', sub: 'Le pipeline audio se lance, un instant.' },
      running: { text: 'En marche', sub: 'Le micro est écouté et l\'overlay est prêt à recevoir OBS.' },
      error: { text: 'Erreur', sub: 'Consultez le journal ci-dessous, ou redémarrez le pipeline.' },
      stopped: { text: 'Arrêté', sub: 'Cliquez sur Redémarrer pour relancer le pipeline.' },
    };

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function renderLogs(logs) {
      if (!logs || logs.length === 0) {
        logsBox.innerHTML = '<div class="empty">En attente d\'activité…</div>';
        return;
      }
      const wasAtBottom = logsBox.scrollTop + logsBox.clientHeight >= logsBox.scrollHeight - 4;
      logsBox.innerHTML = logs.map((l) => {
        const cls = l.isError ? 'line err' : 'line';
        const safe = (l.text || '').replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
        return '<div class="' + cls + '">' + safe.trimEnd() + '</div>';
      }).join('');
      if (wasAtBottom) logsBox.scrollTop = logsBox.scrollHeight;
    }

    function render(payload) {
      const info = STATUS_LABELS[payload.status] || { text: payload.status, sub: '' };
      statusDot.className = 'dot ' + payload.status;
      statusText.textContent = info.text;
      statusSub.textContent = info.sub;

      if (payload.overlayUrl) {
        currentOverlayUrl = payload.overlayUrl;
        overlayUrlBox.textContent = payload.overlayUrl;
      }

      renderLogs(payload.logs);

      btnRestart.disabled = payload.status === 'starting';
    }

    btnRestart.addEventListener('click', async () => {
      btnRestart.disabled = true;
      btnRestart.textContent = 'Redémarrage…';
      try {
        await window.churchOverlay.requestRestart();
      } finally {
        setTimeout(() => {
          btnRestart.disabled = false;
          btnRestart.textContent = 'Redémarrer';
        }, 1200);
      }
    });

    btnCopy.addEventListener('click', () => {
      if (!currentOverlayUrl) return;
      navigator.clipboard.writeText(currentOverlayUrl).then(() => {
        showToast('URL copiée dans le presse-papiers');
      }).catch(() => {
        showToast('Impossible de copier automatiquement');
      });
    });

    btnChangeMic.addEventListener('click', async () => {
      await window.churchOverlay.openSetup();
    });

    // Chargement initial + abonnement aux mises à jour poussées par main.js
    window.churchOverlay.getStatus().then(render);
    window.churchOverlay.onStatusUpdate(render);
  </script>
</body>
</html>
