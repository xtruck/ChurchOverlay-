name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

permissions:
  contents: read
  security-events: read

jobs:
  # Security and Dependency Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --production
        continue-on-error: false

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Linting and Code Quality
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: Check code formatting
        run: npm run format:check
        continue-on-error: false

      - name: TypeScript type checking
        run: npx tsc --noEmit
        continue-on-error: false

  # Testing
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # CORRECTIF (segfault CI 2026-08-05) : le job "Run Tests" plantait en
      # "Segmentation fault (core dumped)" sur ubuntu-latest/Node 20.x, au
      # moment précis où server.js (via session-store.js) charge le binaire
      # natif de better-sqlite3. Ce module n'a pas de binaire prébuilt
      # (pas de champ "binary" dans son package.json — il compile via
      # node-gyp) : un binaire natif compilé pour une ABI Node différente
      # (ex. un artefact de cache réutilisé entre jobs de la matrice) plante
      # au chargement plutôt que de lever une erreur JS propre. On force ici
      # une recompilation depuis les sources pour l'ABI Node exacte de CE
      # job, quel que soit ce que `npm ci` a pu récupérer par ailleurs.
      - name: Rebuild native modules (better-sqlite3)
        run: npm rebuild better-sqlite3 --build-from-source

      - name: List test directory
        shell: bash
        run: |
          echo "CWD: $(pwd)"
          ls -la .
          ls -la test || true

      - name: Run tests
        run: npm test
        env:
          CI: true

      # CORRECTIF (audit) : ce projet n'a jamais eu d'outil de couverture
      # (aucun nyc/c8/istanbul dans package.json, "npm test" ne génère
      # aucun ./coverage/lcov.info) — cette étape échouait donc toujours
      # en cherchant un fichier qui n'existe jamais. fail_ci_if_error
      # évite de faire échouer tout le job "test" pour ça tant qu'aucune
      # instrumentation de couverture n'est réellement mise en place.
      - name: Upload test coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build Electron Application
  build:
    name: Build Electron App
    needs: [security-scan, lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist -- --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: churchoverlay-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  # Release (only on tagged releases)
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.event.release.tag_name, 'beta') || contains(github.event.release.tag_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to staging (on push to develop)
  deploy-staging:
    name: Deploy to Staging
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "Deploying to staging environment"
          # Add your deployment commands here
          # Example: scp, rsync, or deploy to cloud service

  # Deploy to production (on push to main)
  deploy-production:
    name: Deploy to Production
    needs: [build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment"
          # Add your production deployment commands here
          # Example: Update download server, notify users, etc.
