name: Build Windows Installer

# Builds the Windows installer (.exe, via electron-builder + NSIS) without
# needing a local Windows machine.
#
# Trigger:
#   - Automatic on a version tag (e.g. v1.0.0, v1.2.3)
#   - Manual ("Run workflow" button in the Actions tab)
#
# Result: the installer is attached to a GitHub Release when triggered by
# a tag, and always uploaded as a workflow artifact either way.

on:
  push:
    tags:
      # Match both v1.2.3 and V1.2.3 — this repo's tag history has both
      # casings, and a case-sensitive pattern here would silently never
      # trigger for the capitalized ones (no error anywhere, just no run).
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch: {}

# The default GITHUB_TOKEN only has "contents: read", which is enough to
# checkout but not to create a Release (softprops/action-gh-release needs
# write) — without this, release creation fails with a 403.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Build the installer
        # electron-builder auto-detects a "vX.Y.Z" tag and tries to publish
        # a GitHub Release itself, which needs GH_TOKEN and fails the build
        # if that isn't set at this step. --publish=never disables that —
        # the upload-artifact and softprops/action-gh-release steps below
        # handle publishing explicitly and predictably instead.
        run: npx electron-builder --win nsis --publish=never

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchOverlay-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Attach the installer to the GitHub Release (tag-triggered runs only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
