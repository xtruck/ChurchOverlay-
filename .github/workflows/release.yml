name: Build Windows Installer

# Builds the Windows installer (.exe, via electron-builder + NSIS) without
# needing a local Windows machine.
#
# Trigger:
#   - Automatic on a version tag (e.g. v1.0.0, v1.2.3)
#   - Manual ("Run workflow" button in the Actions tab)
#
# Result: the installer AND its SHA-256 checksums are attached to a GitHub
# Release when triggered by a tag, and always uploaded as a workflow
# artifact either way.
#
# S-02 hardening, three parts:
#   1. Every external action is pinned to a FULL COMMIT SHA (verified with
#      `git ls-remote <repo> refs/tags/<tag>{}`), never a moving tag — a
#      compromised or hijacked tag upstream cannot silently change what
#      runs here. Each pin carries the version it names in a comment.
#   2. BUILD and PUBLISH are separate jobs: the build job holds only
#      contents: read, and the release job — the only job with write
#      access — runs solely on a tag and consumes the built artifact.
#      A compromised build step can no longer publish anything.
#   3. The release publishes SHA256SUMS.txt as a release asset AND embeds
#      the checksums in the release notes, so a congregation downloading
#      the installer can verify it without trusting this page.

on:
  push:
    tags:
      # Match both v1.2.3 and V1.2.3 — this repo's tag history has both
      # casings, and a case-sensitive pattern here would silently never
      # trigger for the capitalized ones (no error anywhere, just no run).
      - "v*.*.*"
      - "V*.*.*"
  workflow_dispatch: {}

# Job-level grant only: the build job below inherits this read-only
# baseline; the release job is where write is elevated, on purpose.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The installer's filename and version come from package.json, not from
      # the tag. A tag that disagrees with it (v.1.0.5 once shipped a
      # "Setup 1.0.4.exe") would publish a mislabelled release, so fail fast.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -notmatch '^[vV]\d+\.\d+\.\d+$') {
            Write-Error "Tag '$tag' is not of the form vX.Y.Z"; exit 1
          }
          if ($tag.Substring(1) -ne $pkg) {
            Write-Error "Tag '$tag' does not match package.json version '$pkg'. Bump package.json first."; exit 1
          }
          Write-Host "Tag $tag matches package.json $pkg"

      - name: Install Node.js
        # v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      # CI (ci.yml) lints every push; the release build must not skip it.
      - name: Lint
        run: npm run lint

      # Never ship an installer from a commit whose test suite is red.
      # Runs on Windows on purpose: it's the operator's real platform, so
      # path/port quirks surface here rather than during a service.
      - name: Run the test suite
        run: npm test

      # electron-builder downloads Electron, NSIS and its resources from
      # GitHub at build time. A dropped connection there (ECONNRESET on
      # nsis-resources, seen on run #3) failed an otherwise complete build.
      # Cache those downloads between runs, and retry the step.
      - name: Cache Electron and electron-builder downloads
        # v6
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-dl-${{ runner.os }}-

      - name: Build the installer
        # electron-builder auto-detects a "vX.Y.Z" tag and tries to publish
        # a GitHub Release itself, which needs GH_TOKEN and fails the build
        # if that isn't set at this step. --publish=never disables that —
        # publishing is the release job's own responsibility, below.
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis --publish=never
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "electron-builder failed (attempt $attempt of 3), retrying in 20 s..."
            Start-Sleep -Seconds 20
          }
          exit 1

      - name: Generate the SHA-256 checksums (sha256sum -c compatible)
        # Standard "hash  filename" lines, lower-case hex — the same format
        # GNU sha256sum writes, so the file verifies with sha256sum -c on
        # Linux/macOS and Get-FileHash on Windows alike.
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe
          if (-not $files) { Write-Error "No installer found in release/"; exit 1 }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Write-Host "--- SHA256SUMS.txt ---"
          Get-Content release/SHA256SUMS.txt

      - name: Upload the installer and its checksums as a workflow artifact
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChurchOverlay-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  # The ONLY job with contents: write. It runs solely on a version tag and
  # consumes the artifact the read-only build job produced, so nothing in
  # the build path can publish.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the built installer and its checksums
        # v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ChurchOverlay-Windows-Installer
          path: dist

      - name: Build the release notes with the checksums inline
        shell: bash
        run: |
          {
            echo "## SHA-256 checksums"
            echo ""
            echo "Verify the installer after download — with \`sha256sum -c SHA256SUMS.txt\` (Linux/macOS) or \`Get-FileHash -Algorithm SHA256 <installer.exe>\` (Windows):"
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Attach the installer and the checksums to the GitHub Release
        # v2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
