name: Build Windows Installer

# Construit l'installeur Windows (.exe, via electron-builder + NSIS) sans
# avoir besoin d'une machine Windows locale.
#
# Déclenchement :
#   - Manuel (bouton "Run workflow" dans l'onglet Actions)
#   - Automatique sur un tag de version (ex: v1.0.0, v1.2.3)
#
# Résultat : l'installeur .exe est disponible en téléchargement dans
# l'onglet "Actions" -> le run correspondant -> "Artifacts". Si le run est
# déclenché par un tag, l'installeur est aussi joint à une Release GitHub.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Par défaut, le GITHUB_TOKEN généré automatiquement pour ce workflow n'a
# que la permission de lecture ("contents: read"), ce qui suffit pour
# checkout mais PAS pour créer une Release (softprops/action-gh-release en
# a besoin) -> erreur 403 "Resource not accessible by integration".
# On élève explicitement la permission à l'écriture pour ce workflow.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier que tous les fichiers requis sont packagés (anti-régression)
        run: npm run check-files

      - name: Construire l'installeur (electron-builder --win nsis)
        # electron-builder détecte automatiquement le tag "vX.Y.Z" et essaie
        # de publier lui-même une Release GitHub, ce qui exige GH_TOKEN et
        # fait échouer le build (exit 1) si cette variable n'est pas fournie
        # à CETTE étape. On ne veut pas de cette publication implicite : les
        # étapes suivantes (upload-artifact + softprops/action-gh-release)
        # s'en chargent déjà, de façon explicite et contrôlée.
        # --publish=never désactive ce comportement implicite (recommandé
        # par electron-builder lui-même dans le log : "please use --publish
        # explicitly").
        run: npx electron-builder --win nsis --publish=never

      - name: Uploader l'installeur comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchOverlay-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attacher l'installeur à la Release GitHub (si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
