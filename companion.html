<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- AJOUT (audit sécurité, extension aux pages servies sur le réseau) :
         contrairement aux fenêtres Electron déjà durcies (setup/overlay/
         dashboard/...), cette page est servie en HTTP à des appareils
         quelconques du réseau local qui scannent un QR code (voir
         http-routes.js > GET /companion) — c'est la surface la plus exposée
         de l'app, une CSP y a donc plus de valeur qu'ailleurs. script-src
         garde 'unsafe-inline' pour le <script> de la page (logique de
         polling/notes personnelles, pas encore externalisée) ; connect-src
         reste 'self' car tous les appels fetch() sont vers des chemins
         relatifs (/api/verses, /api/captions, /api/checkin) — toujours
         même origine que la page, quel que soit l'IP:port LAN utilisé pour
         y accéder. object-src/base-uri/form-action restent stricts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>ChurchOverlay — Mes versets</title>
    <link rel="stylesheet" href="design-tokens.css" />
    <style>
      /* CORRECTIF (redesign — élévation de l'identité visuelle) : polices
   auto-hébergées (voir dashboard/fonts/), au lieu de dépendre de Georgia
   (système) pour le corps de verset — Cormorant Garamond était déjà
   citée en intention dans le font-family d'origine mais jamais réellement
   chargée sur cette page (aucun @font-face/lien ici), donc silencieusement
   retombée sur Georgia à chaque affichage. IBM Plex Sans, déjà la police
   d'interface du reste de l'app, remplace le repli générique
   system-ui pour le "chrome" (libellés/actions) de cette page aussi. */
      @font-face {
        font-family: 'Cormorant Garamond';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('dashboard/fonts/cormorant-garamond-600-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('dashboard/fonts/ibm-plex-sans-400-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('dashboard/fonts/ibm-plex-sans-700-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* CORRECTIF (redesign) : --bg/--text/--accent/--border restent des
   ALIAS LOCAUX (pas un renommage direct dans les ~30 règles qui les
   consomment plus bas, y compris le bloc a2ui-* couplé en dur à
   a2ui-parser.js — renommer aurait forcé à toucher un fichier tiers pour
   rien) — mais pointent désormais vers design-tokens.css, la même
   palette que le reste de l'app plutôt qu'une quatrième copie figée.
   --bg-card n'a PAS besoin d'être redéfini ici : design-tokens.css utilise
   déjà ce même nom, ses règles de consommation (.verse-card, etc.)
   l'héritent donc directement du fichier partagé sans rien changer ici —
   le redéfinir localement en `var(--bg-card)` aurait créé une référence
   circulaire (valeur invalide).

   NOTE PRODUIT (toujours valable) : cette page est destinée à
   l'ASSEMBLÉE (téléphone personnel après scan d'un QR code en salle),
   volontairement sombre. PAS de synchronisation en direct de --accent
   possible ici : cette page ne parle jamais WebSocket (simple polling
   HTTP), --accent reste donc à réaligner à la main sur --primary. */
      :root {
        --bg: var(--bg-base);
        --text: var(--text-main);
        --accent: var(--primary);
        --border: var(--border-subtle);
        /* AJOUT (chantier "Diffusion des sous-titres en direct par QR code") :
     taille de police ajustable — multiplicateur appliqué au verset ET aux
     sous-titres (voir .verse-text/.caption-text plus bas), persisté en
     localStorage (voir le script). 1 = taille d'origine. */
        --font-scale: 1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Cormorant Garamond', Georgia, serif;
        padding: 20px 16px 60px;
      }
      header {
        text-align: center;
        margin-bottom: 24px;
      }
      header h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 4px;
        color: var(--accent);
        letter-spacing: 0.5px;
      }
      header p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--text-muted);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      #list {
        max-width: 560px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .verse-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 16px 18px;
      }
      .verse-ref {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .verse-text {
        font-size: calc(1.15rem * var(--font-scale));
        line-height: 1.5;
      }
      .verse-time {
        margin-top: 10px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.72rem;
        color: var(--text-muted);
      }
      /* AJOUT (compagnon congrégation — notes/surlignage personnels) : rangée
   d'actions par verset, note repliée par défaut pour ne pas alourdir la
   page tant qu'elle n'est pas utilisée. */
      .verse-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      .verse-action-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text-muted);
        font-size: 0.78rem;
        padding: 5px 10px;
        cursor: pointer;
        font-family: inherit;
      }
      .verse-action-btn svg {
        width: 13px;
        height: 13px;
        flex-shrink: 0;
      }
      .verse-action-btn.active {
        color: var(--accent);
        border-color: var(--accent);
        /* CORRECTIF (Mission Control) : dérivé de --accent via color-mix()
     plutôt qu'un rgba() figé, pour que ce fond suive automatiquement toute
     modification de la couleur d'accent — même principe que
     dashboard/dashboard.css. */
        background: color-mix(in srgb, var(--accent) 14%, transparent);
      }
      .verse-note {
        display: none;
        margin-top: 10px;
      }
      .verse-note.open {
        display: block;
      }
      .verse-note textarea {
        width: 100%;
        min-height: 60px;
        /* CORRECTIF (Mission Control) : encre sombre sur fond clair ->
     voile clair sur fond sombre, sinon ce champ de saisie devenait
     invisible (noir sur noir). */
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.88rem;
        padding: 8px 10px;
        resize: vertical;
        box-sizing: border-box;
      }
      .verse-note .saved-hint {
        font-size: 0.68rem;
        color: var(--text-muted);
        margin-top: 4px;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .verse-note .saved-hint.visible {
        opacity: 0.8;
      }
      #empty {
        text-align: center;
        color: var(--text-muted);
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.9rem;
        margin-top: 40px;
        padding: 0 20px;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.7rem;
        color: var(--text-muted);
        opacity: 0.6;
      }
      /* AJOUT (chantier 4.4 — sous-titres en direct, accessibilité) : bandeau
   discret sous l'en-tête, visible UNIQUEMENT quand l'opérateur a activé
   les sous-titres côté tableau de bord (voir /api/captions) — pas de
   présence visuelle du tout sinon, pour ne pas alourdir la page pour les
   cultes où cette fonctionnalité opt-in n'est pas utilisée. */
      #captionBar {
        display: none;
        max-width: 560px;
        margin: 0 auto 20px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 14px 18px;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      #captionBar.visible {
        display: block;
      }
      #captionBar .caption-label {
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      #captionBar .caption-text {
        font-size: calc(1rem * var(--font-scale));
        line-height: 1.4;
        color: var(--text);
      }
      #captionBar .caption-translation {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        font-size: calc(1rem * var(--font-scale));
        line-height: 1.4;
        color: var(--text-muted);
        font-style: italic;
      }
      /* AJOUT (chantier "Diffusion des sous-titres en direct par QR code") :
   contrôles taille de police + langue affichée — barre d'outils discrète,
   sans-serif comme le reste du "chrome" de la page (voir la note produit
   plus haut sur le partage serif-corps / sans-chrome). */
      #controlsBar {
        max-width: 560px;
        margin: 0 auto 16px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      .control-group {
        display: flex;
        gap: 4px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 3px;
      }
      .control-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 0.78rem;
        font-family: inherit;
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .control-btn.active {
        color: var(--bg);
        background: var(--accent);
      }
      #captionBar .caption-translation.hidden {
        display: none;
      }
      #empty.empty-state {
        display: none;
      }

      /* ==========================================================================
   AJOUT (chantier ultime — Generative UI A2UI). Habillage des éléments
   produits par A2UIParser.renderA2UI() (a2ui-parser.js) — classes fixes
   (a2ui-card/a2ui-text/a2ui-button/a2ui-gauge), jamais de style injecté
   depuis le contenu lui-même (voir a2ui-parser.js : uniquement
   createElement + textContent). Mêmes tokens de couleur que le reste de
   cette page (--bg-card/--accent/--border), pour rester visuellement
   cohérent avec le verset/les sous-titres au-dessus.
   ========================================================================== */
      #companionCard.hidden {
        display: none;
      }
      .companion-card-root {
        max-width: 560px;
        margin: 0 auto 20px;
      }
      .a2ui-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .a2ui-card-title {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--accent);
      }
      .a2ui-card-subtitle {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .a2ui-text {
        margin: 0;
        line-height: 1.5;
      }
      .a2ui-text--heading {
        font-weight: 700;
        font-size: 1.05rem;
      }
      .a2ui-text--muted {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-style: italic;
      }
      .a2ui-button {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      .a2ui-button--primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      .a2ui-button--danger {
        border-color: #e07a7a;
        color: #e07a7a;
      }
      .a2ui-gauge {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .a2ui-gauge progress {
        flex: 1;
        height: 8px;
        accent-color: var(--accent);
      }
      .a2ui-gauge-label {
        font-size: 0.78rem;
        color: var(--text-muted);
        white-space: nowrap;
      }

      #captionLangSelector.is-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Versets de ce culte</h1>
      <p>Se met à jour automatiquement — rien à faire</p>
    </header>

    <div id="controlsBar">
      <div class="control-group" role="group" aria-label="Taille du texte">
        <button type="button" class="control-btn" id="fontSmallerBtn" aria-label="Texte plus petit">
          A−
        </button>
        <button type="button" class="control-btn" id="fontResetBtn" aria-label="Taille normale">
          A
        </button>
        <button type="button" class="control-btn" id="fontBiggerBtn" aria-label="Texte plus grand">
          A+
        </button>
      </div>
      <div
        class="control-group"
        id="captionLangSelector"
        role="group"
        aria-label="Langue des sous-titres"
        class="is-hidden"
      >
        <button
          type="button"
          class="control-btn active"
          id="langOriginalBtn"
          data-lang-mode="original"
        >
          Originale
        </button>
        <button
          type="button"
          class="control-btn"
          id="langTranslationBtn"
          data-lang-mode="translation"
        >
          Traduction
        </button>
        <button type="button" class="control-btn" id="langBilingualBtn" data-lang-mode="bilingual">
          Bilingue
        </button>
      </div>
    </div>

    <div id="captionBar">
      <div class="caption-label">Sous-titres en direct</div>
      <div class="caption-text" id="captionText"></div>
      <div class="caption-translation hidden" id="captionTranslation"></div>
    </div>
    <div id="list"></div>
    <div id="empty" class="empty-state">
      Aucun verset affiché pour le moment. Cette page se mettra à jour dès qu'un verset apparaîtra à
      l'écran.
    </div>
    <div id="status"></div>

    <!-- AJOUT (chantier ultime — Generative UI A2UI) : fiche déclarative
         poussée par l'opérateur (résumé de sermon, réponse à une question,
         sondage — voir sermon-qa.js#buildSummaryCard/buildQuestionAnswerCard/
         buildPollCard), rendue ici via A2UIParser.renderA2UI() : catalogue
         fermé, jamais de innerHTML (voir a2ui-parser.js). Vide/masquée tant
         qu'aucune fiche n'est active. -->
    <div id="companionCard" class="companion-card-root hidden"></div>

    <!-- AJOUT (chantier ultime) : chargé AVANT le <script> inline ci-dessous
         (ordre de déclaration classique, pas de type="module" ici — voir la
         CSP script-src 'self' en tête de fichier, qui autorise déjà les
         scripts same-origin). parseA2UI()/renderA2UI() exposés sur
         window.A2UIParser (voir la fin de a2ui-parser.js). -->
    <script src="/a2ui-parser.js"></script>
    <script>
      /* AJOUT (audit — second écran pour l'assemblée, gratuit/léger) : simple
   polling JSON, pas de WebSocket ni de jeton — la même donnée que
   /api/health, déjà publique et non sensible (des versets déjà projetés
   en salle). Aucune dépendance externe. */
      const POLL_MS = 4000;
      let lastCount = -1;

      function formatTime(ts) {
        try {
          return new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
          return '';
        }
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      /* AJOUT (compagnon congrégation — notes/surlignage personnels, recommandation
   "Study Hub" simplifiée) : stockage UNIQUEMENT dans le navigateur du
   fidèle (localStorage) — aucune note personnelle n'est envoyée au
   serveur. Clé composite référence+horodatage : stable d'un sondage à
   l'autre pour un même verset, distincte si la même référence est
   réaffichée plus tard dans le culte. */
      const NOTES_KEY = 'churchoverlay_notes';

      function loadNotes() {
        try {
          return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
        } catch (e) {
          return {};
        }
      }

      function saveNotes(notes) {
        try {
          localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
        } catch (e) {
          /* stockage plein/indisponible (navigation privée) : dégrade en silence,
       la page reste utilisable sans persistance des notes. */
        }
      }

      function verseKey(v) {
        return `${v.reference || ''}::${v.timestamp || ''}`;
      }

      function render(verses) {
        const list = document.getElementById('list');
        const empty = document.getElementById('empty');

        if (!verses || verses.length === 0) {
          list.innerHTML = '';
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';

        const notes = loadNotes();

        // data-key porte la clé HTML-échappée (attribut) ; aucune interpolation
        // dans du JS inline (onclick="...") : délégation d'événements ci-dessous
        // à la place, plus sûre qu'échapper la clé pour un contexte JS en plus
        // du contexte HTML.
        list.innerHTML = verses
          .map((v) => {
            const key = verseKey(v);
            const entry = notes[key] || {};
            const keyAttr = escapeHtml(key);
            return `
    <div class="verse-card">
      <div class="verse-ref">${escapeHtml(v.reference || '')}</div>
      <div class="verse-text">${escapeHtml(v.text || '')}</div>
      ${v.timestamp ? `<div class="verse-time">${formatTime(v.timestamp)}</div>` : ''}
      <div class="verse-actions">
        <button type="button" class="verse-action-btn${entry.highlighted ? ' active' : ''}" data-action="highlight" data-key="${keyAttr}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3l2.5 5.5 6 .7-4.4 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.4-4.1 6-.7z"/></svg> Marquer</button>
        <button type="button" class="verse-action-btn" data-action="toggle-note" data-key="${keyAttr}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 17.5V20h2.5L18 8.5l-2.5-2.5L4 17.5z"/><path d="M13.5 4.5l3 3"/></svg> Ma note</button>
      </div>
      <div class="verse-note" data-note-key="${keyAttr}">
        <textarea aria-label="Votre note personnelle" placeholder="Votre note personnelle (visible uniquement sur cet appareil)..." data-key="${keyAttr}">${escapeHtml(entry.note || '')}</textarea>
        <div class="saved-hint" data-hint-key="${keyAttr}">Enregistré</div>
      </div>
    </div>
  `;
          })
          .join('');
      }

      // Délégation d'événements sur le conteneur (pas d'écouteur par carte à
      // reposer à chaque render()) — fonctionne aussi bien pour les cartes déjà
      // présentes que celles ajoutées lors du prochain rendu.
      document.getElementById('list').addEventListener('click', (event) => {
        const btn = event.target.closest('[data-action]');
        if (!btn) return;
        const key = btn.dataset.key;

        if (btn.dataset.action === 'highlight') {
          const notes = loadNotes();
          const entry = notes[key] || {};
          entry.highlighted = !entry.highlighted;
          notes[key] = entry;
          saveNotes(notes);
          btn.classList.toggle('active', entry.highlighted);
        } else if (btn.dataset.action === 'toggle-note') {
          const noteEl = document.querySelector(`.verse-note[data-note-key="${CSS.escape(key)}"]`);
          if (noteEl) noteEl.classList.toggle('open');
        }
      });

      let saveNoteTimer = null;
      document.getElementById('list').addEventListener('input', (event) => {
        const textarea = event.target.closest('textarea[data-key]');
        if (!textarea) return;
        const key = textarea.dataset.key;
        const value = textarea.value;

        clearTimeout(saveNoteTimer);
        saveNoteTimer = setTimeout(() => {
          const notes = loadNotes();
          const entry = notes[key] || {};
          entry.note = value;
          notes[key] = entry;
          saveNotes(notes);
          const hint = document.querySelector(`[data-hint-key="${CSS.escape(key)}"]`);
          if (hint) {
            hint.classList.add('visible');
            setTimeout(() => hint.classList.remove('visible'), 1500);
          }
        }, 400);
      });

      async function poll() {
        try {
          const res = await fetch('/api/verses', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const verses = Array.isArray(data.verses) ? data.verses : [];
          if (verses.length !== lastCount) {
            lastCount = verses.length;
            render(verses);
          }
          document.getElementById('status').textContent = '';
        } catch (err) {
          document.getElementById('status').textContent =
            'Connexion au serveur perdue — nouvelle tentative...';
        }
      }

      /* AJOUT (chantier "Diffusion des sous-titres en direct par QR code") :
   taille de police ajustable, persistée par appareil (localStorage) —
   s'applique au verset ET aux sous-titres via --font-scale (voir CSS). */
      const FONT_SCALE_KEY = 'churchoverlay_font_scale';
      const FONT_SCALE_MIN = 0.8;
      const FONT_SCALE_MAX = 1.7;
      const FONT_SCALE_STEP = 0.15;

      function applyFontScale(scale) {
        const clamped = Math.min(FONT_SCALE_MAX, Math.max(FONT_SCALE_MIN, scale));
        document.documentElement.style.setProperty('--font-scale', String(clamped));
        try {
          localStorage.setItem(FONT_SCALE_KEY, String(clamped));
        } catch (e) {
          /* stockage indisponible (navigation privée) : le réglage ne survivra pas au rechargement, sans conséquence sur la lecture actuelle */
        }
      }

      (function initFontScale() {
        let saved = 1;
        try {
          saved = parseFloat(localStorage.getItem(FONT_SCALE_KEY)) || 1;
        } catch (e) {
          saved = 1;
        }
        applyFontScale(saved);
      })();

      document.getElementById('fontSmallerBtn').addEventListener('click', () => {
        applyFontScale(
          parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) -
            FONT_SCALE_STEP
        );
      });
      document.getElementById('fontBiggerBtn').addEventListener('click', () => {
        applyFontScale(
          parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--font-scale')) +
            FONT_SCALE_STEP
        );
      });
      document.getElementById('fontResetBtn').addEventListener('click', () => applyFontScale(1));

      /* AJOUT (chantier "Diffusion des sous-titres en direct par QR code") :
   sélecteur de langue pour les sous-titres — "Langue originale" (le
   transcript brut) / "Traduction" (dans la langue UNIQUE configurée côté
   opérateur, voir sessionState.getCaptionTargetLang()) / "Bilingue" (les
   deux). PAS de choix "FR" et "EN" séparés et simultanés : caption-
   translator.js ne traduit QUE vers UNE langue cible à la fois, par
   segment (voir son garde-fou de throttle/quota partagé en en-tête) —
   traduire vers plusieurs langues à chaque segment multiplierait les
   appels LLM par autant de langues proposées, contraire à ce garde-fou.
   Persisté par appareil (localStorage), comme la taille de police. */
      const CAPTION_LANG_MODE_KEY = 'churchoverlay_caption_lang_mode';
      let captionLangMode = 'original';
      try {
        captionLangMode = localStorage.getItem(CAPTION_LANG_MODE_KEY) || 'original';
      } catch (e) {
        captionLangMode = 'original';
      }

      function setCaptionLangMode(mode) {
        captionLangMode = mode;
        try {
          localStorage.setItem(CAPTION_LANG_MODE_KEY, mode);
        } catch (e) {
          /* pas grave — le choix ne survivra pas au rechargement */
        }
        document.querySelectorAll('#captionLangSelector .control-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.langMode === mode);
        });
        renderCaptionBar(lastCaptionData);
      }

      document.querySelectorAll('#captionLangSelector .control-btn').forEach((btn) => {
        btn.addEventListener('click', () => setCaptionLangMode(btn.dataset.langMode));
      });

      /* AJOUT (chantier 4.4 — sous-titres en direct) : sondage séparé de
   /api/verses ci-dessus (fréquence différente possible plus tard,
   préoccupations distinctes) — même tolérance aux pannes (silencieuse,
   la page reste utilisable même si cet appel échoue). Intervalle plus
   court que POLL_MS (voir CAPTION_POLL_MS ci-dessous) : un sous-titre
   qui traîne 4s de retard se remarque bien plus qu'un nouveau verset
   projeté par ailleurs déjà en salle. */
      const CAPTION_POLL_MS = 1500;
      let lastCaptionTimestamp = null;
      let lastCaptionData = null;

      function renderCaptionBar(data) {
        const bar = document.getElementById('captionBar');
        const langSelector = document.getElementById('captionLangSelector');
        if (!data || !data.enabled || !data.text) {
          bar.classList.remove('visible');
          langSelector.style.display = 'none';
          return;
        }
        bar.classList.add('visible');
        // Le sélecteur de langue n'a de sens que si une traduction existe
        // réellement pour ce culte — pas affiché sinon (rien à choisir).
        langSelector.style.display = data.translationEnabled ? 'flex' : 'none';

        const textEl = document.getElementById('captionText');
        const translationEl = document.getElementById('captionTranslation');
        const hasTranslation = data.translationEnabled && !!data.translation;
        const mode = hasTranslation ? captionLangMode : 'original';

        if (mode === 'translation') {
          textEl.textContent = data.translation;
          translationEl.style.display = 'none';
        } else if (mode === 'bilingual') {
          textEl.textContent = data.text;
          translationEl.textContent = data.translation;
          translationEl.style.display = 'block';
        } else {
          textEl.textContent = data.text;
          translationEl.style.display = 'none';
        }
      }

      async function pollCaptions() {
        try {
          const res = await fetch('/api/captions', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (!data.enabled || !data.text) {
            lastCaptionData = data;
            renderCaptionBar(data);
            return;
          }
          if (data.timestamp !== lastCaptionTimestamp) {
            lastCaptionTimestamp = data.timestamp;
            lastCaptionData = data;
            renderCaptionBar(data);
          }
        } catch (err) {
          /* silencieux — le statut de connexion est déjà géré par poll() ci-dessus */
        }
      }

      /* AJOUT (chantier 4.6 — présence anonyme, analytics d'engagement) : un
         seul POST par onglet/session de navigateur (sessionStorage, pas
         localStorage -- se réarme si le fidèle revient plus tard dans le
         même culte avec un nouvel onglet/après avoir fermé le précédent, ce
         qui reste un signal d'engagement valide plutôt qu'un doublon à
         éviter à tout prix). Aucune donnée personnelle envoyée -- voir
         session-store.js#recordCheckin(), un horodatage anonyme, rien
         d'autre. Best-effort silencieux : un échec ici ne doit jamais gêner
         la lecture des versets/sous-titres, le seul but réel de cette page.
      */
      (function checkinOnce() {
        const CHECKIN_KEY = 'churchoverlay_checked_in';
        if (sessionStorage.getItem(CHECKIN_KEY)) return;
        fetch('/api/checkin', { method: 'POST' })
          .then(() => sessionStorage.setItem(CHECKIN_KEY, '1'))
          .catch(() => {
            /* pas grave — réessaiera au prochain chargement de page */
          });
      })();

      /* AJOUT (chantier ultime — Generative UI A2UI) : même style de polling
   que pollCaptions() ci-dessus, sondage indépendant sur sa propre route
   (/api/companion-card). lastCardKey évite de redessiner (et donc de
   perdre un focus/état d'interaction éventuel) à chaque sondage quand la
   fiche n'a pas changé depuis le dernier passage. */
      let lastCardKey = null;

      function renderCompanionCard(card) {
        const container = document.getElementById('companionCard');
        if (!container) return;
        if (!card) {
          container.classList.add('hidden');
          container.innerHTML = '';
          lastCardKey = null;
          return;
        }
        const key = JSON.stringify(card);
        if (key === lastCardKey) return;
        lastCardKey = key;
        container.innerHTML = '';
        container.classList.remove('hidden');
        if (!window.A2UIParser) return; // a2ui-parser.js pas encore chargé — prochain sondage réessaiera
        try {
          container.appendChild(
            window.A2UIParser.renderA2UI(card, (action) => {
              // AJOUT (sondage interactif) : `action` reste un identifiant
              // OPAQUE (voir a2ui-parser.js) — jamais exécuté ici, seulement
              // posté au serveur comme une réaction anonyme, même esprit que
              // /api/checkin (aucune donnée personnelle, best-effort silencieux).
              fetch('/api/companion-card/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action }),
              }).catch(() => {
                /* pas grave — une réaction perdue n'empêche jamais la lecture */
              });
            })
          );
        } catch (err) {
          // Fiche malformée malgré la validation serveur (parseA2UI) —
          // ne doit JAMAIS casser le reste de la page (verset/sous-titres).
          container.classList.add('hidden');
        }
      }

      async function pollCompanionCard() {
        try {
          const res = await fetch('/api/companion-card', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          renderCompanionCard(data.card);
        } catch (err) {
          /* silencieux — même discipline que pollCaptions() ci-dessus */
        }
      }

      poll();
      setInterval(poll, POLL_MS);
      pollCaptions();
      setInterval(pollCaptions, CAPTION_POLL_MS);
      pollCompanionCard();
      setInterval(pollCompanionCard, POLL_MS);
    </script>
  </body>
</html>
