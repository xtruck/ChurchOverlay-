name: Build Windows Installer

# Construit l'installeur Windows (.exe, via electron-builder + NSIS) sans
# avoir besoin d'une machine Windows locale.
#
# Déclenchement :
#   - Manuel (bouton "Run workflow" dans l'onglet Actions)
#   - Automatique sur un tag de version (ex: v1.0.0, v1.2.3)
#
# Résultat : l'installeur .exe est disponible en téléchargement dans
# l'onglet "Actions" -> le run correspondant -> "Artifacts". Si le run est
# déclenché par un tag, l'installeur est aussi joint à une Release GitHub.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installeur (electron-builder --win nsis)
        run: npm run dist

      - name: Uploader l'installeur comme artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChurchOverlay-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attacher l'installeur à la Release GitHub (si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
