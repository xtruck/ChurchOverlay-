<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- AJOUT (audit sécurité Electron, Phase 3) : même politique et mêmes
     raisons que setup.html (script inline existant, connect-src large pour
     le port serveur dynamique). -->
<meta
  http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self' ws: wss: http: https:; object-src 'none'; base-uri 'none'; form-action 'none';"
/>
<title>ChurchOverlay — Écran scène</title>
<link rel="stylesheet" href="design-tokens.css">
<!--
  ============================================================================
  stage-display.html — Écran dédié aux musiciens/chantres
  ----------------------------------------------------------------------------
  AJOUT (recommandation "Stage Display" façon ProPresenter) : page DISTINCTE
  de overlay.html (pas un thème/mode de la même page) — le contenu ici n'est
  JAMAIS destiné au public. Volontairement minimale (pas d'animations, pas de
  thèmes/dégradés) : gros texte lisible de loin, fond neutre, rien qui
  distraie un musicien en train de jouer.

  Écoute les MÊMES diffusions 'showVerse'/'hideVerse' que overlay.html (les
  musiciens voient ce que l'assemblée voit), plus deux diffusions qui
  n'existent QUE pour cette page : 'stageMessage'/'stageMessageClear' — un
  message texte de l'opérateur vers la scène, qui ne passe jamais par
  l'overlay public (voir server.js, action 'sendStageMessage').

  Se connecte exactement comme overlay.html (getWsToken/getWsPort depuis
  window.location.search, injectés par main.js via createDisplayWindow) —
  code dupliqué plutôt que partagé : ce fichier tourne dans une fenêtre
  Electron séparée, sans accès aux fonctions de overlay.html.
  ============================================================================
-->
<style>
  :root {
    /* CORRECTIF (chantier redesign — élévation de l'identité visuelle) :
       --bg/--text/--text-dim/--ok/--warn/--err (copies figées en dur)
       remplacés par design-tokens.css, mêmes valeurs — voir son en-tête.
       EXCEPTION VOLONTAIRE PRÉSERVÉE (raison toujours valable, voir
       l'historique du fichier) : cet écran reste sombre en toute
       circonstance — consulté sous un éclairage de scène déjà très
       lumineux, souvent dans une salle par ailleurs obscurcie, un fond
       clair y serait un vrai problème d'usage (éblouissement, casse
       l'adaptation à l'obscurité), pas juste un choix esthétique
       différent. Le partage du fichier de tokens ne change rien à ça : la
       valeur PAR DÉFAUT de --bg-base y est déjà sombre. */
    --bg: var(--bg-base);
    --text: var(--text-main);
    --ok: var(--accent-emerald);
    --warn: var(--accent-amber);
    --warn-ink: var(--on-primary);
    --err: var(--accent-rose);
    /* --accent est écrasé EN DIRECT par le tableau de bord (voir le bloc
       'init'/'dashboardBrandingUpdate' dans le <script> plus bas) — cette
       valeur n'est que le repli avant la première réponse du serveur,
       dérivée de --primary (design-tokens.css) plutôt qu'une troisième
       copie figée de la même couleur. Doit rester alignée sur
       DEFAULT_ACCENT_COLOR dans dashboard/features/dashboard-branding.js. */
    --accent: var(--primary);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 3vh 4vw;
  }
  /* AJOUT (redesign) : légende au-dessus du chrono — un lecteur qui n'a
     jamais vu cet écran ne devinait pas ce que "00:00" mesurait. Petite
     capitale espacée, ton discret (--text-dim), même convention que les
     étiquettes du tableau de bord (MICRO / CLÉS API...) — ne change rien à
     la consigne "aucune distraction visuelle", juste une légende statique. */
  #timerLabel {
    font-family: var(--font-mono);
    font-size: 1.4vh;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0.75;
    margin-bottom: 0.3vh;
  }
  #timer {
    font-family: var(--font-mono);
    font-size: 3.2vh;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2vh;
  }
  #reference {
    font-size: 3.4vh;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  #text {
    font-size: 5.5vh;
    line-height: var(--leading-relaxed);
    max-width: 90vw;
    white-space: pre-wrap;
  }
  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6vh;
    color: var(--text-dim);
  }
  #placeholder svg {
    width: 5vh;
    height: 5vh;
    opacity: 0.5;
  }
  #placeholder span {
    font-size: 3vh;
  }
  #reference,
  #text {
    display: none;
  }
  /* AJOUT (redesign) : préfixe "MESSAGE" — un texte qui apparaît soudain en
     bas d'écran pendant qu'un musicien joue doit se lire comme une
     notification, pas comme un sous-titre anonyme ; le préfixe permet de
     comprendre la nature du texte en vision périphérique, sans lire la
     phrase entière. */
  #stageMessage {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 2.2vh 4vw 2.5vh;
    background: var(--warn);
    color: var(--warn-ink);
    text-align: center;
    box-shadow: var(--shadow-e3);
  }
  #stageMessage.visible { display: block; }
  #stageMessagePrefix {
    display: block;
    font-family: var(--font-mono);
    font-size: 1.5vh;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 0.6vh;
  }
  #stageMessageText {
    font-size: 4vh;
    font-weight: 700;
  }
  #connIndicator {
    position: fixed;
    top: 2vh; right: 3vw;
    width: 1.4vh; height: 1.4vh;
    border-radius: 50%;
    background: var(--err);
  }
  #connIndicator.connected { background: var(--ok); }
</style>
</head>
<body>

<div id="connIndicator" title="État de la connexion"></div>
<div id="timerLabel">Temps écoulé</div>
<div id="timer">00:00</div>

<div id="main">
  <div id="placeholder">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v5l3 3"></path>
    </svg>
    <span>En attente...</span>
  </div>
  <div id="reference"></div>
  <div id="text"></div>
</div>

<div id="stageMessage">
  <span id="stageMessagePrefix">Message</span>
  <span id="stageMessageText"></span>
</div>

<script>
'use strict';

// Identique à overlay.html — voir son commentaire pour le raisonnement complet.
const getWsToken = () => new URLSearchParams(window.location.search).get('token');
const getWsPort = () => new URLSearchParams(window.location.search).get('port') || '8765';
const getWsUrl = () => {
  if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    return `${proto}//${window.location.host}`;
  }
  return `ws://localhost:${getWsPort()}`;
};

let ws = null;
let reconnectTimer = null;

function showReferenceText(reference, text) {
  document.getElementById('placeholder').style.display = 'none';
  const refEl = document.getElementById('reference');
  const textEl = document.getElementById('text');
  refEl.textContent = reference || '';
  refEl.style.display = reference ? 'block' : 'none';
  textEl.textContent = text || '';
  textEl.style.display = text ? 'block' : 'none';
}

function clearReferenceText() {
  document.getElementById('placeholder').style.display = 'block';
  document.getElementById('reference').style.display = 'none';
  document.getElementById('text').style.display = 'none';
}

// AJOUT (chantier "Mission Control" — couleur d'accent réellement
// modifiable, pas une seconde copie figée) : le sélecteur de couleur qui
// existe déjà dans le tableau de bord (dashboardAccentColorInput ->
// 'setDashboardAccentColor') est désormais suivi PAR CETTE PAGE aussi.
//
// Aucune nouvelle plomberie serveur n'a été nécessaire : le message 'init'
// envoyé à CHAQUE connexion contient déjà `dashboardBranding` (voir
// server.js > getDashboardBrandingState()), et 'dashboardBrandingUpdate' est
// diffusé par broadcast() SANS l'option operatorOnly (voir
// branding-ws-handlers.js) — donc un client 'viewer' comme celui-ci recevait
// déjà ces deux messages, il les ignorait simplement. On se contente de les
// lire. Une couleur invalide est ignorée plutôt qu'injectée telle quelle
// dans le CSS (le serveur valide déjà via validation.js, ceinture et
// bretelles : ce champ voyage sur le réseau local).
const HEX_COLOR_RE = /^#[0-9a-f]{6}$/i;
function applyAccentColor(branding) {
  if (!branding || !HEX_COLOR_RE.test(branding.accentColor || '')) return;
  document.documentElement.style.setProperty('--accent', branding.accentColor);
}

function showStageMessage(text) {
  document.getElementById('stageMessageText').textContent = text;
  document.getElementById('stageMessage').classList.add('visible');
}

function clearStageMessage() {
  document.getElementById('stageMessage').classList.remove('visible');
}

function connectWs() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

  try {
    const token = getWsToken();
    ws = token ? new WebSocket(getWsUrl(), [token]) : new WebSocket(getWsUrl());
  } catch (e) {
    console.error('[stage-display] Error creating WS:', e);
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    console.log('[stage-display] WebSocket connecté');
    document.getElementById('connIndicator').classList.add('connected');
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
  };

  ws.onmessage = (event) => {
    let msg;
    try {
      msg = JSON.parse(event.data);
    } catch {
      return;
    }
    if (!msg || !msg.action) return;

    switch (msg.action) {
      case 'init':
        applyAccentColor(msg.dashboardBranding);
        break;
      case 'dashboardBrandingUpdate':
        applyAccentColor(msg.branding);
        break;
      case 'showVerse':
        showReferenceText(msg.reference, msg.text);
        break;
      case 'hideVerse':
      case 'emergencyClear':
        clearReferenceText();
        break;
      case 'stageMessage':
        showStageMessage(msg.text);
        break;
      case 'stageMessageClear':
        clearStageMessage();
        break;
    }
  };

  ws.onclose = () => {
    console.log('[stage-display] WebSocket déconnecté');
    document.getElementById('connIndicator').classList.remove('connected');
    scheduleReconnect();
  };

  ws.onerror = (err) => {
    console.error('[stage-display] WebSocket error:', err);
  };
}

function scheduleReconnect() {
  if (!reconnectTimer) {
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connectWs();
    }, 3000);
  }
}

connectWs();

// Minuteur local (temps écoulé depuis l'ouverture de cet écran) — volontairement
// simple, pas synchronisé avec le serveur : un repère approximatif pour les
// musiciens ("ça fait 12 minutes qu'on joue"), pas une horloge de précision.
const startedAt = Date.now();
function tickTimer() {
  const elapsedS = Math.floor((Date.now() - startedAt) / 1000);
  const mm = String(Math.floor(elapsedS / 60)).padStart(2, '0');
  const ss = String(elapsedS % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${mm}:${ss}`;
}
setInterval(tickTimer, 1000);
tickTimer();
</script>
</body>
</html>
